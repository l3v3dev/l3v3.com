<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Water ring / border -->
  <rect x="0" y="0" width="800" height="600" fill="#0d0d1a"/>
  
  <!-- Main rock platform: roughly circular organic shape -->
  <path d="M 120,300
    C 120,180 200,100 350,100
    C 500,100 650,120 700,200
    C 720,300 720,400 680,480
    C 600,520 450,530 350,520
    C 250,510 180,480 140,420
    C 110,380 100,350 120,300 Z"
    fill="#1a1a2e"/>
  
  <!-- Wet stone splotches: irregular blobs of #252540 -->
  <path d="M 200,200
    C 260,180 340,190 380,220
    C 400,260 370,300 320,310
    C 280,320 240,300 220,270
    C 200,250 190,230 200,200 Z"
    fill="#252540"/>
  
  <path d="M 450,150
    C 520,140 580,160 600,200
    C 610,240 580,280 540,290
    C 500,300 460,280 450,250
    C 440,220 450,180 450,150 Z"
    fill="#252540"/>
  
  <path d="M 300,380
    C 360,370 420,380 460,400
    C 480,430 470,470 430,480
    C 390,490 340,480 320,460
    C 300,440 290,410 300,380 Z"
    fill="#252540"/>
  
  <path d="M 550,350
    C 600,340 640,360 650,390
    C 660,420 640,450 610,460
    C 580,470 550,460 540,440
    C 530,420 540,390 550,350 Z"
    fill="#252540"/>
  
  <path d="M 150,350
    C 180,340 210,350 230,370
    C 240,390 230,410 210,420
    C 190,430 170,420 160,400
    C 150,380 150,360 150,350 Z"
    fill="#252540"/>
  
  <path d="M 380,250
    C 420,240 460,250 480,270
    C 490,290 480,310 460,320
    C 440,330 420,320 410,300
    C 400,280 390,260 380,250 Z"
    fill="#252540"/>
  
  <!-- Small scattered splotches -->
  <ellipse cx="250" cy="150" rx="40" ry="25" fill="#252540"/>
  <ellipse cx="620" cy="450" rx="35" ry="22" fill="#252540"/>
  <ellipse cx="400" cy="450" rx="30" ry="20" fill="#252540"/>
  <ellipse cx="500" cy="180" rx="28" ry="18" fill="#252540"/>
  
  <!-- Thin crack lines -->
  <path d="M 320,200 L 340,230 L 355,260" stroke="#101020" stroke-width="2" fill="none"/>
  <path d="M 500,300 L 520,330 L 540,350" stroke="#101020" stroke-width="2" fill="none"/>
  <path d="M 250,400 L 270,430 L 290,450" stroke="#101020" stroke-width="2" fill="none"/>
  <path d="M 420,150 L 440,180 L 460,200" stroke="#101020" stroke-width="2" fill="none"/>
  
  <!-- Small pebble ellipses -->
  <ellipse cx="350" cy="320" rx="12" ry="8" fill="#33334f"/>
  <ellipse cx="520" cy="250" rx="10" ry="7" fill="#33334f"/>
  <ellipse cx="280" cy="420" rx="11" ry="7" fill="#33334f"/>
  <ellipse cx="450" cy="380" rx="9" ry="6" fill="#33334f"/>
</svg>