    <button class="consent-button consent-button-secondary" id="consent-reject" type="button">No</button>
    <button class="consent-button" id="consent-accept" type="button">Ok</button>
  </div>
</div>

<script>
  (function() {
    const KEY = "l3v3.theme";
    const validThemes = ["dark", "light", "arcade", "field", "whimsy", "swipe", "fisheye", "carousel", "purple", "candy", "storybook", "graffiti", "bubblegum", "artnouveau", "pixel"];
    const dialog = document.getElementById("themes-dialog");
    const form = document.getElementById("themes-form");
    const reset = document.getElementById("theme-reset");
    const footerLinks = document.querySelector("footer .footer-links");

    function applyTheme(theme) {
      const selectedTheme = validThemes.includes(theme) ? theme : "dark";
      if (selectedTheme === "dark") {
        document.documentElement.removeAttribute("data-theme");
      } else {
        document.documentElement.dataset.theme = selectedTheme;
      }
      const input = form.querySelector(`input[value="${selectedTheme}"]`);
      if (input) input.checked = true;
    }

    function saveTheme(theme) {
      applyTheme(theme);
      try {
        localStorage.setItem(KEY, theme);
      } catch (error) {
        // The selected theme still applies for this page when storage is unavailable.
      }
    }

    let savedTheme = "dark";
    try {
      savedTheme = localStorage.getItem(KEY) || "dark";
    } catch (error) {
      // Use the default theme when storage is unavailable.
    }
    applyTheme(savedTheme);

    document.querySelectorAll(".carousel-controls button").forEach(function(button) {
      button.addEventListener("click", function() {
        const games = document.getElementById("games");
        const visibleCards = games.querySelectorAll(".game-card:not(.hidden)");
        if (!visibleCards.length) return;
        const gap = Number.parseFloat(getComputedStyle(games).gap) || 0;
        const step = visibleCards[0].getBoundingClientRect().width + gap;
        games.scrollBy({ left: Number(button.dataset.direction) * step, behavior: "smooth" });
      });
    });

    if (footerLinks && dialog) {
      const button = document.createElement("button");
      button.className = "theme-button";
      button.type = "button";
      button.textContent = "Themes";
      button.addEventListener("click", function() {
        dialog.showModal();
      });
      footerLinks.prepend(button);
    }

    form.addEventListener("change", function(event) {
      if (event.target.name === "theme") saveTheme(event.target.value);
    });

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      dialog.close();
    });

    reset.addEventListener("click", function() {
      try {
        localStorage.removeItem(KEY);
      } catch (error) {
        // The default still applies for this page when storage is unavailable.
      }
      applyTheme("dark");
      dialog.close();
    });
  })();
</script>
<script>
  const filterButtons = Array.from(document.querySelectorAll(".filter-button"));
  const gameCards = Array.from(document.querySelectorAll(".game-card"));

  filterButtons.forEach((button) => {
    button.addEventListener("click", () => {
      const category = button.dataset.category;
      filterButtons.forEach((item) => item.classList.toggle("active", item === button));
      gameCards.forEach((card) => {
        const show = category === "All" || card.dataset.category === category;
        card.classList.toggle("hidden", !show);
      });
    });
  });

  const gameInfo = document.getElementById("game-info");
  const infoTitle = document.getElementById("info-title");
  const infoCategory = document.getElementById("info-category");
  const infoDescription = document.getElementById("info-description");
  const infoTags = document.getElementById("info-tags");
  const infoControls = document.getElementById("info-controls");
  const infoMedia = document.getElementById("info-media");

  gameInfo.addEventListener("close", () => infoMedia.replaceChildren());

  gameCards.forEach((card) => {
    const infoButton = card.querySelector(".info-button");
    if (!infoButton) return;

    infoButton.addEventListener("click", (event) => {
      event.preventDefault();
      event.stopPropagation();

      const title = card.querySelector(".game-name").textContent.trim();
      const category = card.dataset.category;
      infoTitle.textContent = title;
      infoCategory.textContent = "";//category === "All" ? "Game" : category;
      infoDescription.textContent = "";//`${title}`;
      infoTags.textContent = "";//category === "All" ? "More games" : category;
      infoControls.replaceChildren();
      infoMedia.replaceChildren();

      if (card.dataset.trailer) {
        const trailer = document.createElement("iframe");
        trailer.title = `${title} trailer`;
        trailer.style.cssText = "display:block;width:100%;aspect-ratio:16/9;border:0";
        trailer.src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(card.dataset.trailer)}?mute=1`;
        trailer.allow = "accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share";
        trailer.allowFullscreen = true;
        trailer.referrerPolicy = "strict-origin-when-cross-origin";

        infoMedia.append(trailer);
      }

      gameInfo.showModal();
    });
  });

  const moreLink = document.getElementById("more-link");
  if (moreLink && typeof gtag === "function") {
    moreLink.addEventListener("click", function() {
      gtag("event", "more_interest_click", {
        event_category: "engagement",
        event_label: "oauth_under_construction"
      });
    });
  }
</script>
<script>
  (function() {
    const KEY = "l3v3.analyticsConsent";
    const REQUIRE_ANALYTICS_CONSENT_FOR_US = false;
    const banner = document.getElementById("consent-banner");
    const accept = document.getElementById("consent-accept");
    const reject = document.getElementById("consent-reject");

    function hideBanner() {
      if (banner) banner.classList.add("hidden");
    }

    function isUsVisitor() {
      const languages = Array.isArray(navigator.languages) ? navigator.languages : [navigator.language || ""];
      return languages.some(function(language) {
        const languageCode = String(language || "").toLowerCase();
        return languageCode === "en-us" || languageCode.startsWith("en-us") || languageCode.endsWith("-us");
      });
    }

    function consentIsRequired() {
      return !isUsVisitor() || REQUIRE_ANALYTICS_CONSENT_FOR_US;
    }

    function loadAnalytics() {
      if (window.dataLayer) return;

      const existing = document.querySelector("script[data-l3v3-gtag]");
      if (existing) return;

      const gtagScript = document.createElement("script");
      gtagScript.async = true;
      gtagScript.src = "https://www.googletagmanager.com/gtag/js?id=G-FW4YV3KZ23";
      gtagScript.dataset.l3v3Gtag = "true";
      document.head.appendChild(gtagScript);

      const inline = document.createElement("script");
      inline.dataset.l3v3Gtag = "true";
      inline.textContent = "window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-FW4YV3KZ23');";
      document.head.appendChild(inline);
    }

    function saveConsent(value) {
      try {
        localStorage.setItem(KEY, value);
      } catch (error) {
        // Browsers may block storage; the site still works without analytics.
      }
      hideBanner();
      if (value === "accepted") {
        loadAnalytics();
      }
    }

    try {
      const consent = localStorage.getItem(KEY);
      if (consent === "accepted") {
        hideBanner();
        loadAnalytics();
      } else if (consent === "rejected") {
        hideBanner();
      } else if (!consentIsRequired()) {
        saveConsent("accepted");
      } else if (banner) {
        banner.classList.remove("hidden");
      }
    } catch (error) {
      if (!consentIsRequired()) {
        saveConsent("accepted");
      } else if (banner) {
        banner.classList.remove("hidden");
      }
    }

    if (accept) accept.addEventListener("click", function() {
      saveConsent("accepted");
    });

    if (reject) reject.addEventListener("click", function() {
      saveConsent("rejected");
    });
  })();
</script>
