<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>l3v3</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{background:#0b0b0b;color:#e8e8e8;font-family:system-ui,sans-serif;display:flex;justify-content:center}
    main{width:100%;max-width:760px;padding:80px 24px}
    header{margin-bottom:70px}
    .logo{color:#fff;font-size:32px;font-weight:700;text-decoration:none}
    .tagline{margin-top:10px;color:#777;font-size:15px}
    h1{margin:0 0 18px;color:#666;font-size:14px;font-weight:500;letter-spacing:2px;text-transform:uppercase}
    .games{display:flex;flex-direction:column}
    .game{display:flex;align-items:center;justify-content:space-between;padding:20px 18px;margin:0 -18px;border-radius:8px;color:#eee;text-decoration:none;transition:background .15s}
    .game:hover{background:#151515}
    .game-name{font-size:19px;font-weight:500}
    .arrow{color:#555;font-size:20px;transition:transform .15s,color .15s}
    .game:hover .arrow{color:#aaa;transform:translateX(4px)}
    #status{margin-top:20px;color:#666;font-size:13px;min-height:20px}
    footer{margin-top:100px;color:#444;font-size:13px}
  </style>
</head>
<body>
<main>
  <header>
    <a class="logo" href="/">l3v3</a>
    <div class="tagline">l1v3 l0v3 l3v3</div>
  </header>
  <section>
    <h1>Games</h1>
    <div class="games">
      <a href="/games/lighthouse-keeper/" class="game">
        <span class="game-name">Lighthouse Keeper</span>
        <span class="arrow">→</span>
      </a>
    </div>
    <div id="status"></div>
  </section>
  <footer>© 2026 l3v3</footer>
</main>
<script src="launcher.js"></script>
</body>
</html>
