<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>l3v3.com simsports</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111827;
            font-family: system-ui, -apple-system, sans-serif;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
            user-select: none;
        }
        
        /* Top Navigation Header Panel */
        #header-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1f2937;
            padding: 0 20px;
            height: 65px;
            box-sizing: border-box;
            border-bottom: 2px solid #374151;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            z-index: 10;
            flex-shrink: 0;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        h1 {
            margin: 0;
            font-size: 1.1rem;
            color: #10b981;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        select, button {
            padding: 8px 12px;
            background: #111827;
            color: #f3f4f6;
            border: 1px solid #4b5563;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        select:focus, button:hover {
            border-color: #10b981;
            outline: none;
        }

        button {
            background: #10b981;
            color: #042f2e;
            font-weight: bold;
            border: none;
            transition: background 0.2s;
        }

        button:hover {
            background: #34d399;
        }

        /* Scoreboard Panel */
        #scoreboard {
            display: flex;
            align-items: center;
            background: #0f172a;
            border: 1px solid #374151;
            border-radius: 6px;
            padding: 4px 16px;
            font-family: monospace;
            font-size: 1.2rem;
            font-weight: bold;
            gap: 15px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .score-team {
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }
        #team1-label { color: #60a5fa; }
        #team2-label { color: #f87171; }

        .score-digits {
            color: #fcfcfc;
            background: #020617;
            padding: 2px 8px;
            border-radius: 4px;
            min-width: 24px;
            text-align: center;
        }

        #status {
            font-family: monospace;
            font-size: 0.9rem;
            color: #60a5fa;
            padding: 6px 12px;
            background: #0f172a;
            border-radius: 6px;
            min-width: 220px;
            text-align: center;
        }

        /* Prevent layout clipping */
        canvas {
            display: block;
            flex: 1 1 auto;
            width: 100%;
            min-height: 0;
            background: #111827;
        }
    </style>
</head>

<body>

    <div id="header-panel">
        <div class="header-left">
            <h1>simsports</h1>
            <select id="sportSelect">
                <option value="soccer">Soccer</option>
                <option value="tennis">Tennis</option>
                <option value="amfoot">American Football</option>
                <option value="baseball">Baseball</option>
                <option value="cricket">Cricket</option>
            </select>
            <button id="resetBtn">Reset Match</button>
        </div>

        <div id="scoreboard">
            <span id="team1-label" class="score-team">HOME</span>
            <span id="team1-score" class="score-digits">0</span>
            <span style="color: #4b5563;">:</span>
            <span id="team2-score" class="score-digits">0</span>
            <span id="team2-label" class="score-team">AWAY</span>
        </div>

        <div class="header-right">
            <div id="status">Loading...</div>
        </div>
    </div>

    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const sportSelect = document.getElementById('sportSelect');
        const resetBtn = document.getElementById('resetBtn');
        const statusTxt = document.getElementById('status');
        
        const t1ScoreEl = document.getElementById('team1-score');
        const t2ScoreEl = document.getElementById('team2-score');
        const t1LabelEl = document.getElementById('team1-label');
        const t2LabelEl = document.getElementById('team2-label');

        let cw, ch;
        let currentSport = null;
        let players = [];
        let ball = { x: 0, y: 0, vx: 0, vy: 0, radius: 5, color: '#fff', active: true };
        let gameState = { phase: 'playing' };
        let scores = { team1: 0, team2: 0 };
        let resetTimeout = null;

        // Vector Utilities
        const dist = (p1, p2) => Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const normalize = (vx, vy) => {
            const mag = Math.hypot(vx, vy);
            return mag === 0 ? { x: 0, y: 0 } : { x: vx / mag, y: vy / mag };
        };
        const clamp = (val, min, max) => Math.max(min, Math.min(max, val));

        function updateScoreboardLabels(t1, t2) {
            t1LabelEl.innerText = t1;
            t2LabelEl.innerText = t2;
            t1ScoreEl.innerText = scores.team1;
            t2ScoreEl.innerText = scores.team2;
        }

        function triggerReset(delay, message, scoringTeam = null) {
            if (gameState.phase === 'resetting') return;
            gameState.phase = 'resetting';
            statusTxt.innerText = message;

            if (scoringTeam === 1) { scores.team1++; t1ScoreEl.innerText = scores.team1; }
            if (scoringTeam === 2) { scores.team2++; t2ScoreEl.innerText = scores.team2; }

            clearTimeout(resetTimeout);
            resetTimeout = setTimeout(() => {
                if (currentSport) currentSport.init(false);
            }, delay);
        }

        function resize() {
            const rect = canvas.getBoundingClientRect();
            cw = rect.width;
            ch = rect.height;
            canvas.width = cw;
            canvas.height = ch;
            if (currentSport) currentSport.init(false); 
        }
        window.addEventListener('resize', resize);

        // --- SPORT MODULES ---

        const sportsConfigs = {
            soccer: {
                id: 'soccer',
                bgColor: '#166534',
                init: (resetScores = true) => {
                    if (resetScores) { scores.team1 = 0; scores.team2 = 0; }
                    updateScoreboardLabels("BLUE", "RED");
                    players = [];
                    
                    for(let i=0; i<5; i++) {
                        let rx = cw * 0.15 + (Math.random() * 60 - 30);
                        let ry = ch * (0.15 + i * 0.18) + (Math.random() * 40 - 20);
                        players.push({ id: 't1_'+i, x: rx, y: ry, sx: rx, sy: ry, color: '#3b82f6', team: 1, speed: 2.8 + Math.random()*0.6, passCooldown: 0 });
                    }
                    for(let i=0; i<5; i++) {
                        let rx = cw * 0.85 + (Math.random() * 60 - 30);
                        let ry = ch * (0.15 + i * 0.18) + (Math.random() * 40 - 20);
                        players.push({ id: 't2_'+i, x: rx, y: ry, sx: rx, sy: ry, color: '#ef4444', team: 2, speed: 2.8 + Math.random()*0.6, passCooldown: 0 });
                    }
                    
                    ball = { x: cw/2 + (Math.random()*40 - 20), y: ch/2 + (Math.random()*100 - 50), vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4, radius: 6, color: '#ffffff', active: true };
                    gameState = { phase: 'playing' };
                    statusTxt.innerText = "Match in progress...";
                },
                updateAI: () => {
                    if (gameState.phase !== 'playing') return;

                    ball.vx *= 0.988; ball.vy *= 0.988;
                    let closestT1 = null, closestT2 = null;
                    let d1 = Infinity, d2 = Infinity;
                    
                    players.forEach(p => {
                        if(p.passCooldown > 0) p.passCooldown--;
                        let d = dist(p, ball);
                        if(p.team === 1 && d < d1) { d1 = d; closestT1 = p; }
                        if(p.team === 2 && d < d2) { d2 = d; closestT2 = p; }
                    });

                    players.forEach(p => {
                        let isCarrier = (p.team === 1 && p === closestT1 && d1 < 20) || (p.team === 2 && p === closestT2 && d2 < 20);

                        if (isCarrier) {
                            let dBall = dist(p, ball);
                            if (dBall > 2) {
                                let bDir = normalize(p.x - ball.x, p.y - ball.y);
                                ball.vx += bDir.x * 0.4; ball.vy += bDir.y * 0.4;
                            }

                            let openTeammates = players.filter(t => t.team === p.team && t.id !== p.id && t.passCooldown === 0 && dist(t, p) > 60);
                            let goalX = p.team === 1 ? cw : 0;
                            
                            if (openTeammates.length > 0 && (Math.random() < 0.03 || dist(p, {x: goalX, y: ch/2}) > cw * 0.4 && Math.random() < 0.08)) {
                                let targetTeammate = openTeammates[Math.floor(Math.random() * openTeammates.length)];
                                let pDir = normalize((targetTeammate.x + (Math.random()*40 - 20)) - ball.x, (targetTeammate.y + (Math.random()*40 - 20)) - ball.y);
                                ball.vx = pDir.x * (7 + Math.random() * 4);
                                ball.vy = pDir.y * (7 + Math.random() * 4);
                                p.passCooldown = 45;
                                statusTxt.innerText = `Team ${p.team === 1 ? 'Blue' : 'Red'} passes!`;
                            } else {
                                let targetY = ch/2 + Math.sin(Date.now() / 300) * 80;
                                let runDir = normalize(goalX - p.x, targetY - p.y);
                                p.x += runDir.x * p.speed; p.y += runDir.y * p.speed;

                                if (Math.abs(p.x - goalX) < cw * 0.25) {
                                    let shootDir = normalize(goalX - ball.x, (ch/2 - ball.y) + (Math.random() * 120 - 60));
                                    ball.vx = shootDir.x * (11 + Math.random() * 4);
                                    ball.vy = shootDir.y * (11 + Math.random() * 4);
                                    p.passCooldown = 30;
                                    statusTxt.innerText = "Shot taken!";
                                }
                            }
                        } else {
                            let targetX, targetY;
                            if ((p.team === 1 && p === closestT1) || (p.team === 2 && p === closestT2)) {
                                targetX = ball.x; targetY = ball.y;
                            } else {
                                targetX = p.sx + (ball.x - cw/2) * 0.45;
                                targetY = p.sy + (ball.y - ch/2) * 0.45;
                            }
                            let dir = normalize(targetX - p.x, targetY - p.y);
                            p.x += dir.x * p.speed; p.y += dir.y * p.speed;
                        }

                        p.x = clamp(p.x, 15, cw - 15);
                        p.y = clamp(p.y, 15, ch - 15);
                    });

                    let goalTop = ch/2 - 90; let goalBot = ch/2 + 90;
                    if (ball.y > goalTop && ball.y < goalBot) {
                        if (ball.x < 12) triggerReset(2000, "GOAL RED TEAM!", 2);
                        else if (ball.x > cw - 12) triggerReset(2000, "GOAL BLUE TEAM!", 1);
                    }
                },
                drawField: () => {
                    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(cw/2, 0); ctx.lineTo(cw/2, ch); ctx.stroke();
                    ctx.beginPath(); ctx.arc(cw/2, ch/2, 70, 0, Math.PI*2); ctx.stroke();
                    ctx.strokeRect(0, ch/2 - 90, 80, 180);
                    ctx.strokeRect(cw - 80, ch/2 - 90, 80, 180);
                }
            },

            tennis: {
                id: 'tennis',
                bgColor: '#14532d', // Grass outer background
                init: (resetScores = true) => {
                    if (resetScores) { scores.team1 = 0; scores.team2 = 0; }
                    updateScoreboardLabels("P1-HOME", "P2-AWAY");
                    players = [
                        { x: cw*0.15, y: ch/2, sx: cw*0.15, color: '#facc15', team: 1, speed: 4.5 + Math.random()*1.5, errorRange: 15 },
                        { x: cw*0.85, y: ch/2, sx: cw*0.85, color: '#facc15', team: 2, speed: 4.5 + Math.random()*1.5, errorRange: 15 }
                    ];
                    let sDir = Math.random() > 0.5 ? 1 : -1;
                    ball = { 
                        x: sDir > 0 ? cw*0.18 : cw*0.82, 
                        y: ch*0.25 + Math.random()*ch*0.5, 
                        vx: sDir * (8 + Math.random()*4), 
                        vy: (Math.random()-0.5)*5, 
                        radius: 5, 
                        color: '#ccff00', 
                        active: true 
                    };
                    gameState = { phase: 'playing' };
                    statusTxt.innerText = "Rally active";
                },
                updateAI: () => {
                    if (gameState.phase !== 'playing') return;

                    players.forEach(p => {
                        // Latency calculation to smooth out predictive steps
                        let trackingTarget = ball.y + (Math.sin(Date.now() / 120) * p.errorRange * 0.3);
                        if (Math.abs(p.y - trackingTarget) > p.speed) {
                            p.y += p.y < trackingTarget ? p.speed : -p.speed;
                        }
                        // Lock to baseline limits match visible grid
                        p.y = clamp(p.y, ch*0.1, ch*0.8);
                        p.x = p.sx;

                        // Unified return physics hit box
                        if (dist(p, ball) < 25) {
                            let sideFactor = p.team === 1 ? 1 : -1;
                            ball.vx = sideFactor * (9 + Math.random() * 6); 
                            ball.vy = (ball.y - p.y) * 0.25 + (Math.random() - 0.5) * 5; 
                            p.speed = 4.5 + Math.random() * 2; 
                            statusTxt.innerText = "Rally return!";
                        }
                    });

                    // Point checks bounding past edge canvas lines
                    if (ball.x < cw*0.08) triggerReset(1500, "Point Player 2!", 2);
                    else if (ball.x > cw*0.92) triggerReset(1500, "Point Player 1!", 1);
                },
                drawField: () => {
                    // Blue Inner Court Bed
                    ctx.fillStyle = '#1e40af';
                    ctx.fillRect(cw*0.1, ch*0.1, cw*0.8, ch*0.7);
                    
                    ctx.strokeStyle = '#ffffff'; 
                    ctx.lineWidth = 3;
                    // Primary boundary frame
                    ctx.strokeRect(cw*0.1, ch*0.1, cw*0.8, ch*0.7);
                    
                    // Singles internal parallel boundaries
                    ctx.beginPath(); ctx.moveTo(cw*0.1, ch*0.2); ctx.lineTo(cw*0.9, ch*0.2); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(cw*0.1, ch*0.7); ctx.lineTo(cw*0.9, ch*0.7); ctx.stroke();
                    
                    // Vertical Service block boxes
                    ctx.beginPath(); ctx.moveTo(cw*0.25, ch*0.2); ctx.lineTo(cw*0.25, ch*0.7); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(cw*0.75, ch*0.2); ctx.lineTo(cw*0.75, ch*0.7); ctx.stroke();
                    
                    // Center service coordinate divider line
                    ctx.beginPath(); ctx.moveTo(cw*0.25, ch/2); ctx.lineTo(cw*0.75, ch/2); ctx.stroke();
                    
                    // Mid court Net line construction
                    ctx.setLineDash([6, 6]);
                    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                    ctx.beginPath(); ctx.moveTo(cw/2, ch*0.06); ctx.lineTo(cw/2, ch*0.84); ctx.stroke();
                    ctx.setLineDash([]);
                }
            },

            amfoot: {
                id: 'amfoot',
                bgColor: '#064e3b',
                init: (resetScores = true) => {
                    if (resetScores) { scores.team1 = 0; scores.team2 = 0; }
                    updateScoreboardLabels("OFF", "DEF");
                    players = [];
                    
                    let startY = ch * 0.4 + Math.random() * ch * 0.2;
                    players.push({ x: cw*0.2, y: startY, color: '#3b82f6', team: 1, role: 'runner', speed: 3.0 + Math.random()*0.8 });
                    
                    for(let i=0; i<4; i++) {
                        players.push({ x: cw*0.23, y: ch*(0.25 + i*0.16) + (Math.random()*30-15), color: '#60a5fa', team: 1, role: 'blocker', speed: 2.2 + Math.random() });
                    }
                    for(let i=0; i<5; i++) {
                        players.push({ x: cw*(0.35 + Math.random()*0.1), y: ch*(0.2 + i*0.15) + (Math.random()*40-20), color: '#ef4444', team: 2, role: 'defender', speed: 2.7 + Math.random()*0.9 });
                    }
                    
                    ball = { x: cw*0.2, y: startY, vx: 0, vy: 0, radius: 4, color: '#78350f', active: false };
                    gameState = { phase: 'playing' };
                    statusTxt.innerText = "Down started...";
                },
                updateAI: () => {
                    if (gameState.phase !== 'playing') return;

                    let runner = players.find(p => p.role === 'runner');
                    ball.x = runner.x; ball.y = runner.y;

                    players.forEach(p => {
                        if (p.role === 'runner') {
                            p.x += p.speed;
                            let dynamicDefenders = players.filter(d => d.role === 'defender' && d.x > p.x);
                            if (dynamicDefenders.length > 0) {
                                let closestDef = dynamicDefenders.sort((a,b) => dist(a,p) - dist(b,p))[0];
                                if (dist(closestDef, p) < 120) {
                                    p.y += (p.y > closestDef.y) ? p.speed * 0.65 : -p.speed * 0.65;
                                }
                            }
                            p.y += Math.sin(Date.now() / 200) * 1.5;
                            p.y = clamp(p.y, 20, ch - 20);
                        } 
                        else if (p.role === 'defender') {
                            let targetX = runner.x + 30;
                            let targetY = runner.y;
                            let dir = normalize(targetX - p.x, targetY - p.y);
                            p.x += dir.x * p.speed; p.y += dir.y * p.speed;
                            
                            if (dist(p, runner) < 15) triggerReset(1600, "Tackled Down!", 2);
                        }
                        else if (p.role === 'blocker') {
                            let targets = players.filter(d => d.role === 'defender');
                            let nearestDef = targets.sort((a,b) => dist(a,p) - dist(b,p))[0];
                            if (nearestDef && dist(nearestDef, p) < 160) {
                                let dir = normalize(nearestDef.x - p.x, nearestDef.y - p.y);
                                p.x += dir.x * p.speed; p.y += dir.y * p.speed;
                                if(dist(p, nearestDef) < 15) nearestDef.x -= 0.8;
                            } else {
                                p.x += p.speed * 0.8;
                            }
                        }
                    });

                    if (runner.x > cw * 0.9) triggerReset(2000, "TOUCHDOWN!!", 1);
                },
                drawField: () => {
                    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
                    for(let i=0.1; i<=0.9; i+=0.05) {
                        ctx.beginPath(); ctx.moveTo(cw*i, 0); ctx.lineTo(cw*i, ch); ctx.stroke();
                    }
                    ctx.fillStyle = 'rgba(239, 68, 68, 0.15)'; ctx.fillRect(cw*0.9, 0, cw*0.1, ch);
                    ctx.fillStyle = 'rgba(59, 130, 246, 0.15)'; ctx.fillRect(0, 0, cw*0.1, ch);
                }
            },

            baseball: {
                id: 'baseball',
                bgColor: '#15803d',
                init: (resetScores = true) => {
                    if (resetScores) { scores.team1 = 0; scores.team2 = 0; }
                    updateScoreboardLabels("FLD", "BAT");
                    players = [
                        { x: cw*0.5, y: ch*0.62, color: '#3b82f6', role: 'pitcher', speed: 3.2 },
                        { x: cw*0.5, y: ch*0.86, color: '#facc15', role: 'batter', speed: 3.6 + Math.random() },
                        { x: cw*0.32, y: ch*0.6, color: '#3b82f6', role: 'fielder', speed: 3.0 + Math.random() },
                        { x: cw*0.68, y: ch*0.6, color: '#3b82f6', role: 'fielder', speed: 3.0 + Math.random() },
                        { x: cw*0.2, y: ch*0.25, color: '#3b82f6', role: 'fielder', speed: 3.4 },
                        { x: cw*0.5, y: ch*0.18, color: '#3b82f6', role: 'fielder', speed: 3.4 },
                        { x: cw*0.8, y: ch*0.25, color: '#3b82f6', role: 'fielder', speed: 3.4 },
                    ];
                    let pitchCurve = (Math.random() - 0.5) * 4;
                    ball = { x: cw*0.5, y: ch*0.62, vx: pitchCurve, vy: 7 + Math.random()*5, radius: 4, color: '#fff', active: true };
                    gameState = { phase: 'pitching' };
                    statusTxt.innerText = "Pitch variant deployed...";
                },
                updateAI: () => {
                    if (gameState.phase === 'resetting') return;

                    let batter = players.find(p => p.role === 'batter');

                    if (gameState.phase === 'pitching') {
                        if (ball.y >= ch*0.86) {
                            let hitRoll = Math.random();
                            if (hitRoll > 0.22) { 
                                gameState.phase = 'hit';
                                ball.vy = -(8 + Math.random() * 12);
                                ball.vx = (Math.random() * 24 - 12);
                                statusTxt.innerText = "Line Drive Hit!";
                            } else if (hitRoll > 0.08) {
                                triggerReset(1500, "STRIKE THREE! Out.", 1);
                            } else {
                                gameState.phase = 'hit';
                                ball.vy = -(3 + Math.random() * 6);
                                ball.vx = Math.random() > 0.5 ? (10 + Math.random()*10) : -(10 + Math.random()*10);
                                statusTxt.innerText = "Foul tip vector!";
                            }
                        }
                    } 
                    else if (gameState.phase === 'hit') {
                        let firstBase = { x: cw*0.72, y: ch*0.62 };
                        let dirB = normalize(firstBase.x - batter.x, firstBase.y - batter.y);
                        batter.x += dirB.x * batter.speed; batter.y += dirB.y * batter.speed;

                        if (dist(batter, firstBase) < 10) {
                            triggerReset(1600, "SAFE at first base!", 2);
                        }

                        players.forEach(p => {
                            if (p.role === 'fielder' || p.role === 'pitcher') {
                                let dirF = normalize(ball.x - p.x, ball.y - p.y);
                                p.x += dirF.x * p.speed; p.y += dirF.y * p.speed;

                                if (dist(p, ball) < 16) triggerReset(1600, "CAUGHT IN OUTFIELD! Fly out.", 1);
                            }
                        });
                        
                        if (ball.y < 0 && ball.x > cw*0.25 && ball.x < cw*0.75) {
                            triggerReset(2200, "OUT OF THE PARK HOME RUN!", 2);
                        } else if (ball.x < 0 || ball.x > cw || ball.y > ch || ball.y < 0) {
                            triggerReset(1400, "FOUL BALL OUT OF BOUNDS");
                        }
                    }
                },
                drawField: () => {
                    ctx.fillStyle = '#b45309';
                    ctx.beginPath();
                    ctx.moveTo(cw*0.5, ch*0.9); ctx.lineTo(cw*0.72, ch*0.62);
                    ctx.lineTo(cw*0.5, ch*0.4); ctx.lineTo(cw*0.32, ch*0.62);
                    ctx.closePath(); ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(cw*0.5-4, ch*0.88-4, 8, 8);
                    ctx.fillRect(cw*0.72-4, ch*0.62-4, 8, 8);
                    ctx.fillRect(cw*0.5-4, ch*0.4-4, 8, 8);
                    ctx.fillRect(cw*0.32-4, ch*0.62-4, 8, 8);
                }
            },

            cricket: {
                id: 'cricket',
                bgColor: '#22c55e',
                init: (resetScores = true) => {
                    if (resetScores) { scores.team1 = 0; scores.team2 = 0; }
                    updateScoreboardLabels("BOWL", "BAT");
                    players = [
                        { x: cw*0.5, y: ch*0.78, sx: cw*0.5, sy: ch*0.78, color: '#3b82f6', role: 'bowler', speed: 3.4 },
                        { x: cw*0.5, y: ch*0.32, sx: cw*0.5, sy: ch*0.32, color: '#facc15', role: 'batsman', speed: 4.2 }
                    ];
                    
                    for(let i=0; i<8; i++) {
                        let angle = (i / 8) * Math.PI * 2 + Math.random();
                        let radiusRadius = ch * (0.22 + Math.random()*0.2);
                        players.push({
                            x: cw*0.5 + Math.cos(angle)*radiusRadius, y: ch*0.5 + Math.sin(angle)*radiusRadius,
                            color: '#3b82f6', role: 'fielder', speed: 2.8 + Math.random()*1.2
                        });
                    }
                    ball = { x: cw*0.5, y: ch*0.78, vx: (Math.random()-0.5)*2, vy: -(7 + Math.random()*4), radius: 4, color: '#dc2626', active: true };
                    gameState = { phase: 'bowling' };
                },
                updateAI: () => {
                    if (gameState.phase === 'resetting') return;

                    let batsman = players.find(p => p.role === 'batsman');
                    
                    if (gameState.phase === 'bowling') {
                        if (ball.y <= ch*0.34) {
                            let missChance = Math.random();
                            if (missChance < 0.18) {
                                triggerReset(1500, "WICKET! Clean Bowled!", 1);
                            } else {
                                gameState.phase = 'hit';
                                let angle = Math.random() * Math.PI * 2;
                                let speedForce = 6 + Math.random() * 11;
                                ball.vx = Math.cos(angle) * speedForce;
                                ball.vy = Math.sin(angle) * speedForce;
                                statusTxt.innerText = "Smashed into open space!";
                            }
                        }
                    } 
                    else if (gameState.phase === 'hit') {
                        let targetY = batsman.sy > ch*0.5 ? ch*0.32 : ch*0.74;
                        if (Math.abs(batsman.y - targetY) > 6) {
                            batsman.y += batsman.y < targetY ? batsman.speed : -batsman.speed;
                        } else {
                            batsman.sy = targetY; 
                            scores.team2++;
                            t2ScoreEl.innerText = scores.team2;
                            statusTxt.innerText = `Run scored! Total: ${scores.team2}`;
                        }

                        players.forEach(p => {
                            if (p.role === 'fielder' || p.role === 'bowler') {
                                let dir = normalize(ball.x - p.x, ball.y - p.y);
                                p.x += dir.x * p.speed; p.y += dir.y * p.speed;

                                if (dist(p, ball) < 15) triggerReset(1500, "Fielded clean, run stopped!", 1);
                            }
                        });
                        
                        if (ball.x < cw*0.05 || ball.x > cw*0.95 || ball.y < ch*0.05 || ball.y > ch*0.95) {
                            triggerReset(2000, "BOUNDARY FOUR!", 2);
                            scores.team2 += 3;
                        }
                    }
                },
                drawField: () => {
                    ctx.fillStyle = '#15a34a';
                    ctx.beginPath(); ctx.ellipse(cw/2, ch/2, cw*0.46, ch*0.44, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#eab308'; ctx.fillRect(cw/2 - 12, ch*0.3, 24, ch*0.4);
                }
            }
        };

        // --- ENGINE ---

        function initSport(sportId) {
            clearTimeout(resetTimeout);
            currentSport = sportsConfigs[sportId];
            if (!cw || !ch) resize();
            else currentSport.init(true);
        }

        function update() {
            if (!currentSport) return;

            if (ball.active && gameState.phase !== 'resetting') {
                ball.x += ball.vx;
                ball.y += ball.vy;
                
                if (currentSport.id === 'soccer') {
                    if (ball.x < 8 || ball.x > cw-8) ball.vx *= -0.85;
                    if (ball.y < 8 || ball.y > ch-8) ball.vy *= -0.85;
                    ball.x = clamp(ball.x, 8, cw-8);
                    ball.y = clamp(ball.y, 8, ch-8);
                }
                else if (currentSport.id === 'tennis') {
                    // Ball boundary collision matches specific court box limits
                    if (ball.y < ch*0.1 || ball.y > ch*0.8) {
                        ball.vy *= -1;
                        ball.y = clamp(ball.y, ch*0.1, ch*0.8);
                    }
                }
            }
            currentSport.updateAI();
        }

        function draw() {
            if (!currentSport) return;

            ctx.fillStyle = currentSport.bgColor;
            ctx.fillRect(0, 0, cw, ch);

            currentSport.drawField();

            players.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
            });

            ctx.fillStyle = ball.color;
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        sportSelect.addEventListener('change', (e) => initSport(e.target.value));
        resetBtn.addEventListener('click', () => currentSport.init(true));

        // Start initialization sequence
        resize();
        initSport('soccer');
        requestAnimationFrame(loop);
    </script>
</body>
