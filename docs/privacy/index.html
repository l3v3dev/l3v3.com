<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>l3v3 | Privacy</title>
  <style>
    :root{color-scheme:dark;--bg:#121413;--panel:#1d211f;--line:#343a36;--muted:#aab4ad;--text:#e8ece9;--accent:#9fd3b0}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}
    body{background:var(--bg);color:var(--text);font-family:Georgia,serif;display:flex;justify-content:center}
    main{width:100%;max-width:900px;padding:clamp(36px,8vw,76px) 24px 48px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px}.logo{color:var(--text);font-size:30px;font-weight:700;text-decoration:none}.tagline{margin-top:8px;color:var(--muted);font:12px system-ui,sans-serif;letter-spacing:.08em}.policy{border-top:1px solid var(--line);padding-top:28px}.policy h1{font-weight:400;font-size:36px;margin:0 0 16px}.policy h2{font-weight:400;font-size:20px;margin:28px 0 12px;color:var(--accent)}.policy p,.policy li{color:var(--muted);font:16px/1.7 system-ui,sans-serif}.policy a{color:var(--accent)}.policy ul{padding-left:20px}.policy .meta{font-size:12px;letter-spacing:.08em;margin-top:10px;color:#77827b}
    footer{margin-top:80px;color:#77827b;font:12px system-ui,sans-serif}.footer-links{display:inline-flex;gap:14px;margin-left:12px}.footer-links a{color:#aab4ad;text-decoration:none}.footer-links a:hover{color:var(--accent)}
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <a class="logo" href="../">l3v3</a>
      <div class="tagline">l1v3 l0v3 l3v3</div>
    </div>
  </header>

  <section class="policy">
    <div class="meta">Privacy notice</div>
    <h1>Privacy</h1>

    <p>l3v3 is a small static games site.</p>

    <h2>Analytics</h2>
    <p>This site uses Google Analytics and that policy applies.</p>
  </section>

  <footer>© 2026 l3v3<div class="footer-links"><a href="../">Games</a><a href="../terms/">Terms</a></div></footer>
</main>
</body>
</html>
