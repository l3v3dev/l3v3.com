  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #111;
      overflow: hidden;
    }

    #wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    canvas {
      display: block;
      background: #000;
      touch-action: none;
      /* Shrink-to-fit: the canvas has an intrinsic 1400x800 size, so the
         max constraints scale it down while preserving the 1.75 aspect ratio
         on any screen (no stretching on phones or odd window sizes). */
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 1400 / 800;
    }

    #rotate {
      display: none;
      position: fixed;
      inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #111;
      color: #eee;
      font-family: system-ui, sans-serif;
      font-size: 1.25rem;
      text-align: center;
      padding: 24px;
      z-index: 20;
    }

    #rotate .icon {
      font-size: 3rem;
      animation: rotatetip 1.6s ease-in-out infinite;
    }

    @keyframes rotatetip {
      0%, 20% { transform: rotate(0deg); }
      60%, 100% { transform: rotate(90deg); }
    }

    /* The game is landscape: on portrait phones the field would be too small
       to play, so ask the player to rotate the device. */
    @media (orientation: portrait) and (max-width: 520px) {
      #rotate {
        display: flex;
      }
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #eee;
      font-family: system-ui, sans-serif;
      font-size: 1.5rem;
      z-index: 10;
    }

    #loading.hidden {
      display: none;
    }
    #loading .textblink{animation:animblink 1s infinite steps(4,start)}@keyframes animblink{to{visibility:hidden}}
  </style>
