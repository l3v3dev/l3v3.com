
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <clipPath id="badge">
      <rect x="16" y="16" width="480" height="480" rx="48" ry="48"/>
    </clipPath>
  </defs>

  <!-- Rounded-square badge background -->
  <rect x="16" y="16" width="480" height="480" rx="48" ry="48" fill="#3a8c3a"/>

  <!-- Vertical mowing stripes -->
  <g clip-path="url(#badge)">
    <rect x="76" y="16" width="60" height="480" fill="#2e7a2e"/>
    <rect x="196" y="16" width="60" height="480" fill="#2e7a2e"/>
    <rect x="316" y="16" width="60" height="480" fill="#2e7a2e"/>
    <rect x="436" y="16" width="60" height="480" fill="#2e7a2e"/>
  </g>

  <!-- Center line -->
  <line x1="16" y1="256" x2="496" y2="256" stroke="white" stroke-width="4" clip-path="url(#badge)"/>

  <!-- Center circle -->
  <circle cx="256" cy="256" r="92" fill="none" stroke="white" stroke-width="4"/>

  <!-- Motion swoosh behind ball -->
  <path d="M 170 278 Q 210 308 256 292 Q 300 276 340 278" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.65"/>

  <!-- Soccer ball -->
  <circle cx="256" cy="256" r="50" fill="white" stroke="black" stroke-width="3"/>
  <!-- Center pentagon -->
  <polygon points="256,234 274,246 268,266 244,266 238,246" fill="black"/>
  <!-- Upper-left patch -->
  <polygon points="226,238 236,228 248,234 244,248 230,248" fill="black"/>
  <!-- Upper-right patch -->
  <polygon points="274,234 286,228 294,238 288,250 274,248" fill="black"/>
  <!-- Lower-left patch -->
  <polygon points="230,272 242,266 250,276 244,288 232,286" fill="black"/>
  <!-- Lower-right patch -->
  <polygon points="262,276 274,266 284,272 280,288 266,286" fill="black"/>
  <!-- Top patch -->
  <polygon points="248,222 264,222 268,234 256,238 244,234" fill="black"/>

  <!-- Left player (blue jersey) -->
  <g transform="translate(128,256) rotate(12)">
    <!-- Legs -->
    <line x1="-7" y1="26" x2="-12" y2="46" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="7" y1="26" x2="12" y2="46" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Body / jersey -->
    <rect x="-15" y="-6" width="30" height="34" rx="7" fill="#2266ee" stroke="black" stroke-width="2.5"/>
    <!-- Arms -->
    <line x1="-15" y1="2" x2="-28" y2="14" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="15" y1="2" x2="28" y2="14" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="0" cy="-20" r="13" fill="#f5d5a0" stroke="black" stroke-width="2.5"/>
  </g>

  <!-- Right player (red jersey) -->
  <g transform="translate(384,256) rotate(-12)">
    <!-- Legs -->
    <line x1="-7" y1="26" x2="-12" y2="46" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="7" y1="26" x2="12" y2="46" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Body / jersey -->
    <rect x="-15" y="-6" width="30" height="34" rx="7" fill="#ee2222" stroke="black" stroke-width="2.5"/>
    <!-- Arms -->
    <line x1="-15" y1="2" x2="-28" y2="14" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="15" y1="2" x2="28" y2="14" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="0" cy="-20" r="13" fill="#f5d5a0" stroke="black" stroke-width="2.5"/>
  </g>
</svg>
