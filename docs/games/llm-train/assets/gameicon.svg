
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="72%">
      <stop offset="0%" stop-color="#141b45"/>
      <stop offset="100%" stop-color="#060918"/>
    </radialGradient>
    <linearGradient id="fillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="ballGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e0f7ff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </radialGradient>
    <radialGradient id="ballHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cyanGlowWide" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ballGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ringGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="gridGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8"/>
    </filter>
    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="48" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <g stroke="#1a2e5a" stroke-width="0.5" opacity="0.25" filter="url(#gridGlow)">
    <line x1="64" y1="0" x2="64" y2="512"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="192" y1="0" x2="192" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="320" y1="0" x2="320" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="448" y1="0" x2="448" y2="512"/>
    <line x1="0" y1="64" x2="512" y2="64"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="192" x2="512" y2="192"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="0" y1="448" x2="512" y2="448"/>
  </g>

  <!-- Loss curve fill (under the curve) -->
  <path d="M 70,155 C 95,195 125,238 152,242 C 168,244 178,228 192,222 C 215,212 238,290 268,352 C 298,290 322,212 345,222 C 358,228 368,244 384,242 C 412,238 442,195 442,155 L 442,410 L 70,410 Z" fill="url(#fillGrad)" opacity="0.55"/>

  <!-- Loss curve outer glow (wide) -->
  <path d="M 70,155 C 95,195 125,238 152,242 C 168,244 178,228 192,222 C 215,212 238,290 268,352 C 298,290 322,212 345,222 C 358,228 368,244 384,242 C 412,238 442,195 442,155" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" opacity="0.3" filter="url(#cyanGlowWide)"/>

  <!-- Loss curve main stroke -->
  <path d="M 70,155 C 95,195 125,238 152,242 C 168,244 178,228 192,222 C 215,212 238,290 268,352 C 298,290 322,212 345,222 C 358,228 368,244 384,242 C 412,238 442,195 442,155" fill="none" stroke="#22d3ee" stroke-width="2.8" stroke-linecap="round" filter="url(#cyanGlow)"/>

  <!-- Local minimum swirl (dim purple) -->
  <g transform="translate(152,242)" opacity="0.55">
    <path d="M 0,-9 C 5.5,-9 9,-5 9,0 C 9,5 5.5,9 0,9 C -5,9 -9,5 -9,0 C -9,-5 -5.5,-9 0,-9" fill="none" stroke="#a855f7" stroke-width="1.4" opacity="0.7"/>
    <path d="M 0,-5 C 3,-5 5,-3 5,0 C 5,3 3,5 0,5 C -3,5 -5,3 -5,0 C -5,-3 -3,-5 0,-5" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.5"/>
    <circle cx="0" cy="0" r="1.5" fill="#a855f7" opacity="0.6"/>
  </g>

  <!-- Target ring at global minimum -->
  <circle cx="268" cy="352" r="16" fill="none" stroke="#e0f7ff" stroke-width="2.5" filter="url(#ringGlow)"/>
  <circle cx="268" cy="352" r="9" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.7"/>
  <circle cx="268" cy="352" r="3" fill="#e0f7ff" opacity="0.8"/>

  <!-- Ball halo -->
  <circle cx="112" cy="198" r="32" fill="url(#ballHalo)"/>

  <!-- Ball (on left slope of curve) -->
  <circle cx="112" cy="198" r="15" fill="url(#ballGrad)" filter="url(#ballGlow)"/>

  <!-- Terminal bar -->
  <rect x="136" y="432" width="240" height="38" rx="8" fill="#080d24" stroke="#1e3a5f" stroke-width="1" opacity="0.92"/>
  <rect x="136" y="432" width="240" height="38" rx="8" fill="none" stroke="#22d3ee" stroke-width="0.5" opacity="0.3"/>
  <text x="256" y="457" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#22d3ee" text-anchor="middle" letter-spacing="3" filter="url(#textGlow)">[MASK]</text>

  <!-- Small decorative dots on grid intersections -->
  <g fill="#22d3ee" opacity="0.15">
    <circle cx="128" cy="128" r="1.5"/>
    <circle cx="256" cy="128" r="1.5"/>
    <circle cx="384" cy="128" r="1.5"/>
    <circle cx="128" cy="384" r="1.5"/>
    <circle cx="256" cy="384" r="1.5"/>
    <circle cx="384" cy="384" r="1.5"/>
  </g>
</svg>
