
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="55%" r="75%">
      <stop offset="0%" stop-color="#141b45"/>
      <stop offset="60%" stop-color="#0a0e2a"/>
      <stop offset="100%" stop-color="#060918"/>
    </radialGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3df5"/>
      <stop offset="55%" stop-color="#a06bff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <radialGradient id="orbCore" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#9ff4ff"/>
      <stop offset="70%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0090b8"/>
    </radialGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#00e5ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#00e5ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGlow)"/>

  <!-- Subtle grid -->
  <g stroke="#3a4a8a" stroke-opacity="0.18" stroke-width="1">
    <line x1="64" y1="0" x2="64" y2="512"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="192" y1="0" x2="192" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="320" y1="0" x2="320" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="448" y1="0" x2="448" y2="512"/>
    <line x1="0" y1="64" x2="512" y2="64"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="192" x2="512" y2="192"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="0" y1="448" x2="512" y2="448"/>
  </g>

  <!-- Faint loss axis ticks (left) -->
  <g stroke="#5a6bb0" stroke-opacity="0.45" stroke-width="2">
    <line x1="24" y1="96" x2="36" y2="96"/>
    <line x1="24" y1="160" x2="36" y2="160"/>
    <line x1="24" y1="224" x2="36" y2="224"/>
    <line x1="24" y1="288" x2="36" y2="288"/>
    <line x1="24" y1="352" x2="36" y2="352"/>
    <line x1="24" y1="416" x2="36" y2="416"/>
  </g>
  <!-- Faint x-axis ticks (bottom) -->
  <g stroke="#5a6bb0" stroke-opacity="0.45" stroke-width="2">
    <line x1="128" y1="486" x2="128" y2="498"/>
    <line x1="224" y1="486" x2="224" y2="498"/>
    <line x1="320" y1="486" x2="320" y2="498"/>
    <line x1="416" y1="486" x2="416" y2="498"/>
  </g>

  <!-- Loss curve: jagged local minima on left, smooth valley on right -->
  <path d="M 40 108
           L 84 152 L 112 122 L 152 196 L 184 162
           L 224 244 L 254 214 L 296 306 L 322 288
           C 348 322, 366 372, 396 398
           C 412 412, 428 412, 444 396
           C 458 382, 468 372, 478 366"
        fill="none" stroke="url(#curveGrad)" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Soft under-glow of curve -->
  <path d="M 40 108
           L 84 152 L 112 122 L 152 196 L 184 162
           L 224 244 L 254 214 L 296 306 L 322 288
           C 348 322, 366 372, 396 398
           C 412 412, 428 412, 444 396
           C 458 382, 468 372, 478 366"
        fill="none" stroke="#ff3df5" stroke-opacity="0.18" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Target ring at global minimum -->
  <circle cx="400" cy="400" r="52" fill="url(#ringGlow)"/>
  <circle cx="400" cy="400" r="30" fill="none" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="400" cy="400" r="20" fill="none" stroke="#00e5ff" stroke-width="5"/>
  <circle cx="400" cy="400" r="6" fill="#00e5ff"/>

  <!-- Trailing sparkles / particles behind the ball -->
  <g fill="#00e5ff">
    <circle cx="184" cy="162" r="5" opacity="0.9"/>
    <circle cx="160" cy="188" r="4" opacity="0.7"/>
    <circle cx="140" cy="150" r="3" opacity="0.55"/>
    <circle cx="118" cy="132" r="3" opacity="0.4"/>
    <circle cx="100" cy="140" r="2.5" opacity="0.3"/>
    <circle cx="204" cy="196" r="3.5" opacity="0.8"/>
    <circle cx="214" cy="222" r="2.5" opacity="0.6"/>
  </g>
  <!-- 4-point sparkle stars -->
  <g fill="#9ff4ff">
    <path d="M 148 118 L 151 126 L 159 129 L 151 132 L 148 140 L 145 132 L 137 129 L 145 126 Z" opacity="0.85"/>
    <path d="M 196 148 L 198 154 L 204 156 L 198 158 L 196 164 L 194 158 L 188 156 L 194 154 Z" opacity="0.7"/>
    <path d="M 128 176 L 130 181 L 135 183 L 130 185 L 128 190 L 126 185 L 121 183 L 126 181 Z" opacity="0.5"/>
  </g>

  <!-- Glowing cyan orb (neon ball) -->
  <circle cx="232" cy="240" r="64" fill="url(#orbGlow)"/>
  <circle cx="232" cy="240" r="27" fill="url(#orbCore)"/>
  <circle cx="232" cy="240" r="27" fill="none" stroke="#00e5ff" stroke-opacity="0.6" stroke-width="2"/>
  <!-- Specular highlight -->
  <ellipse cx="223" cy="230" rx="9" ry="6" fill="#ffffff" opacity="0.85"/>
  <!-- Motion arc hint -->
  <path d="M 205 262 A 30 30 0 0 0 258 262" fill="none" stroke="#00e5ff" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
</svg>
