
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="16" viewBox="0 0 200 16">
  <defs>
    <clipPath id="trackClip">
      <rect x="1" y="1" width="198" height="14" rx="7" ry="7"/>
    </clipPath>
    <linearGradient id="innerShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.30"/>
      <stop offset="0.4" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.1"/>
    </filter>
  </defs>

  <!-- soft neon glow behind the outline -->
  <rect x="1" y="1" width="198" height="14" rx="7" ry="7" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3.5" filter="url(#glow)"/>

  <!-- very subtle inner shadow (interior remains transparent) -->
  <g clip-path="url(#trackClip)">
    <rect x="1" y="1" width="198" height="14" fill="url(#innerShadow)"/>
  </g>

  <!-- main track outline: 2px white @ 60% opacity, corner radius 7 -->
  <rect x="1" y="1" width="198" height="14" rx="7" ry="7" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
</svg>
