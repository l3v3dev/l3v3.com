
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="32" viewBox="0 0 128 32">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .icon { opacity: 0.5; }
      .icon.active { opacity: 1; }
    </style>
  </defs>
  <g id="momentum" class="icon" opacity="0.5" filter="url(#glow)" transform="translate(4,4)">
    <path d="M4 10 H13 V6 L20 12 L13 18 V14 H4 Z" fill="#ff9100"/>
  </g>
  <g id="adam" class="icon" opacity="0.5" filter="url(#glow)" transform="translate(36,4)">
    <path d="M3 12 C6 5 9 5 12 12 C15 19 18 19 21 12" fill="none" stroke="#00cfff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g id="regularization" class="icon" opacity="0.5" filter="url(#glow)" transform="translate(68,4)">
    <path d="M12 3 L19 6 V12 C19 17 16 20 12 21 C8 20 5 17 5 12 V6 Z" fill="#00ff9d"/>
  </g>
  <g id="overfitting" class="icon" opacity="0.5" filter="url(#glow)" transform="translate(100,4)">
    <path d="M12 3.5 L21.5 19.5 H2.5 Z" fill="#ffd60a" stroke="#ffd60a" stroke-width="1" stroke-linejoin="round"/>
    <path d="M12 9 V14" stroke="#141414" stroke-width="2" stroke-linecap="round"/>
    <circle cx="12" cy="16.8" r="1.2" fill="#141414"/>
  </g>
</svg>
