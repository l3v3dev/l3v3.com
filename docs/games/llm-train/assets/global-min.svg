<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>
  </defs>
  <g transform="translate(32 32)">
    <g filter="url(#glow)" opacity="0.8">
      <animate attributeName="opacity" values="0.55;0.95;0.55" dur="1.8s" repeatCount="indefinite"/>
      <circle r="20" fill="none" stroke="#00ffff" stroke-width="5"/>
      <circle r="13" fill="none" stroke="#00ffff" stroke-width="5"/>
      <circle r="7" fill="#00ffff"/>
    </g>
    <g>
      <circle r="20" fill="none" stroke="#00ffff" stroke-width="4" opacity="0.4"/>
      <circle r="13" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.7"/>
      <circle r="7" fill="#ffffff"/>
    </g>
  </g>
</svg>