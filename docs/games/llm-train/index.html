    html,
    body {
      margin: 0;
      height: 100%;
      background: #080a18 url('assets/bg-ambient.png') center / cover no-repeat;
      overscroll-behavior: none;
      overflow: hidden; /* never let the page scroll on phones */
      touch-action: manipulation; /* kill double-tap zoom outside the canvas */
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center; /* center the play area on tall (portrait) screens */
    }

    /* Non-blocking hint for phones held in portrait: the game is 4:3 and is
       much easier to play (and tap) in landscape. */
    #rotate-hint {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      background: rgba(8, 10, 24, 0.92);
      color: #9fd8ff;
      font: 13px system-ui, sans-serif;
      text-align: center;
      z-index: 5;
      pointer-events: none;
    }

    @media (orientation: portrait) and (pointer: coarse) {
      #rotate-hint {
        display: block;
      }
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080a18;
      color: #e8ecff;
      font-family: system-ui, sans-serif;
      font-size: 1.25rem;
      z-index: 10;
    }

    canvas {
      display: block;
      margin: 0 auto;
      background: #000;
      touch-action: none; /* keep touch gestures for the game, not the page */
      /* Scale the 800x600 buffer to fit the viewport, preserving aspect ratio.
         The dvh lines override the vh ones where supported so mobile browsers'
         dynamic toolbars don't push the canvas off-screen. */
      width: min(100vw, calc(100vh * 4 / 3));
      height: min(100vh, calc(100vw * 3 / 4));
      width: min(100vw, calc(100dvh * 4 / 3));
      height: min(100dvh, calc(100vw * 3 / 4));
    }
  </style>
