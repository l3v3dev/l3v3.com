<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Token Trainer</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #080a18 url('assets/bg-ambient.png') center / cover no-repeat;
      overscroll-behavior: none;
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080a18;
      color: #e8ecff;
      font-family: system-ui, sans-serif;
      font-size: 1.25rem;
      z-index: 10;
    }

    canvas {
      display: block;
      margin: 0 auto;
      background: #000;
      touch-action: none; /* keep touch gestures for the game, not the page */
      /* Scale the 800x600 buffer to fit the viewport, preserving aspect ratio. */
      width: min(100vw, calc(100vh * 4 / 3));
      height: min(100vh, calc(100vw * 3 / 4));
    }
  </style>
</head>

<body>
  <div id="loading-overlay">Loading ...</div>
  <canvas id="game-canvas" width="800" height="600"></canvas>
  <script defer src="game.min.js"></script>
</body>

</html>
