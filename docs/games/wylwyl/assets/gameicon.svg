
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="packetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#00e5ff" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#00e5ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="startGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hexGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00ff88" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pathGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pixelSoft" x="-2%" y="-2%" width="104%" height="104%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#0a1628"/>

  <!-- 8x8 Grid lines -->
  <g stroke="#1a2a44" stroke-width="1" opacity="0.7">
    <line x1="64" y1="0" x2="64" y2="512"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="192" y1="0" x2="192" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="320" y1="0" x2="320" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="448" y1="0" x2="448" y2="512"/>
    <line x1="0" y1="64" x2="512" y2="64"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="192" x2="512" y2="192"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="0" y1="448" x2="512" y2="448"/>
  </g>

  <!-- PCB circuit traces (background decoration) -->
  <g stroke="#1e3a5f" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="square">
    <!-- Top-left traces -->
    <polyline points="32,32 32,96 96,96"/>
    <polyline points="16,160 80,160 80,224"/>
    <polyline points="48,448 48,384 112,384"/>
    <!-- Top-right traces -->
    <polyline points="480,48 416,48 416,112"/>
    <polyline points="496,192 432,192 432,128"/>
    <polyline points="464,480 464,416 400,416"/>
    <!-- Bottom-left traces -->
    <polyline points="32,480 96,480 96,416"/>
    <polyline points="16,320 80,320 80,256"/>
    <!-- Bottom-right traces -->
    <polyline points="480,448 416,448 416,384"/>
    <polyline points="496,320 432,320 432,384"/>
    <!-- Mid traces -->
    <polyline points="128,48 128,112 192,112"/>
    <polyline points="384,464 384,400 320,400"/>
    <polyline points="48,256 112,256 112,192"/>
    <polyline points="464,256 400,256 400,320"/>
  </g>

  <!-- Small PCB vias (dots at trace junctions) -->
  <g fill="#1e3a5f" opacity="0.5">
    <circle cx="32" cy="32" r="3"/>
    <circle cx="96" cy="96" r="3"/>
    <circle cx="480" cy="48" r="3"/>
    <circle cx="416" cy="112" r="3"/>
    <circle cx="48" cy="448" r="3"/>
    <circle cx="112" cy="384" r="3"/>
    <circle cx="464" cy="480" r="3"/>
    <circle cx="400" cy="416" r="3"/>
    <circle cx="128" cy="48" r="3"/>
    <circle cx="192" cy="112" r="3"/>
    <circle cx="48" cy="256" r="3"/>
    <circle cx="112" cy="192" r="3"/>
    <circle cx="464" cy="256" r="3"/>
    <circle cx="400" cy="320" r="3"/>
    <circle cx="16" cy="160" r="3"/>
    <circle cx="80" cy="224" r="3"/>
    <circle cx="496" cy="192" r="3"/>
    <circle cx="432" cy="128" r="3"/>
    <circle cx="16" cy="320" r="3"/>
    <circle cx="80" cy="256" r="3"/>
    <circle cx="496" cy="320" r="3"/>
    <circle cx="432" cy="384" r="3"/>
    <circle cx="32" cy="480" r="3"/>
    <circle cx="96" cy="416" r="3"/>
    <circle cx="480" cy="448" r="3"/>
    <circle cx="416" cy="384" r="3"/>
  </g>

  <!-- Main signal path (glowing cyan right-angle segments) -->
  <g filter="url(#pathGlow)">
    <polyline points="72,440 160,440 160,352 256,352 256,256 352,256 352,160 440,160"
              fill="none" stroke="#00e5ff" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- Path inner highlight (brighter core) -->
  <polyline points="72,440 160,440 160,352 256,352 256,256 352,256 352,160 440,160"
            fill="none" stroke="#80f5ff" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" opacity="0.6"/>

  <!-- Start node (lower-left cyan dot) -->
  <circle cx="72" cy="440" r="16" fill="url(#startGlow)"/>
  <circle cx="72" cy="440" r="6" fill="#00e5ff" filter="url(#softGlow)"/>
  <circle cx="72" cy="440" r="2.5" fill="#ffffff" opacity="0.9"/>

  <!-- Target node (upper-right flat-top hexagon, green) -->
  <circle cx="440" cy="160" r="28" fill="url(#hexGlow)"/>
  <polygon points="460,160 450,142.68 430,142.68 420,160 430,177.32 450,177.32"
           fill="#00ff88" stroke="#00ff88" stroke-width="1" filter="url(#softGlow)"/>
  <polygon points="456,160 448,146.2 432,146.2 424,160 432,173.8 448,173.8"
           fill="#66ffbb" opacity="0.5"/>
  <circle cx="440" cy="160" r="3" fill="#ffffff" opacity="0.8"/>

  <!-- Data packet (glowing cyan circle on the path) -->
  <!-- Positioned on the vertical segment at (256, 304) -->
  <circle cx="256" cy="304" r="24" fill="url(#packetGlow)"/>
  <circle cx="256" cy="304" r="8" fill="#00e5ff" filter="url(#softGlow)"/>
  <circle cx="256" cy="304" r="3" fill="#ffffff"/>

  <!-- Subtle corner accents (PCB mounting holes) -->
  <g fill="none" stroke="#1e3a5f" stroke-width="1.5" opacity="0.4">
    <circle cx="24" cy="24" r="6"/>
    <circle cx="488" cy="24" r="6"/>
    <circle cx="24" cy="488" r="6"/>
    <circle cx="488" cy="488" r="6"/>
  </g>

  <!-- Faint ambient light overlay (desk lamp effect) -->
  <radialGradient id="lampLight" cx="50%" cy="45%" r="60%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.03"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
  </radialGradient>
  <rect width="512" height="512" fill="url(#lampLight)"/>
</svg>
