
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowYellow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowRing" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="badgeClip">
      <rect width="512" height="512" rx="28"/>
    </clipPath>
  </defs>

  <!-- Badge background -->
  <rect width="512" height="512" rx="28" fill="#0a1628"/>

  <!-- Subtle grid lines -->
  <g clip-path="url(#badgeClip)" stroke="#122240" stroke-width="1" opacity="0.6">
    <line x1="64" y1="0" x2="64" y2="512"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="192" y1="0" x2="192" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="320" y1="0" x2="320" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="448" y1="0" x2="448" y2="512"/>
    <line x1="0" y1="64" x2="512" y2="64"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="192" x2="512" y2="192"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="0" y1="448" x2="512" y2="448"/>
  </g>

  <!-- Parabolic arc trajectory -->
  <path d="M 130 365 Q 240 90 400 210" fill="none" stroke="#00e5ff" stroke-width="4" stroke-linecap="round" filter="url(#glowCyan)" opacity="0.9"/>
  <!-- Arc inner highlight -->
  <path d="M 130 365 Q 240 90 400 210" fill="none" stroke="#a0f8ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Dashed trajectory dots along arc -->
  <g fill="#00e5ff" opacity="0.5">
    <circle cx="175" cy="310" r="3"/>
    <circle cx="210" cy="255" r="3"/>
    <circle cx="240" cy="200" r="3"/>
    <circle cx="270" cy="155" r="3"/>
    <circle cx="305" cy="130" r="3"/>
    <circle cx="340" cy="145" r="3"/>
    <circle cx="370" cy="175" r="3"/>
  </g>

  <!-- Coil launcher at bottom-left -->
  <g transform="translate(80, 340)">
    <!-- Base platform -->
    <rect x="-10" y="40" width="70" height="18" rx="4" fill="#0d7a6a"/>
    <rect x="-6" y="38" width="62" height="6" rx="2" fill="#14a88e"/>
    <!-- Coil body -->
    <rect x="8" y="10" width="34" height="32" rx="4" fill="#0d7a6a"/>
    <!-- Coil windings -->
    <ellipse cx="25" cy="18" rx="14" ry="5" fill="none" stroke="#2ee6c8" stroke-width="2.5"/>
    <ellipse cx="25" cy="26" rx="14" ry="5" fill="none" stroke="#2ee6c8" stroke-width="2.5"/>
    <ellipse cx="25" cy="34" rx="14" ry="5" fill="none" stroke="#2ee6c8" stroke-width="2.5"/>
    <!-- Barrel / nozzle -->
    <rect x="38" y="20" width="22" height="12" rx="3" fill="#14a88e"/>
    <rect x="56" y="22" width="8" height="8" rx="2" fill="#2ee6c8"/>
    <!-- Small base legs -->
    <rect x="0" y="56" width="10" height="8" rx="2" fill="#0d7a6a"/>
    <rect x="42" y="56" width="10" height="8" rx="2" fill="#0d7a6a"/>
  </g>

  <!-- Glowing cyan energy orb at launcher exit -->
  <circle cx="130" cy="365" r="12" fill="#00e5ff" filter="url(#glowCyan)"/>
  <circle cx="130" cy="365" r="7" fill="#a0f8ff"/>
  <circle cx="130" cy="365" r="3" fill="#ffffff"/>

  <!-- Glowing ring gate on the right -->
  <g filter="url(#glowRing)">
    <circle cx="400" cy="210" r="32" fill="none" stroke="#00e5ff" stroke-width="5"/>
  </g>
  <circle cx="400" cy="210" r="32" fill="none" stroke="#a0f8ff" stroke-width="2"/>
  <!-- Inner ring detail -->
  <circle cx="400" cy="210" r="20" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.5"/>
  <!-- Center dot -->
  <circle cx="400" cy="210" r="5" fill="#00e5ff" opacity="0.8"/>
  <!-- Gate support struts -->
  <line x1="400" y1="242" x2="400" y2="270" stroke="#0d7a6a" stroke-width="4" stroke-linecap="round"/>
  <line x1="388" y1="270" x2="412" y2="270" stroke="#0d7a6a" stroke-width="4" stroke-linecap="round"/>


  <!-- Subtle border glow -->
  <rect width="512" height="512" rx="28" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.15"/>
</svg>
