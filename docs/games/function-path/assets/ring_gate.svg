
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="none"/>
  <!-- Soft outer glow -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#00e5ff" stroke-width="4" opacity="0.15"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.25"/>
  <!-- Main cyan ring -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#00e5ff" stroke-width="8"/>
  <!-- White inner edge -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Dark navy center -->
  <circle cx="32" cy="32" r="16" fill="#0a1628"/>
  <!-- Tick marks (8 positions, 45° apart) -->
  <g stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round">
    <line x1="58" y1="32" x2="61" y2="32"/>
    <line x1="50.4" y1="50.4" x2="52.5" y2="52.5"/>
    <line x1="32" y1="58" x2="32" y2="61"/>
    <line x1="13.6" y1="50.4" x2="11.5" y2="52.5"/>
    <line x1="6" y1="32" x2="3" y2="32"/>
    <line x1="13.6" y1="13.6" x2="11.5" y2="11.5"/>
    <line x1="32" y1="6" x2="32" y2="3"/>
    <line x1="50.4" y1="13.6" x2="52.5" y2="11.5"/>
  </g>
</svg>
