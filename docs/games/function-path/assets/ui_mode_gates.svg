<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="128" height="128" rx="14" fill="#0a1628"/>

  <!-- serpentine board: 6 cols x 5 rows, checkerboard tiles -->
  <g>
    <!-- row 0 -->
    <rect x="12"  y="12" width="14" height="14" rx="2" fill="#12233f"/>
    <rect x="27"  y="12" width="14" height="14" rx="2" fill="#0e1c33"/>
    <rect x="42"  y="12" width="14" height="14" rx="2" fill="#12233f"/>
    <rect x="57"  y="12" width="14" height="14" rx="2" fill="#0e1c33"/>
    <rect x="72"  y="12" width="14" height="14" rx="2" fill="#12233f"/>
    <rect x="87"  y="12" width="14" height="14" rx="2" fill="#0e1c33"/>
    <!-- row 1 -->
    <rect x="12"  y="27" width="14" height="14" rx="2" fill="#0e1c33"/>
    <rect x="27"  y="27" width="14" height="14" rx="2" fill="#12233f"/>
    <rect x="42"  y="27" width="14" height="14" rx="2" fill="#0e1c33"/>
    <rect x="57"  y="27" width="14" height="14" rx="2" fill="#12233f"/>
    <rect x="72"  y="27" width="14" height="14" rx="2" fill="#0e1c33"/>
    <rect x="87"  y="27" width="14" height="14" rx="2" fill="#12233f"/>
    <!-- row 2 -->
    <rect x="12"  y="42" width="14" height="14" rx="2" fill="#12233f"/>
    <rect x="27"  y="42" width="14" height="14" rx="2" fill="#0e1c33"/>
    <rect x="42"  y="42" width="14" height="14" rx="2" fill="#12233f"/>
    <rect x="57"  y="42" width="14" height="14" rx="2" fill="#0e1c33"/>
    <rect x="72"  y="42" width="14" height="14" rx="2" fill="#12233f"/>
    <rect x="87"  y="42" width="14" height="14" rx="2" fill="#0e1c33"/>
    <!-- row 3 -->
    <rect x="12"  y="57" width="14" height="14" rx="2" fill="#0e1c33"/>
    <rect x="27"  y="57" width="14" height="14" rx="2" fill="#12233f"/>
    <rect x="42"  y="57" width="14" height="14" rx="2" fill="#0e1c33"/>
    <rect x="57"  y="57" width="14" height="14" rx="2" fill="#12233f"/>
    <rect x="72"  y="57" width="14" height="14" rx="2" fill="#0e1c33"/>
    <rect x="87"  y="57" width="14" height="14" rx="2" fill="#12233f"/>
    <!-- row 4 -->
    <rect x="12"  y="72" width="14" height="14" rx="2" fill="#12233f"/>
    <rect x="27"  y="72" width="14" height="14" rx="2" fill="#0e1c33"/>
    <rect x="42"  y="72" width="14" height="14" rx="2" fill="#12233f"/>
    <rect x="57"  y="72" width="14" height="14" rx="2" fill="#0e1c33"/>
    <rect x="72"  y="72" width="14" height="14" rx="2" fill="#12233f"/>
    <rect x="87"  y="72" width="14" height="14" rx="2" fill="#0e1c33"/>
  </g>

  <!-- glowing cyan ladder climbing the board -->
  <g stroke="#35e0ff" stroke-width="2.4" stroke-linecap="round" filter="url(#glow)">
    <line x1="25.2" y1="82.8" x2="53.2" y2="18.8"/>
    <line x1="30.8" y1="85.2" x2="58.8" y2="21.2"/>
    <line x1="30.9" y1="70"   x2="36.3" y2="72.4"/>
    <line x1="36.5" y1="57.2" x2="41.9" y2="59.6"/>
    <line x1="42.1" y1="44.4" x2="47.5" y2="46.8"/>
    <line x1="47.7" y1="31.6" x2="53.1" y2="34"/>
  </g>

  <!-- green snake slithering down the board -->
  <g fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round">
    <path d="M 94 20 C 76 28, 98 42, 80 52 C 64 61, 90 70, 74 80"/>
  </g>
  <circle cx="94" cy="20" r="4.6" fill="#4ade80"/>
  <circle cx="95.4" cy="18.8" r="1.1" fill="#0a1628"/>

  <!-- cute robot piece on a tile -->
  <g>
    <line x1="19" y1="64" x2="19" y2="61.5" stroke="#35e0ff" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="19" cy="60.5" r="1.4" fill="#35e0ff"/>
    <rect x="14.5" y="64.5" width="9" height="9.5" rx="2.5" fill="#35e0ff"/>
    <circle cx="17.3" cy="68.5" r="1.3" fill="#0a1628"/>
    <circle cx="20.7" cy="68.5" r="1.3" fill="#0a1628"/>
  </g>

  <!-- die with 3 pips -->
  <g>
    <rect x="88" y="94" width="26" height="26" rx="5" fill="#f5f7fa"/>
    <circle cx="95"  cy="101" r="2.6" fill="#0a1628"/>
    <circle cx="101" cy="107" r="2.6" fill="#0a1628"/>
    <circle cx="107" cy="113" r="2.6" fill="#0a1628"/>
  </g>

  <!-- probability forecast spark (small +1 turn hint) -->
  <g stroke="#ffd166" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="14" y1="107" x2="26" y2="107"/>
    <line x1="20" y1="101" x2="20" y2="113"/>
  </g>
</svg>
