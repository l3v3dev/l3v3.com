
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="0" y="0" width="128" height="128" rx="8"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Background -->
    <rect width="128" height="128" fill="#0a1628"/>

    <!-- Subtle grid -->
    <g stroke="#1a2a44" stroke-width="0.5" opacity="0.5">
      <line x1="16" y1="0" x2="16" y2="128"/>
      <line x1="32" y1="0" x2="32" y2="128"/>
      <line x1="48" y1="0" x2="48" y2="128"/>
      <line x1="64" y1="0" x2="64" y2="128"/>
      <line x1="80" y1="0" x2="80" y2="128"/>
      <line x1="96" y1="0" x2="96" y2="128"/>
      <line x1="112" y1="0" x2="112" y2="128"/>
      <line x1="0" y1="16" x2="128" y2="16"/>
      <line x1="0" y1="32" x2="128" y2="32"/>
      <line x1="0" y1="48" x2="128" y2="48"/>
      <line x1="0" y1="64" x2="128" y2="64"/>
      <line x1="0" y1="80" x2="128" y2="80"/>
      <line x1="0" y1="96" x2="128" y2="96"/>
      <line x1="0" y1="112" x2="128" y2="112"/>
    </g>

    <!-- Gray hazard region (top, hanging down) -->
<path d="M 0,0 L 0,30 C 21,45 43,45 64,30 C 85,15 107,15 128,30 L 128,0 Z" fill="#3a3f4a"/>
<path d="M 0,30 C 21,45 43,45 64,30 C 85,15 107,15 128,30" fill="none" stroke="#4a5060" stroke-width="1.5"/>

    <!-- Red hazard region (bottom, rising up) -->
    <path d="M 0,128 L 0,85 C 21,70 43,70 64,85 C 85,100 107,100 128,85 L 128,128 Z" fill="#8b1a1a"/>
    <path d="M 0,85 C 21,70 43,70 64,85 C 85,100 107,100 128,85" fill="none" stroke="#c03030" stroke-width="1.5"/>

    <!-- Cyan glowing sine curve (middle safe path) -->
    <path d="M 0,75 C 21,50 43,50 64,65 C 85,80 107,80 128,65" fill="none" stroke="#00e5ff" stroke-width="6" opacity="0.25" filter="url(#softglow)"/>
    <path d="M 0,75 C 21,50 43,50 64,65 C 85,80 107,80 128,65" fill="none" stroke="#00e5ff" stroke-width="2.5" filter="url(#glow)"/>
    <path d="M 0,75 C 21,50 43,50 64,65 C 85,80 107,80 128,65" fill="none" stroke="#aaffff" stroke-width="1" opacity="0.8"/>

    <!-- Cute rounded robot sprite on the curve at x=64, y=65 -->
    <g transform="translate(64, 60)">
      <!-- Antenna -->
      <line x1="0" y1="-12" x2="0" y2="-8" stroke="#8899aa" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="0" cy="-13" r="2" fill="#00e5ff" opacity="0.9"/>

      <!-- Body -->
      <rect x="-8" y="-8" width="16" height="14" rx="5" ry="5" fill="#5a6a7a"/>
      <rect x="-8" y="-8" width="16" height="14" rx="5" ry="5" fill="none" stroke="#7a8a9a" stroke-width="1"/>

      <!-- Face plate -->
      <rect x="-5.5" y="-5" width="11" height="8" rx="3" ry="3" fill="#1a2a3a"/>

      <!-- Eyes -->
      <circle cx="-2.5" cy="-1" r="1.8" fill="#00e5ff"/>
      <circle cx="2.5" cy="-1" r="1.8" fill="#00e5ff"/>
      <circle cx="-2.5" cy="-1" r="0.7" fill="#ffffff" opacity="0.9"/>
      <circle cx="2.5" cy="-1" r="0.7" fill="#ffffff" opacity="0.9"/>

      <!-- Mouth (small smile) -->
      <path d="M -1.5,2 Q 0,3.5 1.5,2" fill="none" stroke="#00e5ff" stroke-width="0.8" stroke-linecap="round"/>

      <!-- Feet -->
      <rect x="-5" y="6" width="4" height="3" rx="1.5" ry="1.5" fill="#4a5a6a"/>
      <rect x="1" y="6" width="4" height="3" rx="1.5" ry="1.5" fill="#4a5a6a"/>

      <!-- Small arms -->
      <rect x="-10" y="-2" width="3" height="5" rx="1.5" ry="1.5" fill="#4a5a6a"/>
      <rect x="7" y="-2" width="3" height="5" rx="1.5" ry="1.5" fill="#4a5a6a"/>
    </g>

    <!-- Subtle vignette -->
    <rect width="128" height="128" fill="none" stroke="#0a1628" stroke-width="4" opacity="0.3" rx="8"/>
  </g>

  <!-- Rounded border -->
  <rect x="0.5" y="0.5" width="127" height="127" rx="8" fill="none" stroke="#1a2a44" stroke-width="1"/>
</svg>
