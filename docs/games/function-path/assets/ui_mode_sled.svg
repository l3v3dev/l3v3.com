
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" fill="#0a1628"/>

  <!-- Subtle grid -->
  <g stroke="#1e3050" stroke-width="0.5" opacity="0.35">
    <line x1="16" y1="0" x2="16" y2="128"/>
    <line x1="32" y1="0" x2="32" y2="128"/>
    <line x1="48" y1="0" x2="48" y2="128"/>
    <line x1="64" y1="0" x2="64" y2="128"/>
    <line x1="80" y1="0" x2="80" y2="128"/>
    <line x1="96" y1="0" x2="96" y2="128"/>
    <line x1="112" y1="0" x2="112" y2="128"/>
    <line x1="0" y1="16" x2="128" y2="16"/>
    <line x1="0" y1="32" x2="128" y2="32"/>
    <line x1="0" y1="48" x2="128" y2="48"/>
    <line x1="0" y1="64" x2="128" y2="64"/>
    <line x1="0" y1="80" x2="128" y2="80"/>
    <line x1="0" y1="96" x2="128" y2="96"/>
    <line x1="0" y1="112" x2="128" y2="112"/>
  </g>

  <!-- Cyan glowing slope -->
  <path d="M 18 22 Q 38 32, 58 62 Q 78 92, 112 114" fill="none" stroke="#00e5ff" stroke-width="10" opacity="0.1" stroke-linecap="round"/>
  <path d="M 18 22 Q 38 32, 58 62 Q 78 92, 112 114" fill="none" stroke="#00e5ff" stroke-width="5" opacity="0.25" stroke-linecap="round"/>
  <path d="M 18 22 Q 38 32, 58 62 Q 78 92, 112 114" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Speed lines behind robot -->
  <g stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.85">
    <line x1="36" y1="38" x2="50" y2="50"/>
    <line x1="33" y1="44" x2="47" y2="55"/>
    <line x1="39" y1="34" x2="52" y2="46"/>
  </g>

  <!-- Cute rounded robot sliding on slope -->
  <g transform="translate(56,56) rotate(40)">
    <!-- Body -->
    <rect x="-8" y="-9" width="16" height="18" rx="6" ry="6" fill="#e4e6f0"/>
    <!-- Face screen -->
    <rect x="-5" y="-5.5" width="10" height="8" rx="2.5" ry="2.5" fill="#12203a"/>
    <!-- Eyes -->
    <circle cx="-2.2" cy="-1.5" r="1.4" fill="#00e5ff"/>
    <circle cx="2.2" cy="-1.5" r="1.4" fill="#00e5ff"/>
    <!-- Eye highlights -->
    <circle cx="-1.8" cy="-2" r="0.5" fill="#ffffff"/>
    <circle cx="2.6" cy="-2" r="0.5" fill="#ffffff"/>
    <!-- Antenna -->
    <line x1="0" y1="-9" x2="0" y2="-12.5" stroke="#e4e6f0" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="-13.5" r="1.8" fill="#ff4466"/>
    <!-- Feet -->
    <rect x="-6" y="8" width="4.5" height="3.5" rx="2" ry="2" fill="#a8aab8"/>
    <rect x="1.5" y="8" width="4.5" height="3.5" rx="2" ry="2" fill="#a8aab8"/>
  </g>

  <!-- Clock icon top-right -->
  <g transform="translate(108,20)">
    <circle cx="0" cy="0" r="11" fill="#0a1628" stroke="#d0d4e0" stroke-width="1.5"/>
    <!-- Tick marks -->
    <line x1="0" y1="-9" x2="0" y2="-7" stroke="#d0d4e0" stroke-width="1" stroke-linecap="round"/>
    <line x1="9" y1="0" x2="7" y2="0" stroke="#d0d4e0" stroke-width="1" stroke-linecap="round"/>
    <line x1="0" y1="9" x2="0" y2="7" stroke="#d0d4e0" stroke-width="1" stroke-linecap="round"/>
    <line x1="-9" y1="0" x2="-7" y2="0" stroke="#d0d4e0" stroke-width="1" stroke-linecap="round"/>
    <!-- Hour hand -->
    <line x1="0" y1="0" x2="3.5" y2="-2.5" stroke="#d0d4e0" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Minute hand -->
    <line x1="0" y1="0" x2="-2" y2="-6" stroke="#d0d4e0" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Red second hand -->
    <line x1="0" y1="0" x2="5.5" y2="4.5" stroke="#ff3344" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="1.2" fill="#ff3344"/>
  </g>
</svg>
