<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vector Navigator - Word Embedding 3D</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #050510;
      overflow: hidden;
    }

    canvas {
      display: block;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050510;
      color: #eee;
      font-family: system-ui, sans-serif;
      font-size: 1.5rem;
      z-index: 10;
    }

    #loading.hidden {
      display: none;
    }
    #loading .textblink{animation:animblink 1s infinite steps(4,start)}@keyframes animblink{to{visibility:hidden}}
  </style>
</head>

<body>
  <div id="loading">Loading <span class="textblink">...</span></div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
      "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>
  <script defer src="game.min.js"></script>
</body>

</html>
