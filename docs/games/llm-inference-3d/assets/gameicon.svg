
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#12122a"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <radialGradient id="orbHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00e5ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGlow)"/>

  <!-- Constellation lines (thin faint cyan) -->
  <g stroke="#00e5ff" stroke-width="1" stroke-opacity="0.25" fill="none">
    <line x1="130" y1="140" x2="180" y2="100"/>
    <line x1="180" y1="100" x2="350" y2="180"/>
    <line x1="350" y1="180" x2="370" y2="120"/>
    <line x1="370" y1="120" x2="420" y2="250"/>
    <line x1="420" y1="250" x2="400" y2="350"/>
    <line x1="400" y1="350" x2="320" y2="400"/>
    <line x1="320" y1="400" x2="160" y2="380"/>
    <line x1="160" y1="380" x2="100" y2="300"/>
    <line x1="100" y1="300" x2="90" y2="200"/>
    <line x1="90" y1="200" x2="130" y2="140"/>
    <line x1="130" y1="140" x2="256" y2="256"/>
    <line x1="400" y1="350" x2="256" y2="256"/>
    <line x1="90" y1="200" x2="256" y2="256"/>
    <line x1="350" y1="180" x2="256" y2="256"/>
    <line x1="160" y1="380" x2="256" y2="256"/>
  </g>

  <!-- Word nodes (tiny glowing dots) -->
  <g filter="url(#glow)">
    <circle cx="130" cy="140" r="5" fill="#00e5ff"/>
    <circle cx="180" cy="100" r="4" fill="#ffd75e"/>
    <circle cx="350" cy="180" r="5" fill="#00ff88"/>
    <circle cx="370" cy="120" r="4" fill="#00ff88"/>
    <circle cx="420" cy="250" r="5" fill="#ff4444"/>
    <circle cx="400" cy="350" r="4" fill="#ffd75e"/>
    <circle cx="320" cy="400" r="5" fill="#00e5ff"/>
    <circle cx="160" cy="380" r="4" fill="#00e5ff"/>
    <circle cx="100" cy="300" r="5" fill="#ff4444"/>
    <circle cx="90" cy="200" r="4" fill="#00ff88"/>
  </g>

  <!-- Central probe orb -->
  <circle cx="256" cy="256" r="90" fill="url(#orbHalo)"/>
  <circle cx="256" cy="256" r="45" fill="#00e5ff" fill-opacity="0.15"/>
  <circle cx="256" cy="256" r="28" fill="#00e5ff" fill-opacity="0.4"/>
  <circle cx="256" cy="256" r="18" fill="url(#orbCore)" filter="url(#softGlow)"/>
  <circle cx="256" cy="256" r="8" fill="#ffffff" fill-opacity="0.95"/>

  <!-- Main cyan vector arrow (bold, sweeping from constellation toward probe) -->
  <g filter="url(#glow)">
    <line x1="110" y1="130" x2="215" y2="225" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
    <polygon points="225,235 205,215 215,225 205,235" fill="#00e5ff"/>
    <polygon points="228,238 200,218 210,238" fill="#00e5ff"/>
  </g>

  <!-- Green arrow (smaller, pointing in toward center) -->
  <g filter="url(#glow)">
    <line x1="390" y1="390" x2="305" y2="305" stroke="#00ff88" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="298,298 312,302 302,312" fill="#00ff88"/>
  </g>

  <!-- Red arrow (smaller, pointing out away from center) -->
  <g filter="url(#glow)">
    <line x1="290" y1="210" x2="370" y2="140" stroke="#ff4444" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="378,132 362,142 372,152" fill="#ff4444"/>
  </g>

  <!-- Equation text at bottom -->
  <text x="256" y="478" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="16" fill="#00e5ff" fill-opacity="0.85" filter="url(#textGlow)" letter-spacing="1">king − man + woman = ?</text>

  <!-- Subtle HUD corner accents -->
  <g stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.3" fill="none">
    <polyline points="20,40 20,20 40,20"/>
    <polyline points="472,20 492,20 492,40"/>
    <polyline points="492,472 492,492 472,492"/>
    <polyline points="40,492 20,492 20,472"/>
  </g>
</svg>
