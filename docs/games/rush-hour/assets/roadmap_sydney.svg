  <path d="M56 468 q8 6 16 0 M152 464 q8 6 16 0 M248 470 q8 6 16 0 M344 464 q8 6 16 0 M440 470 q8 6 16 0 M536 464 q8 6 16 0 M632 470 q8 6 16 0" stroke="#8fbcd9" stroke-width="2" fill="none"/>
  <rect x="664" width="56" height="56" fill="#79aecd"/>
  <rect x="664" width="4" height="56" fill="#5d92b4"/>
  <path d="M694 20 q8 6 16 0" stroke="#8fbcd9" stroke-width="2" fill="none"/>

