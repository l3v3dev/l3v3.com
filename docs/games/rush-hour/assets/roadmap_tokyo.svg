  <use href="#xint" x="0" y="384"/><use href="#xint" x="96" y="384"/><use href="#xint" x="192" y="384"/><use href="#xint" x="288" y="384"/><use href="#xint" x="384" y="384"/><use href="#xint" x="480" y="384"/><use href="#xint" x="576" y="384"/><use href="#xint" x="672" y="384"/>
