  <use href="#vroad" x="384"/><use href="#vroad" x="480"/><use href="#vroad" x="576"/><use href="#vroad" x="672"/>

  <!-- intersections with zebra crossings -->
  <use href="#xint" x="0" y="0"/><use href="#xint" x="96" y="0"/><use href="#xint" x="192" y="0"/><use href="#xint" x="288" y="0"/><use href="#xint" x="384" y="0"/><use href="#xint" x="480" y="0"/><use href="#xint" x="576" y="0"/><use href="#xint" x="672" y="0"/>
