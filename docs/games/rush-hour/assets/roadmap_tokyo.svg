  <use href="#park" x="48" y="432"/><use href="#blkC" x="192" y="432"/><use href="#blkB" x="336" y="432"/><use href="#blkC" x="480" y="432"/><use href="#blkA" x="624" y="432"/>

  <!-- street names -->
