  <rect y="188" width="720" height="4" fill="#5d92b4"/>
  <path d="M56 168 q8 6 16 0 M152 160 q8 6 16 0 M248 172 q8 6 16 0 M344 160 q8 6 16 0 M440 172 q8 6 16 0 M536 160 q8 6 16 0 M632 172 q8 6 16 0" stroke="#8fbcd9" stroke-width="2" fill="none"/>

