
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Parapet border (stone) -->
  <rect x="0" y="0" width="128" height="128" fill="#B5A99A"/>
  <!-- Parapet inner shadow edge -->
  <rect x="8" y="8" width="112" height="112" fill="#9E9488"/>
  <!-- Main brick-red flat roof -->
  <rect x="10" y="10" width="108" height="108" fill="#9C5B4F"/>
  <!-- Subtle roof texture lines -->
  <line x1="10" y1="38" x2="118" y2="38" stroke="#8A4E43" stroke-width="1" opacity="0.5"/>
  <line x1="10" y1="66" x2="118" y2="66" stroke="#8A4E43" stroke-width="1" opacity="0.5"/>
  <line x1="10" y1="94" x2="118" y2="94" stroke="#8A4E43" stroke-width="1" opacity="0.5"/>
  <line x1="38" y1="10" x2="38" y2="118" stroke="#8A4E43" stroke-width="1" opacity="0.4"/>
  <line x1="66" y1="10" x2="66" y2="118" stroke="#8A4E43" stroke-width="1" opacity="0.4"/>
  <line x1="94" y1="10" x2="94" y2="118" stroke="#8A4E43" stroke-width="1" opacity="0.4"/>
  <!-- Skylight frame -->
  <rect x="72" y="22" width="28" height="20" rx="1" fill="#7A7A7A"/>
  <!-- Skylight glass -->
  <rect x="74" y="24" width="24" height="16" rx="1" fill="#B8C8D8"/>
  <!-- Skylight glass highlight -->
  <rect x="76" y="26" width="10" height="6" rx="1" fill="#D4E0EC" opacity="0.7"/>
  <!-- Skylight cross bar -->
  <line x1="86" y1="24" x2="86" y2="40" stroke="#7A7A7A" stroke-width="1.5"/>
  <!-- Rooftop vent outer ring -->
  <circle cx="36" cy="88" r="9" fill="#6B6B6B"/>
  <!-- Rooftop vent inner -->
  <circle cx="36" cy="88" r="6" fill="#4A4A4A"/>
  <!-- Vent cap detail -->
  <circle cx="36" cy="88" r="3" fill="#5A5A5A"/>
  <!-- Vent cross slats -->
  <line x1="30" y1="88" x2="42" y2="88" stroke="#3A3A3A" stroke-width="1"/>
  <line x1="36" y1="82" x2="36" y2="94" stroke="#3A3A3A" stroke-width="1"/>
  <!-- Parapet top highlight -->
  <rect x="0" y="0" width="128" height="2" fill="#C4B8AA" opacity="0.6"/>
  <rect x="0" y="0" width="2" height="128" fill="#C4B8AA" opacity="0.6"/>
</svg>
