<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Rounded app-icon background -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#23232b"/>

  <!-- City blocks (buildings) -->
  <g fill="#34343e">
    <rect x="128" y="128" width="96" height="96" rx="8"/>
    <rect x="304" y="128" width="96" height="96" rx="8"/>
    <rect x="128" y="304" width="96" height="96" rx="8"/>
    <rect x="304" y="304" width="96" height="96" rx="8"/>
  </g>
  <!-- Rooftop details -->
  <g fill="#3f3f4b">
    <rect x="144" y="144" width="32" height="32" rx="4"/>
    <rect x="320" y="144" width="32" height="32" rx="4"/>
    <rect x="144" y="320" width="32" height="32" rx="4"/>
    <rect x="320" y="320" width="32" height="32" rx="4"/>
  </g>

  <!-- Roads: grey asphalt strips -->
  <g fill="#4a4a52">
    <rect x="32" y="0" width="80" height="512"/>
    <rect x="216" y="0" width="80" height="512"/>
    <rect x="400" y="0" width="80" height="512"/>
    <rect x="0" y="32" width="512" height="80"/>
    <rect x="0" y="216" width="512" height="80"/>
    <rect x="0" y="400" width="512" height="80"/>
  </g>

  <!-- Dashed road centre lines -->
  <g stroke="#d8d8d8" stroke-width="6" stroke-dasharray="20 18" opacity="0.85">
    <line x1="72" y1="128" x2="72" y2="216"/>
    <line x1="72" y1="304" x2="72" y2="400"/>
    <line x1="256" y1="128" x2="256" y2="216"/>
    <line x1="256" y1="304" x2="256" y2="400"/>
    <line x1="440" y1="128" x2="440" y2="216"/>
    <line x1="440" y1="304" x2="440" y2="400"/>
    <line x1="128" y1="72" x2="216" y2="72"/>
    <line x1="304" y1="72" x2="400" y2="72"/>
    <line x1="128" y1="256" x2="216" y2="256"/>
    <line x1="304" y1="256" x2="400" y2="256"/>
    <line x1="128" y1="440" x2="216" y2="440"/>
    <line x1="304" y1="440" x2="400" y2="440"/>
  </g>

  <!-- Destination house (top-right road tile) with pulsing gold glow ring -->
  <circle cx="440" cy="72" r="52" fill="none" stroke="#F5C542" stroke-width="8" opacity="0.9"/>
  <rect x="412" y="44" width="56" height="56" fill="#C0392B" stroke="#333333" stroke-width="4"/>
  <rect x="428" y="60" width="24" height="24" fill="#FDF6E3"/>

  <!-- Player car: yellow top-down sedan, centre road, heading up -->
  <g>
    <rect x="232" y="300" width="48" height="84" rx="10" fill="#F5C542" stroke="#333333" stroke-width="4"/>
    <rect x="240" y="316" width="32" height="14" rx="3" fill="#444444"/>
    <rect x="240" y="356" width="32" height="12" rx="3" fill="#444444"/>
    <line x1="256" y1="304" x2="256" y2="380" stroke="#444444" stroke-width="3"/>
    <!-- motion dashes behind the car -->
    <g stroke="#F5C542" stroke-width="6" stroke-linecap="round" opacity="0.7">
      <line x1="244" y1="398" x2="244" y2="412"/>
      <line x1="268" y1="398" x2="268" y2="412"/>
    </g>
  </g>

  <!-- Countdown timer badge (top-left road tile) -->
  <circle cx="72" cy="72" r="34" fill="#23232b" stroke="#F5C542" stroke-width="6"/>
  <line x1="72" y1="72" x2="72" y2="50" stroke="#F5C542" stroke-width="6" stroke-linecap="round"/>
  <line x1="72" y1="72" x2="88" y2="80" stroke="#F5C542" stroke-width="6" stroke-linecap="round"/>
  <circle cx="72" cy="72" r="4" fill="#F5C542"/>
</svg>
