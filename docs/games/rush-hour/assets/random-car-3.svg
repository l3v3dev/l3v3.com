
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Car body -->
  <rect x="34" y="12" width="60" height="104" rx="12" ry="12" fill="#1a2d52"/>
  <!-- Front bumper highlight -->
  <rect x="38" y="14" width="52" height="6" rx="3" fill="#223a66"/>
  <!-- Rear bumper highlight -->
  <rect x="38" y="108" width="52" height="6" rx="3" fill="#223a66"/>
  <!-- Windshield -->
  <polygon points="44,22 84,22 80,38 48,38" fill="#0b1628"/>
  <!-- Rear window -->
  <polygon points="48,90 80,90 84,106 44,106" fill="#0b1628"/>
  <!-- Left side window -->
  <rect x="36" y="42" width="7" height="44" rx="2" fill="#0b1628"/>
  <!-- Right side window -->
  <rect x="85" y="42" width="7" height="44" rx="2" fill="#0b1628"/>
  <!-- Roof panel -->
  <rect x="45" y="40" width="38" height="48" rx="4" fill="#243d6b"/>
  <!-- Roof rail left -->
  <line x1="45" y1="42" x2="45" y2="86" stroke="#8a9bb5" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Roof rail right -->
  <line x1="83" y1="42" x2="83" y2="86" stroke="#8a9bb5" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Roof rail cross bar front -->
  <line x1="45" y1="44" x2="83" y2="44" stroke="#8a9bb5" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Roof rail cross bar rear -->
  <line x1="45" y1="84" x2="83" y2="84" stroke="#8a9bb5" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Wheels -->
  <rect x="29" y="24" width="6" height="15" rx="2" fill="#0e0e12"/>
  <rect x="93" y="24" width="6" height="15" rx="2" fill="#0e0e12"/>
  <rect x="29" y="89" width="6" height="15" rx="2" fill="#0e0e12"/>
  <rect x="93" y="89" width="6" height="15" rx="2" fill="#0e0e12"/>
  <!-- Front hood center line -->
  <line x1="64" y1="16" x2="64" y2="22" stroke="#2a4470" stroke-width="1"/>
  <!-- Rear trunk center line -->
  <line x1="64" y1="106" x2="64" y2="112" stroke="#2a4470" stroke-width="1"/>
</svg>
