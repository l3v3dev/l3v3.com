<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>LLM Inference</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #0a0e1a;
    }

    canvas {
      display: block;
      margin: 0 auto;
      background: #0a0e1a;
      /* Scale to fit the viewport while keeping the 3:2 aspect ratio
         (matches the gpt.png maze map). Pointer input is normalized via
         getBoundingClientRect in main.js, so taps map correctly at any
         display size. */
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      touch-action: manipulation;
    }
  </style>
</head>

<body>
  <canvas id="game-canvas" width="960" height="640"></canvas>
  <script defer src="game.min.js"></script>
