<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1440" width="1240" height="1440" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>GPT decoder transformer as a tube system with token balls</title>
<desc>The full forward pass of a GPT-style decoder drawn as a continuous closed tube. Token balls travel through tokenization, token and positional embedding, then a decoder block containing pre-LayerNorm, fused QKV projection, head splitting, scaled dot-product scores, causal masking, softmax, weighted sum, head concatenation, output projection, residual add, second LayerNorm, feed-forward up-projection, GELU, down-projection and second residual add, then final LayerNorm, tied LM head, vocabulary softmax and sampling, before looping back around as the autoregressive loop.</desc>

<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .bx{fill:#161b28;stroke-width:1.4;}
    .tt{fill:#e7e9ee;font-size:14px;font-weight:600;}
    .st{fill:#8b93a8;font-size:11.5px;font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;}
    .lbl{fill:#6c7488;font-size:12.5px;}
    .hd{fill:#c7cbdb;font-size:13px;font-weight:600;}
    .ball-txt{font-size:10px;font-weight:700;fill:#0b0d14;text-anchor:middle;font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;}
  </style>

  <path id="tube" fill="none" d="M 235.0 102.0 Q 235.0 132.0 265.0 132.0 L 1015.0 132.0 Q 1045.0 132.0 1045.0 162.0 L 1045.0 222.0 Q 1045.0 252.0 1015.0 252.0 L 265.0 252.0 Q 235.0 252.0 235.0 282.0 L 235.0 370.0 Q 235.0 400.0 265.0 400.0 L 1015.0 400.0 Q 1045.0 400.0 1045.0 430.0 L 1045.0 530.0 Q 1045.0 560.0 1015.0 560.0 L 265.0 560.0 Q 235.0 560.0 235.0 590.0 L 235.0 690.0 Q 235.0 720.0 265.0 720.0 L 1015.0 720.0 Q 1045.0 720.0 1045.0 750.0 L 1045.0 850.0 Q 1045.0 880.0 1015.0 880.0 L 265.0 880.0 Q 235.0 880.0 235.0 910.0 L 235.0 1090.0 Q 235.0 1120.0 265.0 1120.0 L 1015.0 1120.0 Q 1045.0 1120.0 1045.0 1150.0 L 1045.0 1310.0 Q 1045.0 1340.0 1015.0 1340.0 L 90.0 1340.0 Q 60.0 1340.0 60.0 1310.0 L 60.0 90.0 Q 60.0 60.0 90.0 60.0 L 205.0 60.0 Q 235.0 60.0 235.0 90.0 Z"/>
</defs>

<rect x="0" y="0" width="1240" height="1440" fill="#0b0d14"/>

<text x="620" y="34" text-anchor="middle" fill="#e7e9ee" font-size="19" font-weight="600">GPT decoder-only transformer — token pipeline</text>

<rect x="92" y="336" width="1096" height="672" rx="18" fill="#10141f" stroke="#39415a" stroke-width="1.4" stroke-dasharray="7 6"/>
<text x="112" y="360" class="hd">Decoder block</text>
<text x="1168" y="360" text-anchor="end" fill="#8a7fe0" font-size="13" font-weight="600">× 12 stacked layers (GPT-2 small: d_model 768, 12 heads, d_head 64)</text>

<use href="#tube" stroke="#39435e" stroke-width="38" stroke-linejoin="round" stroke-linecap="round"/>
<use href="#tube" stroke="#1b2130" stroke-width="30" stroke-linejoin="round" stroke-linecap="round"/>
<use href="#tube" stroke="#222a3d" stroke-width="30" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 16" opacity="0.9"/>
<use href="#tube" stroke="#4a5470" stroke-width="1" stroke-linejoin="round" opacity="0.5"/>

<path d="M 235 60 L 775 60 L 775 96" fill="none" stroke="#4fc79a" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ah)"/>
<text x="790" y="52" class="lbl" fill="#4fc79a">re-entry point: sequence is now T+1 tokens</text>
<text x="300" y="1374" class="lbl" fill="#e0b04f">autoregressive return line — sampled token is appended and the whole pipeline runs again</text>

<g>
<rect class="bx" x="110" y="100" width="250" height="64" rx="8" stroke="#4fc79a"/>
<text class="tt" x="235" y="126" text-anchor="middle">Input text</text>
<text class="st" x="235" y="145" text-anchor="middle">"The cat sat"</text>

<rect class="bx" x="380" y="100" width="250" height="64" rx="8" stroke="#4fc79a"/>
<text class="tt" x="505" y="126" text-anchor="middle">BPE tokenizer</text>
<text class="st" x="505" y="145" text-anchor="middle">merge rules → subwords</text>

<rect class="bx" x="650" y="100" width="250" height="64" rx="8" stroke="#4fc79a"/>
<text class="tt" x="775" y="126" text-anchor="middle">Token IDs</text>
<text class="st" x="775" y="145" text-anchor="middle">[464, 3797, 3332]</text>

<rect class="bx" x="920" y="100" width="250" height="64" rx="8" stroke="#4fc79a"/>
<text class="tt" x="1045" y="126" text-anchor="middle">Token embedding</text>
<text class="st" x="1045" y="145" text-anchor="middle">W_e [50257, 768]</text>
</g>

<g>
<rect class="bx" x="920" y="220" width="250" height="64" rx="8" stroke="#4fc79a"/>
<text class="tt" x="1045" y="246" text-anchor="middle">⊕ Positional embedding</text>
<text class="st" x="1045" y="265" text-anchor="middle">W_pos [1024, 768]</text>

<rect class="bx" x="650" y="220" width="250" height="64" rx="8" stroke="#4fc79a"/>
<text class="tt" x="775" y="246" text-anchor="middle">Embedding dropout</text>
<text class="st" x="775" y="265" text-anchor="middle">p = 0.1</text>

<rect class="bx" x="380" y="220" width="250" height="64" rx="8" stroke="#4fc79a"/>
<text class="tt" x="505" y="246" text-anchor="middle">Sequence X</text>
<text class="st" x="505" y="265" text-anchor="middle">[T, 768]</text>
</g>

<g>
<rect class="bx" x="110" y="368" width="250" height="64" rx="8" stroke="#5b9bd9"/>
<text class="tt" x="235" y="394" text-anchor="middle">LayerNorm 1</text>
<text class="st" x="235" y="413" text-anchor="middle">pre-norm, γ β [768]</text>

<rect class="bx" x="380" y="368" width="250" height="64" rx="8" stroke="#8a7fe0"/>
<text class="tt" x="505" y="394" text-anchor="middle">Q, K, V projection</text>
<text class="st" x="505" y="413" text-anchor="middle">W_qkv [768, 2304]</text>

<rect class="bx" x="650" y="368" width="250" height="64" rx="8" stroke="#8a7fe0"/>
<text class="tt" x="775" y="394" text-anchor="middle">Split into heads</text>
<text class="st" x="775" y="413" text-anchor="middle">12 heads × d_head 64</text>

<rect class="bx" x="920" y="368" width="250" height="64" rx="8" stroke="#8a7fe0"/>
<text class="tt" x="1045" y="394" text-anchor="middle">Attention scores</text>
<text class="st" x="1045" y="413" text-anchor="middle">QKᵀ / √64 → [12, T, T]</text>
</g>

<g>
<rect class="bx" x="920" y="528" width="250" height="64" rx="8" stroke="#8a7fe0"/>
<text class="tt" x="1045" y="554" text-anchor="middle">Causal mask</text>
<text class="st" x="1045" y="573" text-anchor="middle">−∞ above the diagonal</text>

<rect class="bx" x="650" y="528" width="250" height="64" rx="8" stroke="#8a7fe0"/>
<text class="tt" x="775" y="554" text-anchor="middle">Row-wise softmax</text>
<text class="st" x="775" y="573" text-anchor="middle">attn weights A [12, T, T]</text>

<rect class="bx" x="380" y="528" width="250" height="64" rx="8" stroke="#8a7fe0"/>
<text class="tt" x="505" y="554" text-anchor="middle">Weighted sum A · V</text>
<text class="st" x="505" y="573" text-anchor="middle">→ [12, T, 64]</text>

<rect class="bx" x="110" y="528" width="250" height="64" rx="8" stroke="#8a7fe0"/>
<text class="tt" x="235" y="554" text-anchor="middle">Concat heads</text>
<text class="st" x="235" y="573" text-anchor="middle">→ [T, 768]</text>
</g>

<g>
<rect class="bx" x="110" y="688" width="250" height="64" rx="8" stroke="#8a7fe0"/>
<text class="tt" x="235" y="714" text-anchor="middle">Output projection</text>
<text class="st" x="235" y="733" text-anchor="middle">W_o [768, 768]</text>

<rect class="bx" x="380" y="688" width="250" height="64" rx="8" stroke="#e0b04f"/>
<text class="tt" x="505" y="714" text-anchor="middle">⊕ Residual add</text>
<text class="st" x="505" y="733" text-anchor="middle">x = x + Attn(LN₁(x))</text>

<rect class="bx" x="650" y="688" width="250" height="64" rx="8" stroke="#5b9bd9"/>
<text class="tt" x="775" y="714" text-anchor="middle">LayerNorm 2</text>
<text class="st" x="775" y="733" text-anchor="middle">γ β [768]</text>

<rect class="bx" x="920" y="688" width="250" height="64" rx="8" stroke="#e0805a"/>
<text class="tt" x="1045" y="714" text-anchor="middle">FFN up-projection</text>
<text class="st" x="1045" y="733" text-anchor="middle">W₁ [768, 3072]</text>
</g>

<g>
<rect class="bx" x="920" y="848" width="250" height="64" rx="8" stroke="#e0805a"/>
<text class="tt" x="1045" y="874" text-anchor="middle">GELU activation</text>
<text class="st" x="1045" y="893" text-anchor="middle">non-linearity, 4× width</text>

<rect class="bx" x="650" y="848" width="250" height="64" rx="8" stroke="#e0805a"/>
<text class="tt" x="775" y="874" text-anchor="middle">FFN down-projection</text>
<text class="st" x="775" y="893" text-anchor="middle">W₂ [3072, 768]</text>

<rect class="bx" x="380" y="848" width="250" height="64" rx="8" stroke="#e0b04f"/>
<text class="tt" x="505" y="874" text-anchor="middle">⊕ Residual add</text>
<text class="st" x="505" y="893" text-anchor="middle">x = x + FFN(LN₂(x))</text>

<rect class="bx" x="110" y="848" width="250" height="64" rx="8" stroke="#8a7fe0"/>
<text class="tt" x="235" y="874" text-anchor="middle">Block output</text>
<text class="st" x="235" y="893" text-anchor="middle">[T, 768] → next layer</text>
</g>

<path d="M 300 952 L 980 952" fill="none" stroke="#8a7fe0" stroke-width="1.6" stroke-dasharray="5 6" marker-end="url(#ah)"/>
<text x="640" y="944" text-anchor="middle" class="lbl" fill="#8a7fe0">↻ output feeds the next identical block — 12 times before exiting</text>

<g>
<rect class="bx" x="110" y="1088" width="250" height="64" rx="8" stroke="#5b9bd9"/>
<text class="tt" x="235" y="1114" text-anchor="middle">Final LayerNorm</text>
<text class="st" x="235" y="1133" text-anchor="middle">γ β [768]</text>

<rect class="bx" x="380" y="1088" width="250" height="64" rx="8" stroke="#e0b04f"/>
<text class="tt" x="505" y="1114" text-anchor="middle">LM head (tied W_eᵀ)</text>
<text class="st" x="505" y="1133" text-anchor="middle">[768, 50257] → logits</text>

<rect class="bx" x="650" y="1088" width="250" height="64" rx="8" stroke="#e0b04f"/>
<text class="tt" x="775" y="1114" text-anchor="middle">Softmax over vocab</text>
<text class="st" x="775" y="1133" text-anchor="middle">p(next | context), last row</text>

<rect class="bx" x="920" y="1088" width="250" height="64" rx="8" stroke="#e0b04f"/>
<text class="tt" x="1045" y="1114" text-anchor="middle">Sampling</text>
<text class="st" x="1045" y="1133" text-anchor="middle">temperature / top-k / top-p</text>
</g>

<rect class="bx" x="920" y="1228" width="250" height="64" rx="8" stroke="#4fc79a"/>
<text class="tt" x="1045" y="1254" text-anchor="middle">Next token</text>
<text class="st" x="1045" y="1273" text-anchor="middle">"on" → append, repeat</text>

<!-- sample balls removed: the game draws its own token balls on #tube -->

<g>
<circle cx="130" cy="1406" r="6" fill="#4fc79a"/><text x="144" y="1411" class="lbl">tokenize / embed</text>
<circle cx="310" cy="1406" r="6" fill="#5b9bd9"/><text x="324" y="1411" class="lbl">normalization</text>
<circle cx="470" cy="1406" r="6" fill="#8a7fe0"/><text x="484" y="1411" class="lbl">masked self-attention</text>
<circle cx="672" cy="1406" r="6" fill="#e0805a"/><text x="686" y="1411" class="lbl">feed-forward network</text>
<circle cx="862" cy="1406" r="6" fill="#e0b04f"/><text x="876" y="1411" class="lbl">residual / output head</text>
</g>

</svg>
