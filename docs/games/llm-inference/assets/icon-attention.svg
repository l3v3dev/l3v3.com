
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square badge -->
  <rect x="4" y="4" width="120" height="120" rx="18" fill="#0a1628"/>
  <rect x="4" y="4" width="120" height="120" rx="18" fill="none" stroke="#1c3a5e" stroke-width="2"/>

  <!-- Dim cyan arcs -->
  <g fill="none" stroke="#2f6f80" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <path d="M 52 56 Q 34 44 30 28"/>
    <path d="M 52 72 Q 34 84 30 100"/>
    <path d="M 76 72 Q 94 84 98 100"/>
  </g>

  <!-- Bright gold arc -->
  <path d="M 76 56 Q 94 44 98 28" fill="none" stroke="#ffd24d" stroke-width="3" stroke-linecap="round" filter="url(#softglow)"/>

  <!-- Small word chips -->
  <g>
    <rect x="18" y="18" width="24" height="14" rx="4" fill="#122a44" stroke="#3a8a9a" stroke-width="1.5"/>
    <rect x="22" y="23" width="14" height="3" rx="1.5" fill="#3a8a9a"/>

    <rect x="86" y="18" width="24" height="14" rx="4" fill="#122a44" stroke="#ffd24d" stroke-width="1.5"/>
    <rect x="90" y="23" width="14" height="3" rx="1.5" fill="#ffd24d"/>

    <rect x="18" y="96" width="24" height="14" rx="4" fill="#122a44" stroke="#3a8a9a" stroke-width="1.5"/>
    <rect x="22" y="101" width="14" height="3" rx="1.5" fill="#3a8a9a"/>

    <rect x="86" y="96" width="24" height="14" rx="4" fill="#122a44" stroke="#3a8a9a" stroke-width="1.5"/>
    <rect x="90" y="101" width="14" height="3" rx="1.5" fill="#3a8a9a"/>
  </g>

  <!-- Central glowing word chip -->
  <g filter="url(#glow)">
    <rect x="42" y="50" width="44" height="28" rx="8" fill="#14324f" stroke="#4dd0e1" stroke-width="2.5"/>
    <rect x="48" y="57" width="26" height="4" rx="2" fill="#4dd0e1"/>
    <rect x="48" y="65" width="18" height="4" rx="2" fill="#4dd0e1" opacity="0.7"/>
  </g>
</svg>
