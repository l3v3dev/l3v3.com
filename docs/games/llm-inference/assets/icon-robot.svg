<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Badge background -->
  <rect x="4" y="4" width="120" height="120" rx="20" fill="#0A1428" stroke="#00E5FF" stroke-width="2"/>
  <rect x="9" y="9" width="110" height="110" rx="16" fill="none" stroke="#00E5FF" stroke-opacity="0.25" stroke-width="1"/>

  <!-- ===== Robot ===== -->
  <!-- Antenna -->
  <line x1="38" y1="42" x2="38" y2="30" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="38" cy="27" r="4" fill="#39FF14"/>
  <circle cx="38" cy="27" r="7" fill="none" stroke="#39FF14" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Head -->
  <rect x="22" y="42" width="32" height="24" rx="7" fill="#1B2A4A" stroke="#00E5FF" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="31" cy="54" r="3.5" fill="#00E5FF"/>
  <circle cx="45" cy="54" r="3.5" fill="#00E5FF"/>
  <!-- Smile -->
  <path d="M 33 60 Q 38 63 43 60" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Body -->
  <rect x="24" y="68" width="28" height="26" rx="7" fill="#1B2A4A" stroke="#00E5FF" stroke-width="2"/>
  <!-- Chest light -->
  <circle cx="38" cy="81" r="4" fill="#39FF14"/>
  <circle cx="38" cy="81" r="6.5" fill="none" stroke="#39FF14" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Arms -->
  <line x1="24" y1="74" x2="17" y2="82" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="74" x2="59" y2="82" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="16" cy="84" r="2.5" fill="#39FF14"/>
  <circle cx="60" cy="84" r="2.5" fill="#39FF14"/>

  <!-- Legs -->
  <rect x="28" y="94" width="7" height="9" rx="3" fill="#1B2A4A" stroke="#00E5FF" stroke-width="1.5"/>
  <rect x="41" y="94" width="7" height="9" rx="3" fill="#1B2A4A" stroke="#00E5FF" stroke-width="1.5"/>

  <!-- ===== Floating code window ===== -->
  <!-- Shadow / float offset -->
  <rect x="64" y="38" width="56" height="58" rx="7" fill="#000000" fill-opacity="0.35"/>
  <!-- Window -->
  <rect x="62" y="34" width="56" height="58" rx="7" fill="#0E1B33" stroke="#00E5FF" stroke-width="2"/>
  <!-- Title bar -->
  <line x1="62" y1="45" x2="118" y2="45" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="69" cy="39.5" r="2" fill="#FF5C7A"/>
  <circle cx="76" cy="39.5" r="2" fill="#FFD166"/>
  <circle cx="83" cy="39.5" r="2" fill="#39FF14"/>

  <!-- Code text -->
  <text x="67" y="58" font-family="monospace" font-size="8" fill="#39FF14">fn run() {</text>
  <text x="72" y="68" font-family="monospace" font-size="8" fill="#00E5FF">  init();</text>
  <text x="67" y="78" font-family="monospace" font-size="8" fill="#39FF14">}</text>
  <!-- Cursor blink -->
  <rect x="78" y="71" width="2" height="7" fill="#00E5FF"/>

  <!-- Floating sparkles -->
  <circle cx="112" cy="26" r="1.5" fill="#00E5FF"/>
  <circle cx="18" cy="104" r="1.5" fill="#39FF14"/>
  <circle cx="108" cy="100" r="1.5" fill="#00E5FF"/>
</svg>