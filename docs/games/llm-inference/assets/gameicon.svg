
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Star radial gradient: bright yellow-white core to warm amber edges -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffde8" stop-opacity="1"/>
      <stop offset="25%" stop-color="#ffe680" stop-opacity="1"/>
      <stop offset="55%" stop-color="#f5a623" stop-opacity="1"/>
      <stop offset="80%" stop-color="#e88a1a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d4740e" stop-opacity="0.7"/>
    </radialGradient>
    <!-- Outer halo gradient -->
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe680" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f5a623" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
    <!-- Cyan dot glow -->
    <radialGradient id="cyanDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#80f0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00c8d4" stop-opacity="0"/>
    </radialGradient>
    <!-- Coral-pink orb glow -->
    <radialGradient id="coralOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb0a0" stop-opacity="1"/>
      <stop offset="50%" stop-color="#ff7e6b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff5e4a" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft glow filter for star -->
    <filter id="starSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Glow filter for cyan elements -->
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Glow for coral orbs -->
    <filter id="coralGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded-corner square background -->
  <rect x="0" y="0" width="512" height="512" rx="48" ry="48" fill="#0b1220"/>

  <!-- Cyan circuit-style maze path (behind star, low opacity) -->
  <g opacity="0.18" filter="url(#cyanGlow)">
    <!-- Main winding corridor -->
    <path d="M 80 120 L 80 200 Q 80 220 100 220 L 180 220 Q 200 220 200 240 L 200 320 Q 200 340 220 340 L 320 340 Q 340 340 340 320 L 340 260 Q 340 240 360 240 L 420 240 Q 440 240 440 220 L 440 140"
          fill="none" stroke="#40e0e8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Secondary branch -->
    <path d="M 120 380 L 120 340 Q 120 320 140 320 L 200 320"
          fill="none" stroke="#40e0e8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Another branch -->
    <path d="M 380 100 L 380 160 Q 380 180 360 180 L 340 180"
          fill="none" stroke="#40e0e8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom branch -->
    <path d="M 280 400 L 280 360 Q 280 340 260 340 L 220 340"
          fill="none" stroke="#40e0e8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Rounded-rectangle room nodes -->
    <rect x="68" y="108" width="24" height="24" rx="6" ry="6" fill="none" stroke="#40e0e8" stroke-width="3"/>
    <rect x="428" y="128" width="24" height="24" rx="6" ry="6" fill="none" stroke="#40e0e8" stroke-width="3"/>
    <rect x="108" y="368" width="24" height="24" rx="6" ry="6" fill="none" stroke="#40e0e8" stroke-width="3"/>
    <rect x="368" y="88" width="24" height="24" rx="6" ry="6" fill="none" stroke="#40e0e8" stroke-width="3"/>
    <rect x="268" y="388" width="24" height="24" rx="6" ry="6" fill="none" stroke="#40e0e8" stroke-width="3"/>

    <!-- Small glowing cyan dots at junctions -->
    <circle cx="80" cy="200" r="5" fill="url(#cyanDot)"/>
    <circle cx="200" cy="240" r="5" fill="url(#cyanDot)"/>
    <circle cx="340" cy="320" r="5" fill="url(#cyanDot)"/>
    <circle cx="340" cy="260" r="5" fill="url(#cyanDot)"/>
    <circle cx="440" cy="220" r="5" fill="url(#cyanDot)"/>
    <circle cx="120" cy="340" r="4" fill="url(#cyanDot)"/>
    <circle cx="380" cy="160" r="4" fill="url(#cyanDot)"/>
    <circle cx="280" cy="360" r="4" fill="url(#cyanDot)"/>
  </g>

  <!-- Outer pale gold halo behind star -->
  <circle cx="256" cy="256" r="150" fill="url(#haloGrad)"/>

  <!-- Five-pointed star (token orb) with soft glow -->
  <g filter="url(#starSoft)">
    <path d="M 256 156 L 280.7 222 L 351.1 225.1 L 295.9 269 L 314.8 336.9 L 256 298 L 197.2 336.9 L 216.1 269 L 160.9 225.1 L 231.3 222 Z"
          fill="url(#starGlow)" stroke="#ffe680" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- White vector arrow pointing up-right from star center -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
    <line x1="256" y1="256" x2="302" y2="210"/>
    <!-- Arrowhead -->
    <polyline points="292,210 302,210 302,220" fill="none"/>
  </g>

  <!-- Tiny coral-pink glowing orbs (context tokens) -->
  <g filter="url(#coralGlow)">
    <circle cx="170" cy="170" r="8" fill="url(#coralOrb)"/>
    <circle cx="350" cy="160" r="6" fill="url(#coralOrb)"/>
    <circle cx="370" cy="340" r="7" fill="url(#coralOrb)"/>
    <circle cx="150" cy="350" r="5" fill="url(#coralOrb)"/>
    <circle cx="320" cy="130" r="4" fill="url(#coralOrb)"/>
  </g>
</svg>
