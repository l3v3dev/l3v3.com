
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FFA500" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#FF8C00" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF8C00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starCore" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFFDE0"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </radialGradient>
    <linearGradient id="neonPath" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00BCD4"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowGold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="iconClip">
      <rect x="0" y="0" width="512" height="512" rx="48" ry="48"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <g clip-path="url(#iconClip)">
    <rect width="512" height="512" fill="#0A0E2A"/>
    <rect width="512" height="512" fill="#0D1235" rx="48" ry="48"/>

    <!-- Faint grid -->
    <g stroke="#1A2050" stroke-width="0.5" opacity="0.5">
      <line x1="64" y1="0" x2="64" y2="512"/>
      <line x1="128" y1="0" x2="128" y2="512"/>
      <line x1="192" y1="0" x2="192" y2="512"/>
      <line x1="256" y1="0" x2="256" y2="512"/>
      <line x1="320" y1="0" x2="320" y2="512"/>
      <line x1="384" y1="0" x2="384" y2="512"/>
      <line x1="448" y1="0" x2="448" y2="512"/>
      <line x1="0" y1="64" x2="512" y2="64"/>
      <line x1="0" y1="128" x2="512" y2="128"/>
      <line x1="0" y1="192" x2="512" y2="192"/>
      <line x1="0" y1="256" x2="512" y2="256"/>
      <line x1="0" y1="320" x2="512" y2="320"/>
      <line x1="0" y1="384" x2="512" y2="384"/>
      <line x1="0" y1="448" x2="512" y2="448"/>
    </g>

    <!-- Neon corridor path - S-shape -->
    <!-- Outer glow -->
    <path d="M 80 430 C 80 380, 160 370, 256 370 C 350 370, 350 256, 350 170 C 350 110, 430 110, 430 80"
          fill="none" stroke="#00E5FF" stroke-width="18" stroke-linecap="round" opacity="0.15"/>
    <!-- Mid glow -->
    <path d="M 80 430 C 80 380, 160 370, 256 370 C 350 370, 350 256, 350 170 C 350 110, 430 110, 430 80"
          fill="none" stroke="#00E5FF" stroke-width="10" stroke-linecap="round" opacity="0.3" filter="url(#glowCyan)"/>
    <!-- Main neon line -->
    <path d="M 80 430 C 80 380, 160 370, 256 370 C 350 370, 350 256, 350 170 C 350 110, 430 110, 430 80"
          fill="none" stroke="url(#neonPath)" stroke-width="5" stroke-linecap="round" filter="url(#glowCyan)"/>
    <!-- Inner bright core -->
    <path d="M 80 430 C 80 380, 160 370, 256 370 C 350 370, 350 256, 350 170 C 350 110, 430 110, 430 80"
          fill="none" stroke="#E0FFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Circuit-board nodes along path -->
    <g fill="#00E5FF" stroke="#003D4D" stroke-width="1.5">
      <circle cx="80" cy="430" r="8"/>
      <circle cx="168" cy="370" r="6"/>
      <circle cx="256" cy="370" r="6"/>
      <circle cx="340" cy="310" r="6"/>
      <circle cx="350" cy="256" r="6"/>
      <circle cx="350" cy="170" r="6"/>
      <circle cx="395" cy="110" r="6"/>
      <circle cx="430" cy="80" r="8"/>
    </g>
    <!-- Node inner dots -->
    <g fill="#E0FFFF">
      <circle cx="80" cy="430" r="3"/>
      <circle cx="168" cy="370" r="2.5"/>
      <circle cx="256" cy="370" r="2.5"/>
      <circle cx="340" cy="310" r="2.5"/>
      <circle cx="350" cy="256" r="2.5"/>
      <circle cx="350" cy="170" r="2.5"/>
      <circle cx="395" cy="110" r="2.5"/>
      <circle cx="430" cy="80" r="3"/>
    </g>

    <!-- Attention-connection arcs between nodes -->
    <g fill="none" stroke="#00E5FF" stroke-width="1.2" opacity="0.5" stroke-dasharray="4 3">
      <path d="M 168 370 Q 210 330 256 370"/>
      <path d="M 256 370 Q 300 340 340 310"/>
      <path d="M 340 310 Q 380 280 350 256"/>
      <path d="M 350 256 Q 390 210 350 170"/>
      <path d="M 350 170 Q 380 140 395 110"/>
      <path d="M 395 110 Q 420 95 430 80"/>
    </g>

    <!-- START arch gate (bottom-left) -->
    <g>
      <path d="M 55 455 L 55 415 Q 55 395 80 395 Q 105 395 105 415 L 105 455"
            fill="none" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" filter="url(#glowCyan)"/>
      <path d="M 55 455 L 55 415 Q 55 395 80 395 Q 105 395 105 415 L 105 455"
            fill="none" stroke="#E0FFFF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="80" y="475" font-family="Arial, sans-serif" font-size="11" font-weight="bold"
            fill="#00E5FF" text-anchor="middle" letter-spacing="1">START</text>
    </g>

    <!-- FINISH arch gate (top-right) -->
    <g>
      <path d="M 405 55 L 405 95 Q 405 115 430 115 Q 455 115 455 95 L 455 55"
            fill="none" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" filter="url(#glowCyan)"/>
      <path d="M 405 55 L 405 95 Q 405 115 430 115 Q 455 115 455 95 L 455 55"
            fill="none" stroke="#E0FFFF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="430" y="45" font-family="Arial, sans-serif" font-size="11" font-weight="bold"
            fill="#00E5FF" text-anchor="middle" letter-spacing="1">FINISH</text>
    </g>

    <!-- Star token glow halo -->
    <circle cx="256" cy="256" r="70" fill="url(#starGlow)"/>

    <!-- Star token -->
    <g filter="url(#glowGold)">
      <polygon points="256,216 265.4,243.06 294.04,243.64 271.22,260.94 279.51,288.36 256,272 232.49,288.36 240.78,260.94 217.96,243.64 246.6,243.06"
               fill="url(#starCore)" stroke="#FFD700" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <!-- Star inner highlight -->
    <circle cx="256" cy="250" r="8" fill="#FFFDE0" opacity="0.7"/>

    <!-- Small decorative circuit traces -->
    <g stroke="#1A3A5C" stroke-width="1" opacity="0.6">
      <line x1="120" y1="120" x2="180" y2="120"/>
      <line x1="180" y1="120" x2="180" y2="160"/>
      <circle cx="120" cy="120" r="3" fill="#1A3A5C" stroke="none"/>
      <circle cx="180" cy="160" r="3" fill="#1A3A5C" stroke="none"/>
      <line x1="380" y1="380" x2="420" y2="380"/>
      <line x1="420" y1="380" x2="420" y2="340"/>
      <circle cx="380" cy="380" r="3" fill="#1A3A5C" stroke="none"/>
      <circle cx="420" cy="340" r="3" fill="#1A3A5C" stroke="none"/>
      <line x1="100" y1="200" x2="140" y2="200"/>
      <line x1="140" y1="200" x2="140" y2="240"/>
      <circle cx="100" cy="200" r="3" fill="#1A3A5C" stroke="none"/>
      <circle cx="140" cy="240" r="3" fill="#1A3A5C" stroke="none"/>
    </g>

    <!-- Subtle vignette -->
    <rect width="512" height="512" rx="48" ry="48" fill="none" stroke="#0A0E2A" stroke-width="20" opacity="0.4"/>
  </g>

  <!-- Rounded border -->
  <rect x="1" y="1" width="510" height="510" rx="47" ry="47" fill="none" stroke="#1A2050" stroke-width="2"/>
</svg>
