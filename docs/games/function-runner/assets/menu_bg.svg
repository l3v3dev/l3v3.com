<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0ede8"/>
      <stop offset="55%" stop-color="#e7e2da"/>
      <stop offset="100%" stop-color="#d9d3c9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <!-- faint drifting sine curves, muted warm grey -->
  <g fill="none" stroke="#c3bcb1" stroke-width="1.5" opacity="0.5">
    <path d="M0 210 C 100 190, 200 230, 300 210 S 500 190, 600 210 S 760 230, 800 210"/>
    <path d="M0 250 C 120 270, 240 230, 360 250 S 560 270, 680 250 S 780 230, 800 250"/>
    <path d="M0 300 C 90 285, 180 315, 270 300 S 450 285, 540 300 S 720 315, 800 300"/>
  </g>
  <!-- faint axis hint -->
  <g stroke="#c9c2b7" stroke-width="1" opacity="0.35">
    <line x1="0" y1="330" x2="800" y2="330"/>
    <line x1="400" y1="150" x2="400" y2="470"/>
  </g>
  <!-- faint Euler identity, centered -->
  <text x="400" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#8f887c" opacity="0.16" text-anchor="middle" dominant-baseline="central">e<tspan font-size="34" dy="-20">i&#960;</tspan><tspan dy="20"> + 1 = 0</tspan></text>
</svg>
