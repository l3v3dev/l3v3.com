<svg xmlns="http://www.w3.org/2000/svg" width="420" height="110" viewBox="0 0 420 110">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f6f2"/>
      <stop offset="100%" stop-color="#ebe6de"/>
    </linearGradient>
    <linearGradient id="topSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- soft drop shadow -->
  <rect x="4" y="8" width="412" height="98" rx="18" fill="#b9b2a6" opacity="0.25"/>
  <!-- card body -->
  <rect x="2" y="2" width="416" height="104" rx="18" fill="url(#cardGrad)" stroke="#cfc8bd" stroke-width="2"/>
  <!-- top sheen -->
  <rect x="6" y="6" width="408" height="40" rx="14" fill="url(#topSheen)"/>
