<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <rect width="320" height="180" fill="none"/>
  <defs>
    <style>
      .o{stroke:#242424;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .t{stroke:#242424;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <!-- OFFROAD MOUNTAIN BOARD / SIDE PROFILE -->

  <!-- SPEED LINES / DIRT PARTICLES -->
  <path d="M 15 150 L 45 150 M 25 160 L 65 160 M 285 150 L 305 150 M 295 160 L 315 160" class="o" stroke="#bcbcbc"/>
  <circle cx="20" cy="140" r="3" fill="#e43f25"/>
  <circle cx="35" cy="135" r="2" fill="#f5c62e"/>
  <circle cx="295" cy="142" r="3" fill="#252525"/>

  <!-- TRUCKS & SUSPENSION (Background arms) -->
  <path d="M 95 120 L 73 132 L 65 125 Z" fill="#bcbcbc" class="o"/>
  <path d="M 225 120 L 248 132 L 255 125 Z" fill="#bcbcbc" class="o"/>
  
  <!-- Suspension Springs -->
  <path d="M 85 115 L 75 128" stroke="#f5c62e" stroke-width="4" stroke-linecap="round"/>
  <path d="M 235 115 L 245 128" stroke="#f5c62e" stroke-width="4" stroke-linecap="round"/>

  <!-- HEAVY DUTY DECK -->
  <path d="M 25 85
           C 50 100 80 110 110 110
           L 210 110
           C 240 110 270 100 295 85
           A 8 8 0 0 1 303 97
           C 275 115 240 125 210 125
           L 110 125
           C 80 125 45 115 17 97
           A 8 8 0 0 1 25 85 Z"
        fill="#e43f25" class="o"/>

  <!-- WOOD PLY & RACING GRAPHICS (Side of deck) -->
  <path d="M 26 89 C 50 104 80 114 110 114 L 210 114 C 240 114 270 104 294 89" fill="none" class="t" stroke="#f5c62e"/>
  
  <polygon points="140,110 160,110 150,125 130,125" fill="#f5c62e" class="t"/>
  <polygon points="165,110 185,110 175,125 155,125" fill="#eeeeee" class="t"/>
  <text x="195" y="122" font-family="Arial,sans-serif" font-size="12" font-weight="900" fill="#252525">07</text>

  <!-- GRIP TAPE (Top surface thick outline) -->
  <path d="M 25 85 C 50 100 80 110 110 110 L 210 110 C 240 110 270 100 295 85" fill="none" stroke="#252525" stroke-width="6" class="o"/>

  <!-- TOP DECK HARDWARE (Bolts) -->
  <circle cx="85" cy="106" r="2" fill="#bcbcbc"/>
  <circle cx="95" cy="108" r="2" fill="#bcbcbc"/>
  <circle cx="225" cy="108" r="2" fill="#bcbcbc"/>
  <circle cx="235" cy="106" r="2" fill="#bcbcbc"/>

  <!-- OFFROAD FOOT BINDINGS (Mountain Board Straps) -->
  <!-- Rear Binding -->
  <path d="M 75 106 C 80 75 110 75 115 110" fill="none" stroke="#252525" stroke-width="10" stroke-linecap="round"/>
  <path d="M 75 106 C 80 75 110 75 115 110" fill="none" stroke="#d93622" stroke-width="4" stroke-linecap="round"/>
  <!-- Front Binding -->
  <path d="M 205 110 C 210 75 240 75 245 106" fill="none" stroke="#252525" stroke-width="10" stroke-linecap="round"/>
  <path d="M 205 110 C 210 75 240 75 245 106" fill="none" stroke="#d93622" stroke-width="4" stroke-linecap="round"/>

  <!-- UNDERSLUNG BATTERY BOX (E-Skate Module) -->
  <path d="M 125 125 L 195 125 L 190 140 L 130 140 Z" fill="#252525" class="o"/>
  <line x1="145" y1="125" x2="145" y2="140" class="t" stroke="#444"/>
  <line x1="160" y1="125" x2="160" y2="140" class="t" stroke="#444"/>
  <line x1="175" y1="125" x2="175" y2="140" class="t" stroke="#444"/>
  <!-- Power Cable -->
  <path d="M 195 130 Q 215 130 220 122" fill="none" class="t" stroke="#f5c62e"/>

  <!-- CHUNKY RALLY TIRES (Exact Match to Car/Truck) -->
  <g fill="#252525" class="o">
    <circle cx="73" cy="132" r="31"/>
    <circle cx="248" cy="132" r="31"/>
  </g>

  <!-- Tire Tread (Reused exactly for cohesive styling) -->
  <g fill="#3a3a3a" class="t">
    <path d="M51 107l-10-4 2-8 11 2"/>
    <path d="M62 102l-5-10 7-5 8 9"/>
    <path d="M76 101l1-11 8 1 3 11"/>
    <path d="M90 105l8-8 7 6-6 9"/>
    <path d="M101 116l10-1 2 8-10 4"/>
    <path d="M103 132l10 4-2 8-11-1"/>
    <path d="M96 147l7 8-6 6-9-7"/>
    <path d="M82 157l-1 11-8-1-3-11"/>
    <path d="M66 157l-8 8-7-5 5-10"/>
    <path d="M53 148l-10 3-3-8 10-5"/>
    <path d="M46 133l-11-2v-8l11-1"/>

    <path d="M226 107l-10-4 2-8 11 2"/>
    <path d="M237 102l-5-10 7-5 8 9"/>
    <path d="M251 101l1-11 8 1 3 11"/>
    <path d="M265 105l8-8 7 6-6 9"/>
    <path d="M276 116l10-1 2 8-10 4"/>
    <path d="M278 132l10 4-2 8-11-1"/>
    <path d="M271 147l7 8-6 6-9-7"/>
    <path d="M256 157l-1 11-8-1-3-11"/>
    <path d="M241 157l-8 8-7-5 5-10"/>
    <path d="M228 148l-10 3-3-8 10-5"/>
    <path d="M221 133l-11-2v-8l11-1"/>
  </g>

  <!-- Skateboard Wheel Hubs -->
  <g class="o">
    <!-- Rear Hub -->
    <circle cx="73" cy="132" r="18" fill="#e43f25"/>
    <circle cx="73" cy="132" r="10" fill="#252525"/>
    <!-- Rear Spokes -->
    <path d="M 73 114 L 73 150 M 55 132 L 91 132 M 60 119 L 86 145 M 86 119 L 60 145" stroke="#f5c62e" stroke-width="4" stroke-linecap="round"/>
    <circle cx="73" cy="132" r="5" fill="#bcbcbc" stroke="#242424" stroke-width="2"/>
    
    <!-- Front Hub -->
    <circle cx="248" cy="132" r="18" fill="#e43f25"/>
    <circle cx="248" cy="132" r="10" fill="#252525"/>
    <!-- Front Spokes -->
    <path d="M 248 114 L 248 150 M 230 132 L 266 132 M 235 119 L 261 145 M 261 119 L 235 145" stroke="#f5c62e" stroke-width="4" stroke-linecap="round"/>
    <circle cx="248" cy="132" r="5" fill="#bcbcbc" stroke="#242424" stroke-width="2"/>
  </g>

</svg>
