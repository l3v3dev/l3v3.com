
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <g fill="none" stroke="#3f3a34" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ramp wedge behind truck front -->
    <polygon points="8,102 32,102 32,74"/>
    <!-- Dashed curved arrow arcing over the gap -->
    <!-- <path d="M 24 68 Q 38 46 52 68" stroke-dasharray="7 5"/> -->
    <!-- Arrowhead at end of arc -->
    <polyline points="46,62 52,68 46,74"/>
    <!-- Truck lower body (boxy chassis) -->
    <rect x="44" y="62" width="56" height="20"/>
    <!-- Truck cab -->
    <rect x="74" y="38" width="26" height="24"/>
    <!-- Cab window -->
    <rect x="80" y="44" width="14" height="12"/>
    <!-- Rear wheel -->
    <circle cx="58" cy="92" r="13"/>
    <!-- Front wheel -->
    <circle cx="90" cy="92" r="13"/>
  </g>
</svg>
