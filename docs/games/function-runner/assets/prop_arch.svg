
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="250" viewBox="0 0 180 250">
  <defs>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left post -->
  <rect x="14" y="52" width="24" height="198" rx="3" fill="#2d3748" stroke="#1a202c" stroke-width="3.5"/>
  <!-- Right post -->
  <rect x="142" y="52" width="24" height="198" rx="3" fill="#2d3748" stroke="#1a202c" stroke-width="3.5"/>

  <!-- Arch band -->
  <path d="M 14 52 Q 90 -8 166 52 L 142 52 Q 90 28 38 52 Z"
        fill="#2d3748" stroke="#1a202c" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Checkered strip on arch (alternating red/white squares) -->
  <rect x="22" y="44" width="10" height="10" rx="1" fill="#e53e3e" stroke="#1a202c" stroke-width="1.5"/>
  <rect x="35" y="37" width="10" height="10" rx="1" fill="#ffffff" stroke="#1a202c" stroke-width="1.5"/>
  <rect x="48" y="32" width="10" height="10" rx="1" fill="#e53e3e" stroke="#1a202c" stroke-width="1.5"/>
  <rect x="61" y="29" width="10" height="10" rx="1" fill="#ffffff" stroke="#1a202c" stroke-width="1.5"/>
  <rect x="74" y="27" width="10" height="10" rx="1" fill="#e53e3e" stroke="#1a202c" stroke-width="1.5"/>
  <rect x="87" y="27" width="10" height="10" rx="1" fill="#ffffff" stroke="#1a202c" stroke-width="1.5"/>
  <rect x="100" y="27" width="10" height="10" rx="1" fill="#e53e3e" stroke="#1a202c" stroke-width="1.5"/>
  <rect x="113" y="29" width="10" height="10" rx="1" fill="#ffffff" stroke="#1a202c" stroke-width="1.5"/>
  <rect x="126" y="32" width="10" height="10" rx="1" fill="#e53e3e" stroke="#1a202c" stroke-width="1.5"/>
  <rect x="139" y="37" width="10" height="10" rx="1" fill="#ffffff" stroke="#1a202c" stroke-width="1.5"/>
  <rect x="152" y="44" width="10" height="10" rx="1" fill="#e53e3e" stroke="#1a202c" stroke-width="1.5"/>

  <!-- Cyan fly-through ring (glowing) -->
  <circle cx="90" cy="148" r="34" fill="none" stroke="#4fd1c5" stroke-width="7" opacity="0.35" filter="url(#cyanGlow)"/>
  <circle cx="90" cy="148" r="34" fill="none" stroke="#4fd1c5" stroke-width="4" filter="url(#cyanGlow)"/>
  <circle cx="90" cy="148" r="34" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>

  <!-- Post base caps -->
  <rect x="10" y="242" width="32" height="8" rx="2" fill="#1a202c"/>
  <rect x="138" y="242" width="32" height="8" rx="2" fill="#1a202c"/>
</svg>
