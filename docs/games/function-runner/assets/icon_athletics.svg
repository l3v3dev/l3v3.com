<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <!-- Background circle -->
  <circle cx="36" cy="36" r="33" fill="#f3efe8" stroke="#b8b0a2" stroke-width="1.5"/>

  <!-- Motion lines -->
  <line x1="12" y1="26" x2="20" y2="26" stroke="#c9c2b4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="32" x2="18" y2="32" stroke="#c9c2b4" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Hurdle -->
  <!-- Hurdle base legs -->
  <line x1="33" y1="62" x2="33" y2="52" stroke="#b8b0a2" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="43" y1="62" x2="43" y2="52" stroke="#b8b0a2" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Hurdle top bar -->
  <line x1="30" y1="52" x2="46" y2="52" stroke="#d9a441" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Hurdling athlete - leaping to the right -->
  <!-- Body (tilted back slightly in flight) -->
  <line x1="37" y1="21" x2="34" y2="33" stroke="#8a8172" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Lead arm (reaching forward over front leg) -->
  <line x1="36" y1="25" x2="48" y2="23" stroke="#8a8172" stroke-width="2" stroke-linecap="round"/>

  <!-- Trail arm (swung back for balance) -->
  <line x1="36" y1="25" x2="26" y2="29" stroke="#8a8172" stroke-width="2" stroke-linecap="round"/>

  <!-- Lead leg (extended straight forward over hurdle) -->
  <line x1="34" y1="33" x2="52" y2="32" stroke="#8a8172" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Trail leg (bent at knee behind) -->
  <path d="M 34 33 L 26 38 L 32 43" fill="none" stroke="#8a8172" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Head (amber accent dot) -->
  <circle cx="39" cy="16" r="3" fill="#d9a441"/>
</svg>
