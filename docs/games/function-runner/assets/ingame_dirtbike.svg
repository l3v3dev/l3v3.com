    <circle cx="208" cy="113" r="19" fill="#d5d5d5"/>
    <circle cx="48" cy="113" r="5" fill="#555"/>
    <circle cx="208" cy="113" r="5" fill="#555"/>
    <path d="M48 94v38M29 113h38M35 100l26 26M61 100l-26 26"/>
    <path d="M208 94v38M189 113h38M195 100l26 26M221 100l-26 26"/>
