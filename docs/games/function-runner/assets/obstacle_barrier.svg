
<svg xmlns="http://www.w3.org/2000/svg" width="104" height="88" viewBox="0 0 104 88">
  <defs>
    <clipPath id="beamClip">
      <rect x="8" y="20" width="88" height="22" rx="2"/>
    </clipPath>
  </defs>
  <!-- Left post -->
  <rect x="8" y="18" width="12" height="70" rx="2" fill="#2d3748" stroke="#1a202c" stroke-width="2"/>
  <!-- Right post -->
  <rect x="84" y="18" width="12" height="70" rx="2" fill="#2d3748" stroke="#1a202c" stroke-width="2"/>
  <!-- Beam base red -->
  <rect x="8" y="20" width="88" height="22" rx="2" fill="#e53e36" stroke="#1a202c" stroke-width="2"/>
  <!-- White diagonal hazard stripes -->
  <g clip-path="url(#beamClip)">
    <polygon points="10,42 32,20 42,20 20,42" fill="#ffffff"/>
    <polygon points="34,42 56,20 66,20 44,42" fill="#ffffff"/>
    <polygon points="58,42 80,20 90,20 68,42" fill="#ffffff"/>
    <polygon points="82,42 104,20 114,20 92,42" fill="#ffffff"/>
  </g>
  <!-- Beam outline overlay -->
  <rect x="8" y="20" width="88" height="22" rx="2" fill="none" stroke="#1a202c" stroke-width="2"/>
  <!-- Post caps -->
  <rect x="6" y="16" width="16" height="6" rx="2" fill="#2d3748" stroke="#1a202c" stroke-width="2"/>
  <rect x="82" y="16" width="16" height="6" rx="2" fill="#2d3748" stroke="#1a202c" stroke-width="2"/>
</svg>
