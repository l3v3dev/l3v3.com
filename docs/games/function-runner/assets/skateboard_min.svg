
<svg xmlns="http://www.w3.org/2000/svg" width="144" height="104" viewBox="0 0 144 104">
  <!-- Skateboard deck -->
  <rect x="16" y="82" width="112" height="7" rx="3.5" fill="#2D2D44" stroke="#1A1A2E" stroke-width="3"/>
  <!-- Back wheel -->
  <circle cx="38" cy="94" r="6" fill="#2D2D44" stroke="#1A1A2E" stroke-width="3"/>
  <!-- Front wheel -->
  <circle cx="106" cy="94" r="6" fill="#2D2D44" stroke="#1A1A2E" stroke-width="3"/>
  <!-- Back leg (navy outline) -->
  <path d="M52 50 L35 63 L40 79" fill="none" stroke="#1A1A2E" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Back leg (purple fill) -->
  <path d="M52 50 L35 63 L40 79" fill="none" stroke="#7B2FBE" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front leg (navy outline) -->
  <path d="M52 50 L92 58 L96 79" fill="none" stroke="#1A1A2E" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front leg (purple fill) -->
  <path d="M52 50 L92 58 L96 79" fill="none" stroke="#7B2FBE" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Torso (navy outline) -->
  <path d="M52 50 L68 26" fill="none" stroke="#1A1A2E" stroke-width="11" stroke-linecap="round"/>
  <!-- Torso (purple fill) -->
  <path d="M52 50 L68 26" fill="none" stroke="#7B2FBE" stroke-width="7.5" stroke-linecap="round"/>
  <!-- Back arm (navy outline) -->
  <path d="M68 26 L42 40" fill="none" stroke="#1A1A2E" stroke-width="8" stroke-linecap="round"/>
  <!-- Back arm (purple fill) -->
  <path d="M68 26 L42 40" fill="none" stroke="#7B2FBE" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Front arm (navy outline) -->
  <path d="M68 26 L108 35" fill="none" stroke="#1A1A2E" stroke-width="8" stroke-linecap="round"/>
  <!-- Front arm (purple fill) -->
  <path d="M68 26 L108 35" fill="none" stroke="#7B2FBE" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="76" cy="16" r="10" fill="#7B2FBE" stroke="#1A1A2E" stroke-width="3"/>
  <!-- Helmet (pink arc over top of head) -->
  <path d="M66 16 A10 10 0 0 1 86 16" fill="#FF6B9D" stroke="#1A1A2E" stroke-width="3" stroke-linecap="round"/>
</svg>
