
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Background: dark green forest -->
  <rect width="128" height="128" rx="12" fill="none"/>
  
  <!-- Pine trees - bold minimal shapes -->
  <polygon points="12,18 20,38 4,38" fill="#0f2e1e"/>
  <polygon points="12,26 22,48 2,48" fill="#143824"/>
  <rect x="10" y="48" width="4" height="6" fill="#2a1f14"/>
  
  <polygon points="112,14 120,34 104,34" fill="#0f2e1e"/>
  <polygon points="112,22 122,44 102,44" fill="#143824"/>
  <rect x="110" y="44" width="4" height="6" fill="#2a1f14"/>
  
  <polygon points="8,72 16,92 0,92" fill="#0f2e1e"/>
  <polygon points="8,80 18,102 -2,102" fill="#143824"/>
  <rect x="6" y="102" width="4" height="6" fill="#2a1f14"/>
  
  <polygon points="120,78 128,98 112,98" fill="#0f2e1e"/>
  <polygon points="120,86 130,108 110,108" fill="#143824"/>
  <rect x="118" y="108" width="4" height="6" fill="#2a1f14"/>
  
  <polygon points="118,52 126,72 110,72" fill="#0f2e1e"/>
  <polygon points="118,60 128,82 108,82" fill="#143824"/>
  
  <polygon points="10,52 18,72 2,72" fill="#0f2e1e"/>
  <polygon points="10,60 20,82 0,82" fill="#143824"/>
  
  <!-- Curved road -->
  <path d="M 20 128 Q 30 90 55 72 Q 80 54 100 40 Q 115 30 128 28" stroke="#3d3d3d" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M 20 128 Q 30 90 55 72 Q 80 54 100 40 Q 115 30 128 28" stroke="#4a4a4a" stroke-width="18" fill="none" stroke-linecap="round"/>
  
  <!-- Road center line -->
  <path d="M 20 128 Q 30 90 55 72 Q 80 54 100 40 Q 115 30 128 28" stroke="#e8e8e8" stroke-width="1.5" fill="none" stroke-dasharray="6 5" stroke-linecap="round"/>
  
  <!-- Skid marks - black trails behind car -->
  <path d="M 42 108 Q 48 96 56 84 Q 62 76 68 70" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M 48 112 Q 54 100 62 88 Q 68 80 74 74" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M 38 114 Q 44 102 52 90 Q 58 82 64 76" stroke="#111" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M 52 116 Q 58 104 66 92 Q 72 84 78 78" stroke="#111" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Motion blur trail (ghost of car) -->
  <g opacity="0.2" transform="translate(-8,12) rotate(-15,64,64)">
    <rect x="52" y="56" width="24" height="14" rx="3" fill="#112222"/>
  </g>
  <g opacity="0.1" transform="translate(-14,20) rotate(-15,64,64)">
    <rect x="52" y="56" width="24" height="14" rx="3" fill="#112222"/>
  </g>
  
  <!-- Rally car - top-down, sliding sideways (rotated) -->
  <g transform="translate(64,64) rotate(-35) translate(-64,-64)">
    <!-- Car body -->
    <rect x="48" y="52" width="32" height="20" rx="4" fill="#a0a0a0"/>
    <!-- Car roof/cabin -->
    <rect x="54" y="55" width="18" height="14" rx="3" fill="#101010"/>
    <!-- Windshield -->
    <rect x="56" y="54" width="14" height="4" rx="1" fill="#a8d8f0"/>
    <!-- Rear window -->
    <rect x="56" y="66" width="14" height="3" rx="1" fill="#a8d8f0"/>
    <!-- Front bumper -->
    <rect x="48" y="50" width="32" height="4" rx="2" fill="#121212"/>
    <!-- Rear bumper -->
    <rect x="48" y="70" width="32" height="4" rx="2" fill="#121212"/>
    <!-- Wheels -->
    <rect x="46" y="53" width="5" height="7" rx="1.5" fill="#1a1a1a"/>
    <rect x="77" y="53" width="5" height="7" rx="1.5" fill="#1a1a1a"/>
    <rect x="46" y="64" width="5" height="7" rx="1.5" fill="#1a1a1a"/>
    <rect x="77" y="64" width="5" height="7" rx="1.5" fill="#1a1a1a"/>
    <!-- Racing stripe -->
    <rect x="62" y="52" width="4" height="20" rx="1" fill="#ffffff" opacity="0.7"/>
    <!-- Number circle -->
    <circle cx="64" cy="62" r="5" fill="#fff"/>
    <text x="64" y="65" font-size="7" font-family="Arial" font-weight="bold" fill="#e63030" text-anchor="middle">7</text>
  </g>
  
  <!-- Dust/smoke particles -->
  <circle cx="44" cy="104" r="3" fill="#8a8a7a" opacity="0.4"/>
  <circle cx="38" cy="110" r="2.5" fill="#8a8a7a" opacity="0.3"/>
  <circle cx="50" cy="112" r="2" fill="#8a8a7a" opacity="0.35"/>
  <circle cx="34" cy="116" r="2" fill="#8a8a7a" opacity="0.25"/>
  
  <!-- Subtle vignette border -->
  <rect width="128" height="128" rx="12" fill="none" stroke="#0a1f14" stroke-width="3"/>
</svg>
