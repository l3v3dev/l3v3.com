<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <rect width="320" height="180" fill="none"/>
  <defs>
    <style>
      .o{stroke:#242424;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .t{stroke:#242424;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <!-- OFFROAD 4x4 TRUCK / SIDE PROFILE -->

  <!-- Rear Bed Roll Bar & Spare Tire -->
  <path d="M60 40 L100 65 M80 40 L105 65" fill="none" class="o"/>
  <circle cx="70" cy="40" r="14" fill="#252525" class="o"/>
  <circle cx="70" cy="40" r="6" fill="#444" class="t"/>

  <!-- Suspension Details (Behind Wheels) -->
  <!-- Shock Absorbers / Coil Springs -->
  <path d="M73 132 L73 75 M248 132 L248 75" stroke="#d93622" stroke-width="6"/>
  <path d="M68 90 h10 M68 100 h10 M68 110 h10 M243 90 h10 M243 100 h10 M243 110 h10" stroke="#f5c62e" stroke-width="3"/>
  <!-- Control Arms connecting to chassis -->
  <path d="M73 132 L100 110 M248 132 L221 110" stroke="#aaa" stroke-width="5" stroke-linecap="round"/>

  <!-- Rally Mud Flaps -->
  <polygon points="38,110 25,135 35,135 45,110" fill="#d93622" class="o"/>
  <polygon points="213,110 200,135 210,135 220,110" fill="#d93622" class="o"/>

  <!-- CHUNKY RALLY TIRES (Exact Match to Car) -->
  <g fill="#252525" class="o">
    <circle cx="73" cy="132" r="31"/>
    <circle cx="248" cy="132" r="31"/>
  </g>

  <!-- tire tread -->
  <g fill="#3a3a3a" class="t">
    <path d="M51 107l-10-4 2-8 11 2"/>
    <path d="M62 102l-5-10 7-5 8 9"/>
    <path d="M76 101l1-11 8 1 3 11"/>
    <path d="M90 105l8-8 7 6-6 9"/>
    <path d="M101 116l10-1 2 8-10 4"/>
    <path d="M103 132l10 4-2 8-11-1"/>
    <path d="M96 147l7 8-6 6-9-7"/>
    <path d="M82 157l-1 11-8-1-3-11"/>
    <path d="M66 157l-8 8-7-5 5-10"/>
    <path d="M53 148l-10 3-3-8 10-5"/>
    <path d="M46 133l-11-2v-8l11-1"/>

    <path d="M226 107l-10-4 2-8 11 2"/>
    <path d="M237 102l-5-10 7-5 8 9"/>
    <path d="M251 101l1-11 8 1 3 11"/>
    <path d="M265 105l8-8 7 6-6 9"/>
    <path d="M276 116l10-1 2 8-10 4"/>
    <path d="M278 132l10 4-2 8-11-1"/>
    <path d="M271 147l7 8-6 6-9-7"/>
    <path d="M256 157l-1 11-8-1-3-11"/>
    <path d="M241 157l-8 8-7-5 5-10"/>
    <path d="M228 148l-10 3-3-8 10-5"/>
    <path d="M221 133l-11-2v-8l11-1"/>
  </g>

  <!-- wheels -->
  <g fill="none" class="t">
    <circle cx="73" cy="132" r="21" fill="#bcbcbc"/>
    <circle cx="248" cy="132" r="21" fill="#bcbcbc"/>
    <circle cx="73" cy="132" r="5" fill="#444"/>
    <circle cx="248" cy="132" r="5" fill="#444"/>
    <path d="M73 111v42M52 132h42M58 117l30 30M88 117l-30 30"/>
    <path d="M248 111v42M227 132h42M233 117l30 30M263 117l-30 30"/>
  </g>

  <!-- TRUCK BODY SILHOUETTE -->
  <path d="M25 65
           L110 65
           L115 40
           L170 40
           L195 65
           L285 65
           L290 75
           L290 110
           L283 110 L275 75 L221 75 L213 110
           L108 110 L100 75 L46 75 L38 110
           L25 110 Z"
        fill="#e43f25" class="o"/>

  <!-- Windows & Pillar -->
  <path d="M120 45 L165 45 L180 65 L120 65 Z" fill="#303941" class="o"/>
  <path d="M150 45 L150 65" class="t" fill="none"/>

  <!-- Truck Flares / Wheel Arches -->
  <polygon points="30,110 40,65 106,65 116,110 108,110 100,75 46,75 38,110" fill="#252525" class="o"/>
  <polygon points="205,110 215,65 281,65 291,110 283,110 275,75 221,75 213,110" fill="#252525" class="o"/>

  <!-- Heavy Duty Rock Sliders (Side Steps) -->
  <polygon points="116,110 205,110 205,115 116,115" fill="#252525" class="o"/>
  <path d="M125 105 v5 M160 105 v5 M195 105 v5" stroke="#252525" stroke-width="4"/>

  <!-- Front Tube Stinger Bumper -->
  <polygon points="285,105 310,100 315,110 290,115" fill="#252525" class="o"/>
  <polygon points="295,100 310,75 315,80 300,105" fill="#252525" class="o"/>

  <!-- Rear Steel Bumper -->
  <polygon points="15,100 25,100 25,115 15,115" fill="#252525" class="o"/>
  <path d="M15 110 C5 110, 5 120, 10 120" class="t" fill="none"/> <!-- Tow Hook -->

  <!-- Snorkel Intake -->
  <path d="M185 65 L170 35 L175 35 L190 65 Z" fill="#252525" class="o"/>
  <polygon points="160,30 175,30 175,35 160,35" fill="#252525" class="o"/>

  <!-- Roof Rack & Auxiliary Lights -->
  <polygon points="125,32 165,32 165,37 125,37" fill="#252525" class="o"/>
  <g fill="#f5f1c8" class="o">
    <circle cx="130" cy="27" r="4"/>
    <circle cx="145" cy="27" r="4"/>
    <circle cx="160" cy="27" r="4"/>
  </g>
  <g fill="#ffd85a">
    <circle cx="130" cy="27" r="2"/>
    <circle cx="145" cy="27" r="2"/>
    <circle cx="160" cy="27" r="2"/>
  </g>

  <!-- Door Line & Details -->
  <path d="M115 65 L185 65 L175 110 L115 110 Z" fill="none" class="t"/>
  <line x1="125" y1="75" x2="137" y2="75" stroke="#eee" stroke-width="4" stroke-linecap="round"/>

  <!-- Racing Graphics & Number -->
  <polygon points="122,65 142,95 132,95 112,65" fill="#f5c62e"/>
  <polygon points="187,65 197,95 187,95 177,65" fill="#f5c62e"/>
  <polygon points="140,78 170,78 170,95 140,95" fill="#fff" class="o"/>
  <text x="155" y="91" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="900" fill="#252525">07</text>

  <!-- Hood Vents -->
  <polygon points="220,65 240,65 243,68 220,68" fill="#252525" class="o"/>
  <polygon points="255,65 275,65 278,68 255,68" fill="#252525" class="o"/>

  <!-- Grille, Headlight & Taillight -->
  <polygon points="290,75 285,100 275,100 280,75" fill="#111" class="o"/>
  <polygon points="282,78 288,78 287,85 281,85" fill="#f5f1c8" class="t"/>
  <polygon points="25,72 21,72 21,85 25,85" fill="#f5c62e" class="t"/>

</svg>
