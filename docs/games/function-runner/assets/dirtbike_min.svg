
<svg xmlns="http://www.w3.org/2000/svg" width="184" height="104" viewBox="0 0 184 104">
  <!-- Rear wheel -->
  <circle cx="30" cy="72" r="20" fill="none" stroke="#1B2A4A" stroke-width="4"/>
  <line x1="30" y1="52" x2="30" y2="92" stroke="#1B2A4A" stroke-width="2"/>
  <line x1="10" y1="72" x2="50" y2="72" stroke="#1B2A4A" stroke-width="2"/>
  <line x1="16" y1="58" x2="44" y2="86" stroke="#1B2A4A" stroke-width="2"/>
  <line x1="44" y1="58" x2="16" y2="86" stroke="#1B2A4A" stroke-width="2"/>
  <!-- Front wheel -->
  <circle cx="154" cy="72" r="20" fill="none" stroke="#1B2A4A" stroke-width="4"/>
  <line x1="154" y1="52" x2="154" y2="92" stroke="#1B2A4A" stroke-width="2"/>
  <line x1="134" y1="72" x2="174" y2="72" stroke="#1B2A4A" stroke-width="2"/>
  <line x1="140" y1="58" x2="168" y2="86" stroke="#1B2A4A" stroke-width="2"/>
  <line x1="168" y1="58" x2="140" y2="86" stroke="#1B2A4A" stroke-width="2"/>
  <!-- Bike frame teal -->
  <polygon points="40,66 56,40 108,36 128,44 144,66" fill="#008B8B" stroke="#1B2A4A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Seat -->
  <rect x="52" y="34" width="32" height="9" rx="4" fill="#008B8B" stroke="#1B2A4A" stroke-width="2.5"/>
  <!-- Handlebar -->
  <line x1="128" y1="44" x2="138" y2="30" stroke="#1B2A4A" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="132" y1="30" x2="144" y2="30" stroke="#1B2A4A" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Front fork -->
  <line x1="144" y1="66" x2="154" y2="72" stroke="#1B2A4A" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Rear link -->
  <line x1="40" y1="66" x2="30" y2="72" stroke="#1B2A4A" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Rider body coral -->
  <ellipse cx="80" cy="28" rx="20" ry="13" fill="#FF6F61" stroke="#1B2A4A" stroke-width="3"/>
  <!-- Helmet -->
  <circle cx="86" cy="14" r="10" fill="#FF6F61" stroke="#1B2A4A" stroke-width="3"/>
  <!-- Arm to handlebar -->
  <path d="M96 26 Q118 22 136 30" fill="none" stroke="#1B2A4A" stroke-width="7" stroke-linecap="round"/>
  <path d="M96 26 Q118 22 136 30" fill="none" stroke="#FF6F61" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Leg -->
  <path d="M66 38 Q58 50 52 60" fill="none" stroke="#1B2A4A" stroke-width="7" stroke-linecap="round"/>
  <path d="M66 38 Q58 50 52 60" fill="none" stroke="#FF6F61" stroke-width="4.5" stroke-linecap="round"/>
</svg>
