
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect width="128" height="128" fill="none"/>
  <!-- Discus thickness (bottom edge) -->
  <ellipse cx="64" cy="67" rx="52" ry="42" fill="#B83A1A"/>
  <!-- Red-orange rubber rim -->
  <ellipse cx="64" cy="64" rx="52" ry="42" fill="#E8542A"/>
  <!-- Cream center -->
  <ellipse cx="64" cy="64" rx="36" ry="28" fill="#F5E6C8"/>
  <!-- Subtle inner ring detail -->
  <ellipse cx="64" cy="64" rx="36" ry="28" fill="none" stroke="#E0D4B8" stroke-width="1.5"/>
  <!-- Grip dot -->
  <circle cx="64" cy="64" r="5" fill="#C8A870"/>
  <circle cx="64" cy="64" r="3" fill="#B08850"/>
</svg>
