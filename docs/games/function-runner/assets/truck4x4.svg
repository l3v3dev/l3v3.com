
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="256" viewBox="0 0 512 256">
  <rect width="512" height="256" fill-opacity="0"/>

  <!-- Main truck body (red-orange) -->
  <path d="M 52,195 L 52,108 L 62,98 L 115,94 L 128,82 L 142,94 L 172,90 L 178,60 L 318,56 L 326,64 L 348,100 L 378,96 L 392,84 L 406,96 L 448,104 L 462,112 L 468,195 Z"
        fill="#E84D1A" stroke="#1A1A1A" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Lower black cladding -->
  <path d="M 52,168 L 468,168 L 468,195 L 52,195 Z"
        fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Yellow accent stripe -->
  <rect x="58" y="142" width="404" height="9" fill="#FFD200" rx="2"/>
  <rect x="58" y="155" width="404" height="4" fill="#FFD200" rx="1"/>

  <!-- Cab side window -->
  <path d="M 196,70 L 292,66 L 292,96 L 196,99 Z"
        fill="#A8D8F0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Front windshield -->
  <path d="M 304,66 L 322,63 L 344,98 L 304,98 Z"
        fill="#A8D8F0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Door line -->
  <line x1="248" y1="70" x2="248" y2="165" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Door handle -->
  <rect x="252" y="118" width="14" height="5" fill="#1A1A1A" rx="2"/>

  <!-- Roof rack -->
  <rect x="182" y="46" width="140" height="7" fill="#1A1A1A" rx="2"/>
  <rect x="192" y="40" width="5" height="13" fill="#1A1A1A" rx="1"/>
  <rect x="248" y="40" width="5" height="13" fill="#1A1A1A" rx="1"/>
  <rect x="304" y="40" width="5" height="13" fill="#1A1A1A" rx="1"/>
  <!-- Roof rack cross bars -->
  <rect x="182" y="42" width="140" height="3" fill="#333333" rx="1"/>

  <!-- Front bumper -->
  <path d="M 460,152 L 488,152 L 488,195 L 460,195 Z"
        fill="#2A2A2A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Bumper detail -->
  <rect x="464" y="158" width="20" height="6" fill="#444444" rx="1"/>

  <!-- Headlight -->
  <rect x="458" y="116" width="14" height="20" fill="#FFF3B0" stroke="#1A1A1A" stroke-width="2.5" rx="3"/>

  <!-- Rear taillight -->
  <rect x="52" y="112" width="8" height="16" fill="#FF3333" stroke="#1A1A1A" stroke-width="2" rx="2"/>

  <!-- Fender highlights (raised fender tops) -->
  <path d="M 115,94 L 128,82 L 142,94" fill="none" stroke="#FF6B35" stroke-width="3" stroke-linecap="round"/>
  <path d="M 378,96 L 392,84 L 406,96" fill="none" stroke="#FF6B35" stroke-width="3" stroke-linecap="round"/>

  <!-- Hood vent detail -->
  <line x1="360" y1="100" x2="430" y2="106" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <line x1="365" y1="106" x2="435" y2="112" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>

  <!-- Rear bed rail -->
  <rect x="52" y="98" width="118" height="5" fill="#CC3D10" rx="1"/>
</svg>
