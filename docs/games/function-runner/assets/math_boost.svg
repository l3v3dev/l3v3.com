
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="hexGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#67e8f9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="discGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#e0fbff"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </radialGradient>
    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer glow rim -->
  <polygon points="64,12 109,38 109,90 64,116 19,90 19,38" fill="none" stroke="#a5f3fc" stroke-width="3" filter="url(#outerGlow)" opacity="0.9"/>

  <!-- Main hexagon body -->
  <polygon points="64,18 105,41 105,87 64,110 23,87 23,41" fill="url(#hexGrad)" stroke="#a5f3fc" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Inner glow overlay -->
  <polygon points="64,18 105,41 105,87 64,110 23,87 23,41" fill="url(#innerGlow)"/>

  <!-- Subtle top highlight edge -->
  <line x1="64" y1="18" x2="105" y2="41" stroke="#a5f3fc" stroke-width="1" opacity="0.5"/>
  <line x1="64" y1="18" x2="23" y2="41" stroke="#a5f3fc" stroke-width="1" opacity="0.5"/>

  <!-- Center pale-cyan disc -->
  <circle cx="64" cy="64" r="22" fill="url(#discGrad)" filter="url(#softGlow)"/>
  <circle cx="64" cy="64" r="22" fill="none" stroke="#a5f3fc" stroke-width="1" opacity="0.6"/>
</svg>
