  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #111;
      overflow: hidden;
    }

    /* Center the canvas both ways so portrait phones don't strand it at the top. */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      background: #000;
      /* Scale to fit the viewport so no scrollbar ever appears. */
      max-width: 100vw;
      max-height: 100vh;
      /* Mobile browsers: use the dynamic viewport so the URL bar doesn't clip the game. */
      max-height: 100dvh;
      /* We handle all gestures ourselves (preventDefault in input.js). */
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #eee;
      font-family: sans-serif;
      font-size: 24px;
      z-index: 10;
    }

    #loading.hidden {
      display: none;
    }
    #loading .textblink{animation:animblink 1s infinite steps(4,start)}@keyframes animblink{to{visibility:hidden}}

    /* Portrait-phone "rotate me" hint. Shown by JS only on touch devices in
       portrait; a "Play anyway" button dismisses it. */
    #rotate-hint {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: rgba(10, 12, 18, 0.96);
      color: #eee;
      font-family: sans-serif;
      text-align: center;
      z-index: 20;
      padding: 24px;
      box-sizing: border-box;
    }

    #rotate-hint.show {
      display: flex;
    }

    #rotate-hint .phone {
      width: 64px;
      height: 108px;
      border: 4px solid #fbbf24;
      border-radius: 14px;
      position: relative;
      animation: rotateme 1.6s ease-in-out infinite;
    }

    #rotate-hint .phone::after {
      content: "";
      position: absolute;
      bottom: 7px;
      left: 50%;
      transform: translateX(-50%);
      width: 22px;
      height: 4px;
      border-radius: 2px;
      background: #fbbf24;
    }

    @keyframes rotateme {
      0%, 20% { transform: rotate(0deg); }
      60%, 100% { transform: rotate(90deg); }
    }

    #rotate-hint p {
      margin: 0;
      font-size: 18px;
      max-width: 320px;
      line-height: 1.4;
    }

    #rotate-anyway {
      margin-top: 6px;
      background: none;
      border: 2px solid #8b95b5;
      color: #8b95b5;
      font-size: 14px;
      font-family: monospace;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>

<body>
  <div id="loading">Loading <span class="textblink">...</span></div>
  <canvas id="game-canvas" width="800" height="600"></canvas>
  <div id="rotate-hint">
    <div class="phone"></div>
    <p>Rotate your device for the best experience</p>
    <button id="rotate-anyway">PLAY ANYWAY</button>
  </div>
  <script>
    // Show the rotate hint on touch devices while the viewport is portrait.
    (function () {
      var el = document.getElementById("rotate-hint");
      var btn = document.getElementById("rotate-anyway");
      var dismissed = false;
      function isTouch() {
        return "ontouchstart" in window || (navigator.maxTouchPoints || 0) > 0;
      }
      function update() {
        var portrait = window.innerHeight > window.innerWidth;
        el.classList.toggle("show", !dismissed && isTouch() && portrait);
      }
      btn.addEventListener("click", function () {
        dismissed = true;
        update();
      });
      window.addEventListener("resize", update);
      window.addEventListener("orientationchange", update);
      update();
      // Exposed for automated tests.
      window._rotateHint = { update: update, el: el };
    })();
  </script>
