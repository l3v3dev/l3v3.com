  <style>
    html, body { margin: 0; height: 100%; background: #111; }
    body { display: grid; place-items: center; }
    canvas {
      display: block;
      background: #000;
      /* Scale the 800x600 canvas to fit the screen (e.g. phones) while
         keeping its 4:3 aspect ratio. width is capped at the intrinsic 800px
         so it never upscales; aspect-ratio derives the height so the game is
         never stretched. input.js maps pointer coords via
         getBoundingClientRect so CSS scaling stays accurate. */
      width: min(800px, 100vw, calc(100vh * 4 / 3));
      height: auto;
      aspect-ratio: 4 / 3;
      /* Block browser scroll/zoom gestures so drags always reach the game. */
      touch-action: none;
    }
    dialog {
      width: min(360px, calc(100vw - 48px));
      border: 1px solid #66ccff;
      border-radius: 8px;
      padding: 24px;
      color: #fff;
      background: #1a1a2e;
      font: 16px Georgia, serif;
      line-height: 1.5;
    }
    dialog::backdrop { background: rgb(0 0 0 / 70%); }
    #loading-overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #111;
      color: #66ccff;
      font: 24px Georgia, serif;
      z-index: 10;
    }
    dialog h2 { margin: 0 0 12px; color: #66ccff; }
    dialog ul { margin: 8px 0 20px; padding-left: 22px; }
    dialog button {
      border: 1px solid #66ccff;
      border-radius: 4px;
      padding: 8px 14px;
      color: #fff;
      background: #253552;
      font: inherit;
      cursor: pointer;
    }
