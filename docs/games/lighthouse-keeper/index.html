<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Lighthouse Keeper</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; }
    body { display: grid; place-items: center; }
    canvas { display: block; background: #000; }
    dialog {
      width: min(360px, calc(100vw - 48px));
      border: 1px solid #66ccff;
      border-radius: 8px;
      padding: 24px;
      color: #fff;
      background: #1a1a2e;
      font: 16px Georgia, serif;
      line-height: 1.5;
    }
    dialog::backdrop { background: rgb(0 0 0 / 70%); }
    dialog h2 { margin: 0 0 12px; color: #66ccff; }
    dialog ul { margin: 8px 0 20px; padding-left: 22px; }
    dialog button {
      border: 1px solid #66ccff;
      border-radius: 4px;
      padding: 8px 14px;
      color: #fff;
      background: #253552;
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas" width="800" height="600"></canvas>
  <dialog id="game-info">
    <h2>Lighthouse Keeper</h2>
    <p>Protect the lighthouse through five waves.</p>
    <ul>
      <li>WASD: move the keeper</li>
      <li>Hold the mouse button: fire bolts</li>
      <li>Keep the beacon lit and watch the beam meter</li>
    </ul>
    <form method="dialog"><button>Close</button></form>
  </dialog>
  <script src="game.min.js?v=mtvemxi7"></script>
