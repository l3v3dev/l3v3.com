
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a4a"/>
      <stop offset="100%" stop-color="#0d1f2a"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="1"/>
      <stop offset="35%" stop-color="#f5a623" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#66ccff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#66ccff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#66ccff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#66ccff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="wisp" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0%" stop-color="#b0d0f0" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#b0d0f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d8d8d8"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c8c8c8"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3a4a"/>
      <stop offset="100%" stop-color="#151f2a"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Stars -->
  <circle cx="72" cy="52" r="2.2" fill="#fff" opacity="0.85"/>
  <circle cx="148" cy="88" r="1.6" fill="#fff" opacity="0.6"/>
  <circle cx="370" cy="44" r="2" fill="#fff" opacity="0.75"/>
  <circle cx="445" cy="95" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="310" cy="68" r="1.8" fill="#fff" opacity="0.65"/>
  <circle cx="55" cy="135" r="1.4" fill="#fff" opacity="0.5"/>
  <circle cx="462" cy="155" r="1.5" fill="#fff" opacity="0.45"/>
  <circle cx="200" cy="40" r="1.3" fill="#fff" opacity="0.55"/>
  <circle cx="420" cy="180" r="1.2" fill="#fff" opacity="0.4"/>

  <!-- Sea -->
  <rect x="0" y="340" width="512" height="172" fill="url(#sea)"/>

  <!-- Wave crests -->
  <path d="M0,355 Q26,345 52,355 Q78,365 104,355 Q130,345 156,355 Q182,365 208,355 Q234,345 260,355 Q286,365 312,355 Q338,345 364,355 Q390,365 416,355 Q442,345 468,355 Q494,365 512,358 L512,368 Q494,375 468,368 Q442,360 416,368 Q390,375 364,368 Q338,360 312,368 Q286,375 260,368 Q234,360 208,368 Q182,375 156,368 Q130,360 104,368 Q78,375 52,368 Q26,360 0,368 Z" fill="#2a5a6a" opacity="0.55"/>
  <path d="M0,385 Q35,375 70,385 Q105,395 140,385 Q175,375 210,385 Q245,395 280,385 Q315,375 350,385 Q385,395 420,385 Q455,375 490,385 Q505,388 512,385 L512,395 Q490,400 455,395 Q420,390 385,395 Q350,400 315,395 Q280,390 245,395 Q210,400 175,395 Q140,390 105,395 Q70,400 35,395 Q15,392 0,395 Z" fill="#1e4a5a" opacity="0.45"/>

  <!-- Rocky island -->
  <path d="M155,430 Q165,395 185,382 Q205,372 225,376 Q240,370 256,367 Q272,370 287,376 Q307,372 327,382 Q347,395 357,430 Q360,442 355,450 L157,450 Q152,442 155,430 Z" fill="url(#rock)"/>
  <path d="M172,428 Q182,400 202,388 Q222,380 242,383 Q256,379 270,383 Q290,380 310,388 Q330,400 340,428 L340,445 L172,445 Z" fill="#2e4050" opacity="0.7"/>

  <!-- Light beams (behind lighthouse) -->
  <polygon points="242,148 12,95 12,215" fill="url(#beamL)" opacity="0.45"/>
  <polygon points="270,148 500,95 500,215" fill="url(#beamR)" opacity="0.45"/>

  <!-- Lamp radial glow -->
  <circle cx="256" cy="142" r="90" fill="url(#lampGlow)"/>

  <!-- Lighthouse tower -->
  <path d="M234,162 L228,382 L284,382 L278,162 Z" fill="url(#tower)"/>

  <!-- Red-orange stripes -->
  <path d="M233,192 L232,214 L280,214 L279,192 Z" fill="#e8543a" rx="2"/>
  <path d="M232,242 L231,264 L281,264 L280,242 Z" fill="#e8543a"/>
  <path d="M231,292 L230,314 L282,314 L281,292 Z" fill="#e8543a"/>
  <path d="M230,342 L229,364 L283,364 L282,342 Z" fill="#e8543a"/>

  <!-- Gallery platform -->
  <rect x="226" y="158" width="60" height="7" fill="#3a4a5a" rx="2"/>

  <!-- Lamp room -->
  <rect x="236" y="128" width="40" height="32" fill="#2a3545" rx="3"/>
  <!-- Lamp glass -->
  <rect x="241" y="132" width="30" height="24" fill="#f5a623" rx="2" opacity="0.92"/>
  <!-- Inner bright core -->
  <circle cx="256" cy="144" r="9" fill="#ffe080" opacity="0.85"/>
  <circle cx="256" cy="144" r="5" fill="#fff8e0" opacity="0.9"/>

  <!-- Lamp room roof -->
  <path d="M232,128 L256,106 L280,128 Z" fill="#3a4a5a"/>
  <circle cx="256" cy="104" r="4" fill="#4a5a6a"/>

  <!-- Ghost wisps -->
  <!-- Wisp 1 - left -->
  <ellipse cx="115" cy="378" rx="24" ry="19" fill="url(#wisp)" opacity="0.6"/>
  <path d="M95,384 Q78,392 68,404 Q64,410 66,416" stroke="#a8c8e8" stroke-width="3.5" fill="none" opacity="0.3" stroke-linecap="round"/>

  <!-- Wisp 2 - right -->
  <ellipse cx="405" cy="368" rx="22" ry="17" fill="url(#wisp)" opacity="0.55"/>
  <path d="M425,374 Q442,382 452,395 Q456,402 454,408" stroke="#a8c8e8" stroke-width="3" fill="none" opacity="0.28" stroke-linecap="round"/>

  <!-- Wisp 3 - center-left lower -->
  <ellipse cx="165" cy="412" rx="17" ry="14" fill="url(#wisp)" opacity="0.45"/>
  <path d="M150,418 Q136,424 128,434" stroke="#a8c8e8" stroke-width="2.5" fill="none" opacity="0.22" stroke-linecap="round"/>

  <!-- Wisp 4 - center-right -->
  <ellipse cx="355" cy="402" rx="19" ry="15" fill="url(#wisp)" opacity="0.5"/>
  <path d="M374,408 Q388,415 396,426" stroke="#a8c8e8" stroke-width="2.5" fill="none" opacity="0.22" stroke-linecap="round"/>

  <!-- Wisp 5 - far left small -->
  <ellipse cx="60" cy="405" rx="13" ry="11" fill="url(#wisp)" opacity="0.35"/>
  <path d="M48,410 Q38,416 32,424" stroke="#a8c8e8" stroke-width="2" fill="none" opacity="0.18" stroke-linecap="round"/>

  <!-- Border frame -->
  <rect x="8" y="8" width="496" height="496" rx="24" ry="24" fill="none" stroke="#4a5a7a" stroke-width="4" opacity="0.7"/>
</svg>
