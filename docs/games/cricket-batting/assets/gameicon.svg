
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <clipPath id="iconClip">
      <rect x="0" y="0" width="512" height="512" rx="48" ry="48"/>
    </clipPath>
    <clipPath id="fieldClip">
      <ellipse cx="256" cy="256" rx="200" ry="160"/>
    </clipPath>
    <radialGradient id="ballGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ff5555"/>
      <stop offset="45%" stop-color="#dd1a1a"/>
      <stop offset="100%" stop-color="#7a0000"/>
    </radialGradient>
    <radialGradient id="glossGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ballShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g clip-path="url(#iconClip)">
    <!-- Dark green base -->
    <rect x="0" y="0" width="512" height="512" fill="#1b5e1b"/>

    <!-- Cricket oval field -->
    <ellipse cx="256" cy="256" rx="200" ry="160" fill="#2e8b2e"/>

    <!-- Mowing stripes (horizontal bands clipped to oval) -->
    <g clip-path="url(#fieldClip)">
      <rect x="50" y="100" width="412" height="30" fill="#3a9e3a" opacity="0.45"/>
      <rect x="50" y="160" width="412" height="30" fill="#3a9e3a" opacity="0.45"/>
      <rect x="50" y="220" width="412" height="30" fill="#3a9e3a" opacity="0.45"/>
      <rect x="50" y="280" width="412" height="30" fill="#3a9e3a" opacity="0.45"/>
      <rect x="50" y="340" width="412" height="30" fill="#3a9e3a" opacity="0.45"/>
    </g>

    <!-- Boundary rope (white thin line) -->
    <ellipse cx="256" cy="256" rx="195" ry="155" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>

    <!-- Pitch strip (light tan vertical) -->
    <rect x="234" y="118" width="44" height="276" rx="5" fill="#d6bc8e"/>
    <rect x="237" y="121" width="38" height="270" rx="4" fill="#e0c89a"/>
    <!-- Crease lines -->
    <line x1="237" y1="142" x2="275" y2="142" stroke="#bfa472" stroke-width="2"/>
    <line x1="237" y1="370" x2="275" y2="370" stroke="#bfa472" stroke-width="2"/>

    <!-- Targeting reticle: 8 sector lines radiating from ball center -->
    <g stroke="#ffffff" stroke-width="1.5" opacity="0.35" stroke-linecap="round">
      <line x1="240" y1="248" x2="240" y2="148"/>
      <line x1="240" y1="248" x2="310" y2="178"/>
      <line x1="240" y1="248" x2="340" y2="248"/>
      <line x1="240" y1="248" x2="310" y2="318"/>
      <line x1="240" y1="248" x2="240" y2="348"/>
      <line x1="240" y1="248" x2="170" y2="318"/>
      <line x1="240" y1="248" x2="140" y2="248"/>
      <line x1="240" y1="248" x2="170" y2="178"/>
    </g>
    <!-- Highlighted sector (one pie slice) -->
    <path d="M240,248 L240,148 A100,100 0 0,1 310,178 Z" fill="#ffffff" opacity="0.1"/>

    <!-- Motion swoosh arc behind bat -->
    <path d="M305,195 Q345,155 385,168" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
    <path d="M300,208 Q338,168 375,180" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <path d="M296,220 Q330,182 362,192" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>

    <!-- Cricket bat (mid-swing, angled from upper-right) -->
    <g transform="rotate(-38, 285, 235)" filter="url(#softShadow)">
      <!-- Bat blade -->
      <rect x="272" y="155" width="26" height="110" rx="5" fill="#b8863c"/>
      <rect x="275" y="158" width="20" height="104" rx="4" fill="#d4a45a"/>
      <!-- Blade edge highlight -->
      <line x1="275" y1="162" x2="275" y2="258" stroke="#e8c878" stroke-width="2" opacity="0.7"/>
      <!-- Bat handle -->
      <rect x="279" y="263" width="12" height="40" rx="4" fill="#7a5a1e"/>
      <rect x="281" y="265" width="8" height="36" rx="3" fill="#8b6928"/>
      <!-- Handle grip lines -->
      <line x1="281" y1="272" x2="289" y2="272" stroke="#6a4a14" stroke-width="1"/>
      <line x1="281" y1="280" x2="289" y2="280" stroke="#6a4a14" stroke-width="1"/>
      <line x1="281" y1="288" x2="289" y2="288" stroke="#6a4a14" stroke-width="1"/>
    </g>

    <!-- Cricket ball (large, glossy, with shadow) -->
    <g filter="url(#ballShadow)">
      <circle cx="240" cy="248" r="32" fill="url(#ballGrad)"/>
    </g>
    <!-- Ball seam (white curved line) -->
    <path d="M218,234 Q240,252 262,234" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Seam stitching dots -->
    <circle cx="224" cy="237" r="1.2" fill="#ffffff" opacity="0.7"/>
    <circle cx="232" cy="241" r="1.2" fill="#ffffff" opacity="0.7"/>
    <circle cx="240" cy="243" r="1.2" fill="#ffffff" opacity="0.7"/>
    <circle cx="248" cy="241" r="1.2" fill="#ffffff" opacity="0.7"/>
    <circle cx="256" cy="237" r="1.2" fill="#ffffff" opacity="0.7"/>
    <!-- Ball gloss highlight -->
    <ellipse cx="230" cy="236" rx="12" ry="9" fill="url(#glossGrad)"/>
    <!-- Small specular dot -->
    <circle cx="228" cy="233" r="4" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- Outer rounded border -->
  <rect x="1" y="1" width="510" height="510" rx="48" ry="48" fill="none" stroke="#144214" stroke-width="3"/>
</svg>
