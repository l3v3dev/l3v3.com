<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Cricket</title>
  <style>
	html,body{margin:0;height:100%;background:#111}
	canvas{display:block;margin:0 auto;background:#000}
	#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#111;color:#eee;font-family:system-ui,sans-serif;font-size:1.5rem;z-index:10}
	#loading.hidden{display:none}#loading .textblink{animation:animblink 1s infinite steps(4,start)}@keyframes animblink{to{visibility:hidden}}
  </style>
</head>

<body>
  <div id="loading">Loading <span class="textblink">...</span></div>
  <canvas id="game-canvas" width="960" height="640"></canvas>
  <script defer src="game.min.js"></script>
</body>

</html>
