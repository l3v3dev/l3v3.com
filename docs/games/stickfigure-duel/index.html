<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Ink Duel</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #111;
      overflow: hidden;
    }

    canvas {
      display: block;
      margin: 0 auto;
      background: #F5F0E8;
      max-width: 100%;
      max-height: 100vh;
      touch-action: none;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #F5F0E8;
      font-family: sans-serif;
      font-size: 24px;
      z-index: 10;
    }
    #loading .textblink{animation:animblink 1s infinite steps(4,start)}@keyframes animblink{to{visibility:hidden}}
  </style>
</head>

<body>
  <div id="loading">Loading <span class="textblink">...</span></div>
  <canvas id="game-canvas" width="800" height="600"></canvas>
  <script defer src="game.min.js"></script>
</body>

</html>
