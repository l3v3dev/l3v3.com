    html,

      background: #F5F0E8;
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      touch-action: none;
    }

    /* Shown by JS on touch devices while the screen is in portrait:
       the 4:3 arena would be too small to play with virtual buttons. */
    #rotate-hint {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #111;
      color: #F5F0E8;
      font-family: monospace;
      text-align: center;
      z-index: 20;
      padding: 24px;
    }
    body.portrait-touch #rotate-hint {
      display: flex;
    }
    #rotate-hint .icon {
      font-size: 56px;
      animation: rotate-wiggle 1.6s ease-in-out infinite;
    }
    #rotate-hint .title {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
    }
    #rotate-hint .sub {
      font-size: 14px;
      opacity: 0.7;
    }
    @keyframes rotate-wiggle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #F5F0E8;
      font-family: sans-serif;
      font-size: 24px;
      z-index: 10;
    }
    #loading .textblink{animation:animblink 1s infinite steps(4,start)}@keyframes animblink{to{visibility:hidden}}
  </style>
