  <path d="M 47 61 C 51 70, 57 80, 63 90" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Left leg (back leg) -->
  <path d="M 46 60 C 42 68, 35 78, 28 88 C 26 92, 24 96, 22 100" fill="none" stroke="black" stroke-width="3.8" stroke-linecap="round"/>
  <path d="M 45 61 C 41 70, 34 80, 27 90" fill="none" stroke="black" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>

  <!-- Right foot -->
  <path d="M 67 100 C 71 101, 75 101, 78 100" fill="none" stroke="black" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Left foot -->
  <path d="M 22 100 C 18 101, 15 101, 12 100" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>

  <!-- Motion arc - quick jab swoosh near fist -->
  <path d="M 106 32 C 110 35, 112 40, 110 45" fill="none" stroke="black" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 108 29 C 113 33, 115 40, 112 47" fill="none" stroke="black" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 110 26 C 115 31, 117 39, 114 48" fill="none" stroke="black" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

  <!-- Small speed lines behind jab arm -->
  <path d="M 72 33 C 76 33, 80 33, 84 33" fill="none" stroke="black" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 70 42 C 74 42, 78 42, 82 42" fill="none" stroke="black" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>

  <!-- Extra rough ink splatter marks for hand-drawn feel -->
  <circle cx="105" cy="30" r="1" fill="black" opacity="0.7"/>
  <circle cx="112" cy="50" r="0.8" fill="black" opacity="0.5"/>
  <circle cx="79" cy="32" r="0.7" fill="black" opacity="0.6"/>
