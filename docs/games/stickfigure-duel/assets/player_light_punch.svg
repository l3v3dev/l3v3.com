  <path d="M 51 35 C 60 36, 70 37, 80 38 C 86 38, 93 38, 96 38" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Jab fist - rough knuckle shape -->
