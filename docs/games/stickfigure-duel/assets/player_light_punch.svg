  <path d="M 96 35 C 100 34, 103 36, 103 39" fill="none" stroke="black" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Left arm (guard) - pulled back near chest -->
  <path d="M 50 34 C 46 38, 42 44, 38 49 C 36 51, 35 53, 34 53" fill="none" stroke="black" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Left guard fist -->
  <path d="M 32 51 C 30 50, 28 52, 29 54 C 30 56, 32 56, 33 54 C 34 52, 33 51, 32 51" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Right leg (forward lunge) -->
