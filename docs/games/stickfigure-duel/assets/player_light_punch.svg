  <!-- Head roughness overlay -->
  <path d="M 47 11 C 52 9, 56 10, 58 15 C 60 20, 59 25, 56 28" fill="none" stroke="black" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

  <!-- Torso - slight forward lean -->
