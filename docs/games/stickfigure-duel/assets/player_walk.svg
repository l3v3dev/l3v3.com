  <!-- Sword crossguard -->
  <path d="M 83 57 Q 86 54 90 57" fill="none" stroke="black" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Front leg (right) stepping forward -->
  <path d="M 61 70 Q 67 79 73 87 Q 77 94 81 104" fill="none" stroke="black" stroke-width="3.4" stroke-linecap="round"/>
  <!-- Front foot -->
  <path d="M 81 104 Q 85 107 90 107" fill="none" stroke="black" stroke-width="2.7" stroke-linecap="round"/>
  <!-- Back leg (left) stepping back -->
  <path d="M 61 70 Q 55 79 49 87 Q 45 94 41 104" fill="none" stroke="black" stroke-width="3.4" stroke-linecap="round"/>
  <!-- Back foot -->
  <path d="M 41 104 Q 37 107 32 106" fill="none" stroke="black" stroke-width="2.7" stroke-linecap="round"/>
  <!-- Rough texture strokes for hand-drawn feel -->
  <path d="M 62 71 Q 68 80 74 88" fill="none" stroke="black" stroke-width="1.3" stroke-linecap="round" opacity="0.5"/>
  <path d="M 60 71 Q 54 80 48 88" fill="none" stroke="black" stroke-width="1.3" stroke-linecap="round" opacity="0.5"/>
  <path d="M 67 35 Q 66 45 64 55" fill="none" stroke="black" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
  <!-- Small motion marks behind figure -->
  <path d="M 30 50 Q 27 52 25 55" fill="none" stroke="black" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  <path d="M 28 62 Q 25 64 23 67" fill="none" stroke="black" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
