
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Head - rough marker circle -->
  <path d="M 52 13 Q 61 12 62 21 Q 63 30 53 32 Q 43 33 42 23 Q 41 14 52 13" fill="none" stroke="black" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 53 14 Q 62 13 63 22 Q 62 31 52 31 Q 44 32 43 22 Q 42 15 53 14" fill="none" stroke="black" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Torso - slight lean back -->
