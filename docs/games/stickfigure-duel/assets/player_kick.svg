  <path d="M 53 33 Q 51 43 50 53 Q 49 59 48 63" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Kicking leg - extended high up and to the right -->
  <path d="M 47 64 Q 58 56 70 48 Q 82 40 94 33 Q 100 30 106 27" fill="none" stroke="black" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 48 65 Q 59 57 71 49 Q 83 41 95 34 Q 101 31 107 28" fill="none" stroke="black" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Kicking foot -->
  <path d="M 106 27 Q 111 24 114 19" fill="none" stroke="black" stroke-width="3.8" stroke-linecap="round"/>
  <path d="M 107 28 Q 112 25 115 20" fill="none" stroke="black" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Supporting leg - planted down -->
  <path d="M 47 64 Q 45 74 43 84 Q 41 94 39 104 Q 38 108 37 110" fill="none" stroke="black" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 48 65 Q 46 75 44 85 Q 42 95 40 105 Q 39 109 38 111" fill="none" stroke="black" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Supporting foot -->
  <path d="M 37 110 Q 33 112 28 112" fill="none" stroke="black" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M 38 111 Q 34 113 29 113" fill="none" stroke="black" stroke-width="2" stroke-linecap="round"/>

  <!-- Back arm - reaching back for balance -->
  <path d="M 52 36 Q 44 40 37 46 Q 30 52 25 58 Q 23 60 22 62" fill="none" stroke="black" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 51 37 Q 45 41 38 47 Q 31 53 26 59 Q 24 61 23 63" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Front arm - reaching forward and up for balance -->
  <path d="M 52 36 Q 59 37 66 35 Q 73 33 79 29 Q 82 27 84 25" fill="none" stroke="black" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 53 37 Q 60 38 67 36 Q 74 34 80 30 Q 83 28 85 26" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
