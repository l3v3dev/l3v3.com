
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e2a"/>
      <stop offset="100%" stop-color="#020208"/>
    </linearGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="55%" stop-color="#aaffee" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00ffcc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ccffee" stop-opacity="0.4"/>
    </radialGradient>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="wideGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="roundedClip">
      <rect x="0" y="0" width="512" height="512" rx="48" ry="48"/>
    </clipPath>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask">
      <rect width="512" height="512" fill="url(#gridFade)"/>
    </mask>
  </defs>

  <g clip-path="url(#roundedClip)">
    <rect width="512" height="512" fill="url(#bgGrad)"/>

    <!-- Subtle grid lines fading downward -->
    <g mask="url(#gridMask)" stroke="#1e2860" stroke-width="0.6">
      <line x1="0" y1="64" x2="512" y2="64"/>
      <line x1="0" y1="128" x2="512" y2="128"/>
      <line x1="0" y1="192" x2="512" y2="192"/>
      <line x1="0" y1="256" x2="512" y2="256"/>
      <line x1="0" y1="320" x2="512" y2="320"/>
      <line x1="0" y1="384" x2="512" y2="384"/>
      <line x1="0" y1="448" x2="512" y2="448"/>
      <line x1="64" y1="0" x2="64" y2="512"/>
      <line x1="128" y1="0" x2="128" y2="512"/>
      <line x1="192" y1="0" x2="192" y2="512"/>
      <line x1="256" y1="0" x2="256" y2="512"/>
      <line x1="320" y1="0" x2="320" y2="512"/>
      <line x1="384" y1="0" x2="384" y2="512"/>
      <line x1="448" y1="0" x2="448" y2="512"/>
    </g>

    <!-- Magenta ghostly secondary curve (behind, slightly offset) -->
    <path d="M 12,272 C 97,212 182,212 268,272 C 354,332 439,332 524,272"
          fill="none" stroke="#ff5599" stroke-width="2" opacity="0.22"
          stroke-linecap="round" filter="url(#softGlow)"/>

    <!-- Cyan sine-wave curve bridge with outer glow -->
    <path d="M -10,256 C 75,192 171,192 256,256 C 341,320 437,320 522,256"
          fill="none" stroke="#00ffcc" stroke-width="8" opacity="0.15"
          stroke-linecap="round" filter="url(#wideGlow)"/>
    <path d="M -10,256 C 75,192 171,192 256,256 C 341,320 437,320 522,256"
          fill="none" stroke="#00ffcc" stroke-width="3" opacity="0.9"
          stroke-linecap="round" filter="url(#cyanGlow)"/>

    <!-- Cyan ring portal arc in upper right corner -->
    <path d="M 410,38 A 62,62 0 0,1 488,116"
          fill="none" stroke="#00ffcc" stroke-width="2.5" opacity="0.45"
          stroke-linecap="round" filter="url(#cyanGlow)"/>
    <path d="M 418,48 A 50,50 0 0,1 478,108"
          fill="none" stroke="#00ffcc" stroke-width="1.5" opacity="0.25"
          stroke-linecap="round"/>

    <!-- White orb - wide soft glow -->
    <circle cx="256" cy="256" r="52" fill="url(#orbGlow)" opacity="0.5"/>

    <!-- White orb - medium glow -->
    <circle cx="256" cy="256" r="28" fill="url(#orbGlow)" opacity="0.7" filter="url(#softGlow)"/>

    <!-- White orb - bright core -->
    <circle cx="256" cy="256" r="14" fill="url(#orbCore)" filter="url(#cyanGlow)"/>

    <!-- White orb - hot center -->
    <circle cx="256" cy="256" r="7" fill="#ffffff"/>
  </g>

  <!-- Subtle rounded border -->
  <rect x="1" y="1" width="510" height="510" rx="47" ry="47"
        fill="none" stroke="#1a2050" stroke-width="1.5" opacity="0.4"/>
</svg>
