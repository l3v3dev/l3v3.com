<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>l3v3 | Math Path 3D | 3D math puzzle game</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #020208;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #020208;
      touch-action: none; /* stop scroll/zoom gestures on the 3D canvas */
    }

    /* ---------- Loading indicator ---------- */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020208;
      color: #00ffcc;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 0 14px rgba(0, 255, 204, 0.6);
      z-index: 100;
    }

    /* ---------- HUD overlay ---------- */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
      z-index: 10;
    }
    .top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      display: flex;
      align-items: center;
      gap: 18px;
      background: rgba(26, 31, 53, 0.85);
      border: 2px solid #3a4a7a;
      border-radius: 12px;
      padding: 8px 16px;
      font-size: 18px;
    }
    .best {
      color: #ffd75e;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(255, 215, 94, 0.5);
    }
    .best-line {
      font-size: 18px;
      color: #ffd75e;
      margin: 0 0 18px;
    }
    .new-best {
      font-size: 26px;
      font-weight: 800;
      color: #ffd75e;
      text-shadow: 0 0 14px rgba(255, 215, 94, 0.8);
      animation: toast-pop 0.3s ease-out;
    }
    .lives {
      display: flex;
      gap: 5px;
    }
    .life {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #88aaff 70%, #4466cc 100%);
      display: inline-block;
      transition: opacity 0.3s;
    }
    .life.lost {
      opacity: 0.2;
    }
    .mute-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      pointer-events: auto;
      width: 44px;
      height: 44px;
      font-size: 22px;
      background: rgba(26, 31, 53, 0.85);
      border: 2px solid #3a4a7a;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
    }
    .pause-btn {
      position: absolute;
      top: 12px;
      right: 64px; /* sits just left of the mute button */
      pointer-events: auto;
      width: 44px;
      height: 44px;
      font-size: 22px;
      background: rgba(26, 31, 53, 0.85);
      border: 2px solid #3a4a7a;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
    }
    .minimap {
      position: absolute;
      top: 70px;
      left: 12px;
      width: 240px;
      height: 150px;
      background: rgba(16, 20, 40, 0.85);
      border: 2px solid #3a4a7a;
      border-radius: 10px;
      box-shadow: 0 0 18px rgba(58, 74, 122, 0.4);
    }
    .crumble-timer {
      position: absolute;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 40px;
      font-weight: 800;
      color: #ff3344;
      text-shadow: 0 0 12px rgba(255, 51, 68, 0.8);
    }
    .toast {
      position: absolute;
      top: 110px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      font-weight: 700;
      color: #00ffcc;
      background: rgba(16, 20, 40, 0.85);
      border: 2px solid #00aa88;
      border-radius: 10px;
      padding: 8px 18px;
      text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
      animation: toast-pop 0.25s ease-out;
    }
    @keyframes toast-pop {
      from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(2, 2, 8, 0.82);
      pointer-events: auto;
      padding: 24px;
    }
    .screen h1 {
      font-size: 44px;
      margin: 0 0 12px;
      color: #00ffcc;
      text-shadow: 0 0 18px rgba(0, 255, 204, 0.6);
    }
    .screen p {
      max-width: 520px;
      font-size: 18px;
      line-height: 1.5;
      color: #cdd6ff;
    }
    .start-btn,
    .play-again-btn {
      pointer-events: auto;
      margin-top: 22px;
      padding: 14px 40px;
      font-size: 22px;
      font-weight: 700;
      color: #020208;
      background: #00ffcc;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
    }
    .start-btn:hover,
    .play-again-btn:hover {
      background: #66ffe0;
    }

    /* ---------- 2D function option panel ---------- */
    .option-panel {
      position: absolute;
      top: 50%;
      right: 16px;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(16, 20, 40, 0.88);
      border: 2px solid #3a4a7a;
      border-radius: 14px;
      padding: 14px;
      pointer-events: auto;
      box-shadow: 0 0 24px rgba(58, 74, 122, 0.5);
    }
    .option-panel-title {
      font-size: 15px;
      font-weight: 700;
      color: #00ffcc;
      text-align: center;
      margin-bottom: 2px;
    }
    .option-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .option-row.clickable {
      cursor: pointer;
      border-radius: 8px;
      padding: 2px;
      transition: background 0.15s;
    }
    .option-row.clickable:hover {
      background: rgba(0, 255, 204, 0.12);
    }
    .option-badge {
      min-width: 34px;
      height: 34px;
      flex: 0 0 auto;
      padding: 0 8px;
      border: 2px solid;
      border-radius: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .option-plot {
      display: block;
      border-radius: 6px;
    }

    /* ---------- Touch controls ---------- */
    #touch-controls {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }
    .dpad {
      position: absolute;
      left: 20px;
      bottom: 24px;
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(3, 56px);
      gap: 6px;
    }
    .dpad-btn {
      pointer-events: auto;
      width: 56px;
      height: 56px;
      font-size: 20px;
      color: #fff;
      background: rgba(42, 47, 69, 0.85);
      border: 2px solid #4a5a8a;
      border-radius: 12px;
      cursor: pointer;
    }
    .dpad-up { grid-column: 2; grid-row: 1; }
    .dpad-left { grid-column: 1; grid-row: 2; }
    .dpad-down { grid-column: 2; grid-row: 3; }
    .dpad-right { grid-column: 3; grid-row: 2; }
    .jump-btn {
      position: absolute;
      right: 28px;
      bottom: 40px;
      pointer-events: auto;
      width: 84px;
      height: 84px;
      font-size: 30px;
      color: #fff;
      background: rgba(42, 47, 69, 0.85);
      border: 2px solid #00ccaa;
      border-radius: 50%;
      cursor: pointer;
    }
  </style>
